  .hero-bar .wrap{grid-template-columns:1fr;gap:1rem;padding-block:1rem}.scroll-cue,.slide-n{display:none}
  .state-grid,.jr,.ai-grid{grid-template-columns:1fr}.jr-l{position:static}
  .stats4{grid-template-columns:1fr 1fr}.stats4>div:nth-child(3){padding-inline-start:0}.stats4>div:nth-child(n+3){border-top:1px solid rgb(255 255 255 / 14%);margin-top:2rem}

/* chat header: title and subtitle on their own lines */

.ch-head small{display:block;line-height:1.3;margin-top:.15rem}
.ch-tools{gap:.3rem}.ch-tools button{width:32px;height:32px}
/* compare table edges */
.cmptable{width:100%;border-collapse:collapse}
/* signed-in portal: no sign-in or apply links in the top bar */
.in-portal .hdr .hl[data-go="portal-student"],.in-portal .hdr .apply-l{display:none}
/* closed side panel must not cast its shadow onto the page edge */
.drawer{transition:transform .5s var(--ease),visibility 0s .5s}
.drawer:not(.on){box-shadow:none;visibility:hidden}
.drawer.on{visibility:visible;transition:transform .5s var(--ease)}
:root{--g:clamp(20px,3.2vw,56px)}
.tabbar,.crow .cimg,.ftoggle{display:none}

.calc{grid-template-columns:minmax(0,1fr) minmax(0,420px)}
.sum,.offer{position:sticky;overflow:hidden}
@media (max-width:1120px){.sum{position:relative}}
@media (max-width:1120px){.calc,.apply{grid-template-columns:minmax(0,1fr)}.calc>*{min-width:0}}
/* the cursor-follower uses the class "cur"; keep the current-step item visible */
.steps li.cur{opacity:1;transform:none;position:relative}
/* ===== phone UI (up to 820px): its own layout, not a shrunk desktop =====
   bottom tab bar, swipe rails for courses and news, filters behind a button,
   larger tap targets, images that settle into place as they scroll in */
@media (max-width:820px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .fab,.totop{display:none!important}
  .hdr .menu-btn,.hdr .apply-l,.hdr .hl[data-go]{display:none!important}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset:auto 0 0 0;z-index:130;background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a,.tabbar button{display:grid;justify-items:center;align-content:center;gap:.25rem;min-height:62px;padding:.4rem 0;background:none;border:0;color:var(--ink-3);font:600 .75rem/1.1 var(--f-body);letter-spacing:.03em;text-decoration:none;position:relative;-webkit-tap-highlight-color:transparent}
  .tabbar .ic{width:22px;height:22px}
  .tabbar .on{color:var(--ink)}
  .tabbar .on::before{content:'';position:absolute;top:0;left:50%;width:22px;height:2px;margin-left:-11px;background:var(--ink)}
  .tabbar .apply{color:var(--ink)}
  .tabbar .apply .ic{box-sizing:content-box;width:20px;height:20px;padding:10px;margin-top:-20px;background:var(--cta);color:var(--on-cta);box-shadow:0 8px 20px rgb(0 20 50 / 22%)}
  body.chat-open .tabbar{display:none}
  .tray{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .tray:not(.on){visibility:hidden}
  .foot-top{grid-template-columns:1fr 1fr;gap:1.2rem 1rem}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .toast:not(.on){visibility:hidden}
  .menu-l{padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px))}
  .hero-bar .wrap{padding-block-end:calc(1rem + 66px + env(safe-area-inset-bottom,0px))}
  .finder label{min-height:56px}
  /* page heads */
  .phead{min-height:clamp(300px,44svh,420px)}
  .phead h1{font-size:clamp(2.4rem,11.5vw,3.6rem)}
  .phead p{font-size:1.05rem}
  /* sections */
  .sec{padding-block:3.5rem}
  .sec-head{grid-template-columns:1fr;gap:1.2rem}.sec-head .btn{justify-self:start}
  .foot-top>div:first-child{grid-column:1/-1}
  .foot .lg img{width:190px}
  .hdr .wrap{gap:.5rem;min-width:0}
  .hdr .brand{min-width:0;flex:0 1 auto}.hdr .brand img{max-width:40vw;height:auto}
  .hdr-r{gap:0;flex:none}
  .hdr-r #b-lang span{display:none}
  .hdr .brand img{max-width:36vw}
  .hdr-r .ib,.hdr-r .hl{min-width:44px;min-height:44px;padding-inline:.5rem;justify-content:center}
  .shell{grid-template-columns:minmax(0,1fr)}.side,.main{min-width:0}
  .prose,.prose *{overflow-wrap:anywhere}.prose table{overflow-wrap:normal}
  .cols,.calc{grid-template-columns:minmax(0,1fr)}.cols>*,.calc>*,.stack>*,.sum,.panel{min-width:0}
  .main .row{flex-wrap:wrap}
  .tabbar .apply.on::before{display:none}
  .prose>p:first-of-type{font-size:1.35rem;line-height:1.4}
  .prose h2{font-size:1.9rem}
  .state-grid{gap:1.6rem}
  .statement{font-size:clamp(1.6rem,7vw,2.2rem)}
  /* tap targets */
  .foot a{padding:.8rem 0}
  .crumbs a,.crumbs span{padding:.55rem 0}
  .q-dots button{height:28px;background:none}
  .q-dots button::after{content:'';position:absolute;inset:13px 0;background:var(--line-2)}
  .q-dots button.on::after{background:var(--ink-3)}
  input[type=range]{height:44px}
  .btn-sm{min-height:44px}
  /* swipe rails */
  .clist{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--g);margin-inline:calc(var(--g) * -1);padding:0 var(--g) 10px;border-top:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .clist::-webkit-scrollbar{display:none}
  .crow{flex:0 0 78%;max-width:340px;scroll-snap-align:start;display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0;border:1px solid var(--line-2);background:var(--surface);align-items:start}
  .crow:hover{padding-inline:0}
  .crow::before,.crow .ix,.crow .ar{display:none}
  .crow .cimg{display:block;grid-column:1/-1;aspect-ratio:4/3;overflow:hidden}
  .crow .cimg img{width:100%;height:100%;object-fit:cover}
  .crow .ti{grid-column:1/-1;padding:1.1rem 1.1rem .6rem;font-size:1.6rem}
  .crow .m{padding:0 1.1rem 1.1rem}
  .news-rail{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--g);margin-inline:calc(var(--g) * -1);padding:0 var(--g) 10px;scrollbar-width:none}
  .news-rail::-webkit-scrollbar{display:none}
  .news-rail .nw{flex:0 0 80%;max-width:340px;scroll-snap-align:start}
  /* filters fold behind a button */
  .ftoggle{display:inline-flex;width:100%;justify-content:center;margin-bottom:1rem}
  .filters.fold{display:none;position:static}
  .filters.fold.open{display:block;margin-bottom:1.4rem}
  .catalog{padding-block:1.5rem 4rem}
}
/* images settle into place as they scroll into view (browsers with scroll-driven animations) */
@keyframes settle{from{scale:1.16}to{scale:1}}
@media (max-width:820px){
  @supports (animation-timeline:view()){
    .cc .im img,.nw .ph img,.fg img,.crow .cimg img,.state-fig img,.gi .im img{animation:settle linear both;animation-timeline:view();animation-range:entry 0% cover 50%}
  }
}
@media (max-width:820px) and (prefers-reduced-motion:reduce){.cc .im img,.nw .ph img,.fg img,.crow .cimg img,.state-fig img,.gi .im img{animation:none}}

/* ===== phone polish (audit pass): touch targets, rails, compare, stepper, hero legibility ===== */
@media (max-width:820px){
  /* course cards: shorter photo so a card is not a full screen tall */
  .cc .im{aspect-ratio:16/10}
  /* touch targets >= 44px */
  .chipset label span,.filters label,.crumbs a,.crumbs span,.prose a,.foot a,.cmp,.q-dots button,.tags a,.btn-sm,.chat-sug button,.sug button{min-height:44px;display:inline-flex;align-items:center}
  .cmp{gap:.7rem}.cmp input{width:22px;height:22px}
  .finder select,.fld select,.fld input{min-height:48px}
  .cc .cmp,.prose p>a,.cc a{padding-block:.35rem}
  /* hero: stronger scrim so copy reads over photos */
  .hero-bg::after,.hero .shade{background:linear-gradient(180deg,rgb(0 20 40 / 55%) 0%,rgb(0 20 40 / 35%) 40%,rgb(0 20 40 / 78%) 100%)}
  .hero h1,.hero .lead,.hero p{text-shadow:0 1px 18px rgb(0 20 40 / 55%)}
  /* breadcrumbs on photo heads */
  .crumbs{opacity:.92}.crumbs svg,.crumbs i{width:12px;height:12px;opacity:.8}
  /* life-at-PBRS rail keeps the page gutter and peeks the next card */
  .hpin-track,.gal{padding-inline:var(--g,20px);scroll-padding-inline:var(--g,20px)}
  .hpin-track>*{flex:0 0 78%}
  /* compare: narrow sticky label column, ~two courses visible */
  .cmptable{min-width:0!important;table-layout:auto}
  .cmptable th:first-child{position:sticky;inset-inline-start:0;z-index:1;background:var(--bg);width:92px;min-width:92px;max-width:92px;padding-inline:.5rem;font-size:.72rem;box-shadow:1px 0 0 var(--line)}
  .cmptable td{min-width:44vw}
  .cmptable a{display:inline-flex;align-items:center;min-height:44px}
  /* contact numbers never split mid-number */
  .cinfo b+br+*,.cinfo{overflow-wrap:anywhere}
  .nw-num,.tel{white-space:nowrap}
  /* apply stepper: six steps fit; current one shows its label */
  .apply .steps{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none;padding-bottom:.4rem;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);scroll-snap-type:x proximity}
  .apply .steps::-webkit-scrollbar{display:none}
  .apply .steps li{padding:.5rem .35rem;gap:.5rem;flex:none}
  .apply .steps .b{width:30px;height:30px}
  /* full-screen menu: less dead space above the first link */
  .menu-grid{padding-top:calc(var(--nav-h) * .85)}
}

/* ===== hero finder: quiet glass bar (was solid white + orange block) ===== */
.finder{background:rgb(255 255 255 / 9%);color:#fff;border:1px solid rgb(255 255 255 / 28%);box-shadow:0 18px 50px rgb(0 15 35 / 22%);-webkit-backdrop-filter:blur(16px) saturate(120%);backdrop-filter:blur(16px) saturate(120%)}
.finder label{border-inline-start-color:rgb(255 255 255 / 22%);transition:background .3s var(--ease)}
.finder label:hover,.finder label:focus-within{background:rgb(255 255 255 / 10%)}
.finder span{color:rgb(255 255 255 / 68%)}
.finder select{color:#fff;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%)}
.finder select option{color:#0b2540;background:#fff}
.finder .go{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px var(--cta);border-inline-start:1px solid rgb(255 255 255 / 22%);transition:background .3s var(--ease),color .3s var(--ease)}
.finder .go:hover,.finder .go:focus-visible{background:var(--cta);color:var(--on-cta)}
.finder .go:focus-visible{box-shadow:inset 0 0 0 3px #fff}
@media (max-width:820px){.finder{background:rgb(8 28 52 / 38%)}.finder label{border-top-color:rgb(255 255 255 / 20%)}}

/* ===== how it works: scroll journey ===== */
.how{overflow:clip}
.jr2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(2rem,6vw,7rem);align-items:start}
.jr2-l{position:sticky;top:calc(var(--nav-h) + 2.5rem)}
.jr2-l h2{margin-top:1.4rem}
.jr2-count{margin-top:3.2rem;display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:.2rem .8rem;max-width:20rem}
.jr2-count b{font-family:var(--f-display);font-size:clamp(4rem,8vw,7rem);line-height:.9;font-weight:400;color:var(--ink);font-variant-numeric:lining-nums}
.jr2-count span{font-size:.78rem;letter-spacing:.2em;font-weight:700;color:var(--ink-3)}
.jr2-count i{grid-column:1/-1;display:block;height:2px;background:var(--line-2);margin-top:1rem;overflow:hidden}
.jr2-count u{display:block;height:100%;background:var(--cta);transform-origin:left;transform:scaleX(.1667);transition:transform .7s var(--ease)}
[dir="rtl"] .jr2-count u{transform-origin:right}
.jr2-list{list-style:none;margin:0;padding:0;display:grid;gap:1.2rem;position:relative;padding-inline:3.4rem .9rem}
.jr2-rail{position:absolute;inset-block:1rem;inset-inline-start:11px;width:2px;background:var(--line-2)}
.jr2-rail i{position:absolute;inset:0;background:var(--cta);transform-origin:top;transform:scaleY(0)}
.jr2-i{position:relative;display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:start;padding:1.8rem 2rem;border:1px solid var(--line-2);background:transparent;opacity:.5;transition:opacity .6s var(--ease),background .6s var(--ease),color .6s var(--ease),border-color .6s var(--ease),transform .6s var(--ease)}
.jr2-i .dot{position:absolute;inset-inline-start:calc(-3.4rem + 12px - 8px + 1px);top:2.3rem;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);transition:background .4s,border-color .4s,transform .4s var(--ease)}
.jr2-i .n{font-family:var(--f-display);font-size:clamp(2.6rem,4.6vw,4rem);line-height:.9;color:transparent;-webkit-text-stroke:1px var(--ink-3);font-variant-numeric:lining-nums;min-width:1.7ch}
.jr2-i h3{font-size:clamp(1.6rem,2.4vw,2.1rem);margin-bottom:.4rem}
.jr2-i p{color:var(--ink-2);max-width:42ch}
.jr2-i.done{opacity:.85}
.jr2-i.done .dot{background:var(--cta);border-color:var(--cta)}
.jr2-i.done .n{-webkit-text-stroke-color:var(--cta-ink)}
.jr2-i.on{opacity:1;background:var(--band);color:#fff;border-color:var(--band);transform:translateX(.8rem);box-shadow:0 26px 60px rgb(0 30 60 / 22%)}
[dir="rtl"] .jr2-i.on{transform:translateX(-.8rem)}
.jr2-i.on .dot{background:var(--cta);border-color:var(--cta);transform:scale(1.35)}
.jr2-i.on .n{color:var(--cta);-webkit-text-stroke:0}
.jr2-i.on p{color:rgb(255 255 255 / 76%)}
@media (max-width:980px){
  .jr2{grid-template-columns:1fr}.jr2-l{position:static}
  .jr2-count{display:none}
}
@media (max-width:560px){
  .jr2-list{padding-inline-start:2.4rem}.jr2-rail{inset-inline-start:7px}
  .jr2-i{grid-template-columns:1fr;gap:.5rem;padding:1.3rem 1.2rem}
  .jr2-i .dot{inset-inline-start:calc(-2.4rem + 8px - 8px + 1px);top:1.5rem}
  .jr2-i .n{font-size:2.4rem}
  .jr2-i.on{transform:none}
}
@media (prefers-reduced-motion:reduce){.jr2-i,.jr2-i .dot,.jr2-count u{transition:none}.jr2-i.on{transform:none}}

/* ===== clean pass: no decorative numbering or icons ===== */
.crow{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr) minmax(0,1fr) 60px}
.jr2-i{grid-template-columns:1fr}
.jr2-i h3{margin-top:.1rem}
.jr2-l .btn{margin-bottom:0}
.cinfo{gap:.2rem}
.meta{gap:.9rem;flex-wrap:wrap}
.medal{padding-inline:.8rem}
.m-row{gap:0}

/* ===== soft surfaces: no outlined boxes. Cards are filled and softly lifted, corners are rounded, dividers are hairlines ===== */
:root:root:root{--r:14px;--r-sm:10px;--r-lg:22px;--card-shadow:0 1px 2px rgb(4 27 51 / 4%),0 10px 30px rgb(4 27 51 / 7%)}
html[data-theme="dark"]:root:root:root{--card-shadow:0 1px 2px rgb(0 0 0 / 30%),0 10px 30px rgb(0 0 0 / 30%)}
.tcard,.panel,.sidecard,.cinfo,.acc,.job,.kpi,.welcome,.path,.upl-row,.kv div,.tbl-wrap,.ai-demo,.cal,.tl>div,.filters,.map,.state-fig{border:0;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--card-shadow)}
.filters{padding:1.4rem 1.4rem 1.6rem}
.kv div{box-shadow:none;background:var(--surface-2);border-radius:var(--r)}
.map{overflow:hidden}
.sum,.offer,.cta-band,.cc,.pop,.tray,.pal,.modal,.drawer,.toast,.chat{border-radius:var(--r-lg)}
.chat,.pal,.tray,.modal,.drawer{border:0;box-shadow:var(--shadow-lg)}
.ch-head{border-radius:var(--r-lg) var(--r-lg) 0 0}
@media (max-width:820px){.chat{border-radius:0}.ch-head{border-radius:0}}
/* images soften with the cards */
.ph,.crow .cimg,.cimg,.news-rail img,.card img,.ccard img{border-radius:var(--r)}
.hpin .cell,.hpin figure,.hpin img{border-radius:var(--r)}
/* buttons and chips */
.btn,.hl.apply-l{border-radius:999px}
.btn-line,.btn-brand,.btn-ghost{border-radius:999px}
.pill,.sample,.lang-note,.fld-tag,.lvl,.medal{border-radius:999px}
.fld-tag,.pill,.sample{border-color:transparent;background:var(--surface-2)}
.medal{border-color:transparent;background:var(--cta-soft)}
.finder{border-radius:var(--r-lg);overflow:hidden}
.finder .go{border-radius:0}
.switch{border-radius:var(--r);border-color:transparent;background:var(--surface-2)}
.stepper-n{border-radius:50%}
/* accordions and lists: soft rows with hairline separators inside the card */
.acc{padding-inline:1.4rem}
.acc+.acc{margin-top:.8rem}
/* form fields keep the clean underline but get a soft hover/focus fill */
.fld input,.fld select,.fld textarea{border-radius:var(--r-sm) var(--r-sm) 0 0;transition:background .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{background:var(--surface-2)}

/* the big step counter beside the journey list is removed */
.jr2-count{display:none}
.hpin-n{display:none}

/* journey cards follow the soft-surface look */
.jr2-i{border:0;border-radius:var(--r-lg,22px);background:var(--surface);box-shadow:0 1px 0 rgb(0 30 60 / 4%),0 10px 30px rgb(0 30 60 / 6%)}
.jr2-i.on{background:var(--band);box-shadow:0 26px 60px rgb(0 30 60 / 24%)}

/* ===== courses section: photo background that follows the hovered course ===== */
.cs{position:relative;isolation:isolate;overflow:hidden;color:#fff;background:var(--band);padding-block:clamp(5rem,9vw,8.5rem)}
.cs-bg{position:absolute;inset:0;z-index:-2}
.cs-bg img{position:absolute;left:0;top:-9%;width:100%;height:118%;object-fit:cover;opacity:0;transition:opacity 1.1s var(--ease);will-change:transform,opacity}
.cs-bg img.on{opacity:1;animation:csk 22s ease-out both}
@keyframes csk{from{scale:1.05}to{scale:1.14}}
.cs-scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgb(3 31 58 / 92%) 0,rgb(3 31 58 / 66%) 38%,rgb(3 31 58 / 86%) 100%),radial-gradient(120% 90% at 20% 30%,rgb(3 31 58 / 0%),rgb(3 31 58 / 45%))}
.cs .eyebrow{color:rgb(255 255 255 / 78%)}
.cs h2{color:#fff}
.cs .sec-head .btn-line{color:#fff;border:1px solid rgb(255 255 255 / 45%);background:transparent}
.cs .sec-head .btn-line:hover{background:#fff;color:var(--band)}
.cs .crow{color:#fff}
@media (min-width:821px){
  .cs .clist{border-top:1px solid rgb(255 255 255 / 28%)}
  .cs .crow{border-bottom:1px solid rgb(255 255 255 / 22%);transition:opacity .5s var(--ease),padding .5s var(--ease)}
  .cs .crow::before{background:rgb(255 255 255 / 9%)}
  .cs .clist:hover .crow:not(:hover){opacity:.5}
  .cs .crow .ti small{color:rgb(255 255 255 / 70%)}
  .cs .crow .m{color:rgb(255 255 255 / 75%)}
  .cs .crow .m b{color:#fff}
  .cs .crow .ar{border-color:rgb(255 255 255 / 45%)}
  .cprev{display:none!important}
}
@media (max-width:820px){
  .cs{padding-block:4rem}
  .cs .crow{color:var(--ink);border:0;border-radius:var(--r-lg);box-shadow:0 10px 30px rgb(0 0 0 / 28%);overflow:hidden}

@media (prefers-reduced-motion:reduce){.cs-bg img.on{animation:none}.cs-bg img{transition:none}}

/* ===== open layout: no box model. Content sits on the page, separated by hairlines; only photos, pills and the main call-to-action panels keep a shape ===== */
.panel,.filters,.tbl-wrap,.tcard,.cinfo,.acc,.job,.kpi,.welcome,.path,.upl-row,.tl>div,.ai-demo,.cal,.kv div,.switch{background:transparent;box-shadow:none;border-radius:0}
.panel{padding-inline:0}
.filters{padding:0}
.tbl-wrap{border:0}
.tcard,.cinfo,.job,.path,.upl-row,.tl>div,.acc{border:0;border-top:1px solid var(--line-2);padding-block:1.4rem}
.acc{padding-inline:0}.acc+.acc{margin-top:0}
.kv div{border:0;border-top:1px solid var(--line-2);padding-block:.9rem}
.switch{border:0;border-top:1px solid var(--line-2);padding-inline:0}
.stats4>div,.stats4 div{border-inline:0}
.stats4{border-inline:0}
/* chips and pills */
.chipset span,.chipset input:checked+span{border-radius:999px}
.chipset span{padding-inline:1.1rem}
.finder{border-radius:999px;overflow:hidden;padding-inline:.4rem .4rem}
.finder label:first-child{padding-inline-start:1.6rem}
.finder .go{border-radius:999px;margin:.35rem}
/* photos get the one rounded corner */
.cc .im,.nw .ph,.gi .im,.fg,.fg img,.state-fig img,.prose img,.cmptable img,.sidecard img,.ph-av,.cimg,.cimg img,.tl img{border-radius:var(--r)}

/* the two focal panels stay as the only raised surfaces */

window.DATA={"courses":[{"id":"c4","slug":"nz-certificate-cookery-level-4","title":"New Zealand Certificate in Cookery (Level 4)","level":4,"field":"Cookery","duration":"1 year (36 weeks, 120 credits, four 9-week terms)","tuition":19500,"material":2000,"short":"Build the skills to work as a chef in intermediate positions producing complex dishes in a commercial kitchen.","entry":["Age 17 or older","Recognition of Prior Learning may be considered with proof of industry experience","IELTS (General or Academic) 5.5 overall with no band below 5, or an equivalent NZQA-approved English test"],"overview":"### Programme Introduction\n\nThe purpose of this qualification is:\n\n- To provide the hospitality sector with competent employees who are able to work as chefs in intermediate positions producing complex dishes in a commercial kitchen.\n- To provide individuals who are employed or will be employed as chefs in intermediate positions a qualification that will enhance their employment opportunities in a commercial kitchen across the hospitality sector.\n- To implement established standards of professional practice for complex cookery that can provide customers with confidence in a range of hospitality environments.\n\n### Course Highlights\n\nThe New Zealand Certificate in Cookery (Level 4) is a 36-week, 120 credit programme which will be delivered over four  9-week terms with a two-week break between terms.\n\nThe programme provides fundamental knowledge and skills in cookery as well as to develop practical skills and applied knowledge in specific areas such as:\n\n- health and safety in the workplace\n- food safety and security practices\n- application of standard operating policies and procedures\n- healthy eating, foods and special diets\n- internal and external customer interactions and communications\n- costing and menu planning\n- applied methods of cookery – preparing, cooking and finishing a wide range of complex dishes.\n\nIn addition, students will also gain ‘realistic work experience’ in preparing, cooling and presenting a range of dishes in modern, fully equipped commercial kitchens.\n\n### Course Structure\n\n**Module 1: PC401 Introduction to Cookery**\n\nThis module covers health and safety and food safety, an introduction to kitchen procedures with a focus on knife usage and safety skills, and preparation of basic stocks, soups and sauces, leading to preparation of cold foods such as salads and dressings, sandwiches, cold entrée items and canapés. Food safety is an essential part of all practical lessons and assessments. Practical tuition is based on methods of cookery and covers a comprehensive food range which enables students to progress from basic to complex food preparation, cooking and presentations.\n\n**Module 2: PC402 Cookery Fundamentals**\n\nThis module further develops cooking competence by learning how to prepare, cook and present a range of simple dishes and introduces pasta, rice and farinaceous dishes, vegetables, fruits and pulses. Basic nutrition is introduced. The student continues to develop skills and knowledge through teaching of methods of cookery using a broad variety of commodities and students are exposed to realistic work experience in the restaurant kitchen where they practice communication skills and teamwork in a realistic work environment with all associated time constraints and pressures.\n\n**Module 3: PC403 Applied Complex Cookery Skills**\n\nThis module further enhances cooking competence through teaching fish and shellfish, meat, poultry and offal dishes. All dishes are ‘complex’ with vegetables, sauces and starch commodities. Students complete work plans and present all dishes under time pressure with the expectation that the dishes served are standard and quality for a paying customer.\n\n**Module 4: PC404 Patisserie and Healthy Diets**\n\nThis module focuses on baking and finishing of bakery products, and preparation, cooking and finishing of hot and cold desserts. Healthy foods and special diets are studied in this module. Students complete an end-point assessment where they are required to plan, cost, prepare and cook a 3-course meal which is served in the ‘training’ restaurant to paying customers with all associated time constraints and pressures. At the end of the module students sit for a summative theory exam covering the theory of all units.","graduate":"On successful completion of this programme and having achieved all the graduate profile outcomes, graduates will be able to:\n\n- Monitor and maintain health and safety, food safety and security practices to ensure own safety and minimize potential hazards for customers.\n- Monitor and maintain effective communicate and interactions colleagues, other staff, managers and customers in a hospitality service environment.\n- Monitor and maintain the application of standard operating policies and procedures to work roles in a commercial kitchen.\n- Apply cookery skills to prepare, cook and present a range of cold larder dishes utilising complex preparation and presentation techniques.\n- Apply cookery skills to prepare, cook and present a range of hot kitchen dishes utilising complex preparation and presentation techniques.\n- Apply cookery skills to prepare, cook and present a range of patisserie and desserts utilising complex preparation and presentation techniques.","image":"/img/cookery.jpg?v=mvdpfoju"},{"id":"c5","slug":"international-diploma-cookery-supervision-level-5","title":"International Diploma in Food Preparation and Cookery Supervision (Advanced) (Level 5)","level":5,"field":"Cookery","duration":"2 years","tuition":31500,"material":3500,"short":"Advance into supervising food production, menu planning and costing, and event catering.","entry":["Age 17 or older","Recognition of Prior Learning may be considered with proof of industry experience","IELTS (Academic) 5.5 overall with no band below 5, or an equivalent NZQA-approved English test"],"overview":"### Programme Introduction\n\nThe purpose of this qualification is:\n\n- To provide the hospitality sector with competent employees who are able to work as chefs in intermediate positions producing complex dishes in a commercial kitchen.\n- To provide individuals who are employed or will be employed as chefs in intermediate positions a qualification that will enhance their employment opportunities in a commercial kitchen across the hospitality sector.\n- To implement established standards of professional practice for complex cookery that can provide customers with confidence in a range of hospitality environments.\n\n### Course Highlights\n\n- Supervise staff training\n- Food safety supervision for catering\n- Resource management in food preparation\n- Menu planning and costing\n- Global influences of eating & drinking\n- Supervise food production\n- Realistic work experience\n- Advanced food & beverage event\n- Advance applied food project\n\n### Course Structure\n\n- Module 1: PC 501 International cuisine studies\n- Module 2: PC 502 Advanced cold larder food production\n- Module 3: PC 503 Advanced hot kitchen food production\n- Module 4: PC 504 Kitchen operations\n- Module 5: PC 505 Advanced menu planning and restaurant service\n- Module 6: PC 506 Applied food service & event catering\n- Module 7: PC 507 Realistic work experience\n- Module 8: PC 508 Advanced applied food project","graduate":"On successful completion of this programme and having achieved all the graduate profile outcomes, graduates will be able to:\n\n- Monitor and maintain health and safety, food safety and security practices to ensure own safety and minimize potential hazards for customers.\n- Monitor and maintain effective communicate and interactions colleagues, other staff, managers and customers in a hospitality service environment.\n- Monitor and maintain the application of standard operating policies and procedures to work roles in a commercial kitchen.\n- Apply cookery skills to prepare, cook and present a range of cold larder dishes utilising complex preparation and presentation techniques.\n- Apply cookery skills to prepare, cook and present a range of hot kitchen dishes utilising complex preparation and presentation techniques.\n- Apply cookery skills to prepare, cook and present a range of patisserie and desserts utilising complex preparation and presentation techniques.","image":"/img/hero-team.jpg?v=mvdpfoju"},{"id":"fb4","slug":"nz-certificate-food-beverage-service-level-4","title":"New Zealand Certificate in Food and Beverage Service (Restaurant Services) (Level 4)","level":4,"field":"Hospitality","duration":"20 weeks, including a 2-week term break","tuition":null,"material":null,"short":"Prepare for restaurant service roles with advanced food and beverage service skills.","entry":["Age 18 or older (alcohol regulations)","Recognition of Prior Learning may be considered with proof of industry experience","IELTS (General or Academic) 5.5 overall with no band below 5, or an equivalent NZQA-approved English test"],"overview":"## New Zealand Certificate in Food and Beverage Service (Restaurant Services)-Level 4\n\n### Programme Introduction\n\n**The aim of this programme is to:**\n\n- To prepare graduates with advanced knowledge, skills and understanding of food and beverage service and provide competent employees who are able to work as food servers in the restaurant services secto\n- To provide for those individuals who are employed as food servers a qualification that will enhance their employment opportunities across a range of restaurant service establishments.\n- To implement established standards of professional practice for advanced food and beverage service that can provide customers with confidence in a range of restaurant service environments\n\n**Content**\n\nStudents will study the following modules over the 18-week duration of the programme:\n\nModule 202: Safety at Work\n\n- Module 203: Food Safety\n- Module 204: Customer Service\n- Module 207: Menu Knowledge and Design\n- Module 208: Hot Beverage Product Knowledge\n- Module 209: Beverage Product Knowledge\n- Module 210: Food and Beverage Service\n- Module 211: Handling Payments\n\n**Outcome**\n\nOn successful completion of the programme, graduates will have met all the graduate profile outcomes of the qualification.\n\n- Monitor and maintain health and safety, food safety and security practices to ensure own safety and minimise potential hazards when serving customers.\n- Monitor and maintain interactions between colleagues, managers and customers to provide efficient customer service.\n- Monitor and maintain the application of standard operating policies and procedures to work roles in a hospitality establishment.\n\nRestaurant Services strand:\n\n- Monitor and maintain food and beverage service operations.\n- Monitor and maintain legislative compliance requirements for a hospitality establishment.","graduate":"","image":"/img/slider-a.jpg?v=mvdpfoju"},{"id":"h5","slug":"nz-diploma-hospitality-management-level-5","title":"New Zealand Diploma in Hospitality Management (Level 5)","level":5,"field":"Hospitality","duration":"1 year","tuition":16000,"material":1500,"short":"A one-year route into supervisory and business management, through to starting your own business.","entry":["Age 18 or older (alcohol regulations)","Hold ONE of: Year 12 School Certificate or equivalent; NCEA Level 3; a Level 4 hospitality qualification or equivalent; at least two years of relevant work experience; or be 20 or older with the aptitude to succeed","International learners: IELTS (Academic) 5.5 with no band below 5, or another recognised proficiency outcome"],"overview":"## New Zealand Diploma in Hospitality Management – Level 5\n\n### Programme Introduction\n\nNew Zealand Diploma in Hospitality Management provides students with a pathway to enter the hospitality industry after only one year of study. You will learn supervisory management and business management right through to starting up your own business. You will also learn how to make sure the company you own or work for is profitable, the staff is competent and facilities are managed efficiently.\n\n### Course Highlights\n\nLearning from seasoned hospitality professional tutors and guest speakers this is a fast track intensive course to help accelerate you into management positions in the hospitality industry.\nThis course is suitable for all applicants who are ready to increase their employability and learn transferable skills that can be utilised in management within any industry.\n\n### Course Structure\n\n• Staff training and development\n• Licensed premises management\n• Human resources management\n• Hospitality management control systems\n• Business management\n• Hospitality facility control and management\n\nPBRS’ Diploma in Hospitality is an intensive course where students will learn to manage large enterprises from operational management, supervisory management, business training and assessments right through to starting up your own business.","graduate":"","image":"/img/hospitality.jpg?v=mvdpfoju"},{"id":"h6","slug":"nz-diploma-hospitality-management-level-6","title":"New Zealand Diploma in Hospitality Management (Level 6)","level":6,"field":"Hospitality","duration":"48 weeks including term breaks (120 credits, four 9-week terms)","tuition":14000,"material":1500,"short":"Develop the strategic, people and financial management skills for senior hospitality roles.","entry":["Age 18 or older","New Zealand Diploma in Hospitality Management Level 5, or equivalent with at least two years of hospitality work experience","International learners: IELTS (Academic) 6.0 overall with no band below 5.5, or another recognised proficiency outcome","Enrolment form and, where needed, an interview in person or by video"],"overview":"Students will be able to manage and develop staff to optimise positive customer experiences and enhance positive staff relationships through communication, consultation, negotiation and reporting strategies. The programme further enables students to strategies for the future in relation to financial management, product development, marketing and continuous improvement processes.\n\n**Employment pathway**\n\nThis programme is targeted for those who would like to enhance their career in management roles with minimal supervision across a range of setting in the hospitality sector. The graduates will be able to gain opportunities within the hospitality industry in trainee manager or assistant manager roles such as: Food and Beverage Manager, Event Manager, Banquet Manager, Bar Manager, Café Manager, Restaurant Manager, Duty Manager and Operations Manager and to demonstrate professional practice and provide customers with confidence in their roles.\n\n**","graduate":"","image":"/img/slider-a.jpg?v=mvdpfoju"}],"pages":{"about-us":{"title":"About Us","md":"Employment Focus Limited trading as the Professional Business and Restaurant School (PBRS) was established in 2000 and operates a specialist management and hospitality training institute. PBRS aims to provide high quality courses that are relevant to the needs of the hospitality industry and to the students. It is located in central Auckland with excellent access to hospitality outlets. Many of the other hospitality training institutions are located out of the city centre. PBRS is proud of its excellent reputation in the industry and the high esteem in which its graduates are held.\n\nPBRS acknowledges that it has an important role to play in ensuring that progress is made in the areas identified as Government priorities. It takes cognizance of the positive outlook for the hospitality industry and adopts a holistic approach to catering for the needs of its students.\n\nPBRS has a strong record of success in providing excellent outcomes for its students. All our facilities are modern with spacious classrooms and computer laboratories and five professional commercial training kitchens and a training restaurant. PBRS is a long-standing and reputable private training establishment (PTE) specialising in the provision of tertiary education and training for the hospitality industry. With campuses in Central Auckland, its goal is to provide high quality, relevant training and education supported by appropriate work experience to ensure that graduates have excellent career opportunities and/or a solid basis for further education in the field of hospitality.\n\n**Vision:**\nPBRS will be the most distinguished educational institution with a local and international reputation for excellence.\n\n**Mission:**\nTo provide quality and relevant education and professional training delivered by skilled and qualified teachers to meet industry, student and community needs.\n\n**Strategies:**\n\n1. Adopt a distinctive educational emphasis\n2. Provide a holistic learning, teaching and student experience that is unique\n3. Deepen engagement with alumni, industry and other stakeholders\n4. Strengthen PBRS’s capability\n\nOur Strategic Business Plan with our Renewed focus towards Building for Education Success can be viewed in detail through this link: [Strategic Business Plan](http://www.pbrs.ac.nz/wp/wp-content/uploads/2023/11/Strategic-Business-Plan-PBRS-2021-2024-Final-.pdf)\n\n**Values:**\nPBRS’s core ethical values are:\n\n- **Respect/Aroha:** We treat everyone with respect, empathy, hospitality and generosity, showing connection\n- **Excellence:** We strive to be extremely good or outstanding in all we do\n- **Equity:** We are fair and impartial with everyone\n- **Integrity:** We behave with honesty, showing strong moral principles\n- **Ako:** The effective partnership we aim to create through a two-way teaching and learning relationship\n\n**EER review**\n\nNZQA assesses the standard of education for tertiary education organisations through a regular system of external evaluation and review (EER). Through periodic EER, tertiary education organisations are held accountable to their students, employers, funders, quality assurance bodies and other interested parties.\n\nProfessional Business and Restaurant School (PBRS) <http://www.nzqa.govt.nz/providers/details.do?providerId=745571001>\n\nPBRS’s most recent EER was in 2022, where we retained our Category two status. The NZQA EER team was Confident in the educational performance and Confident in the capability in self- assessment of Employment Focus Limited ( T/A : PBRS: The Professional Business and Restaurant School )\n\n**Education Code of Practice 2021**\n\nThe [Education (Pastoral Care of Tertiary and International Learners) Code of Practice 2021 (the Code)](https://www.nzqa.govt.nz/providers-partners/tertiary-and-international-learners-code/) supports the wellbeing of tertiary and international learners enrolled with New Zealand education providers.\n\nFor the wellbeing and safety of their learners, education providers including PBRS must follow guidelines set out in the Education (Pastoral Care of International Students) Code of Practice 2021. These guidelines are meant to assist signatories and potential signatories in establishing practices that comply with legislative expectations and requirements.\n\nIn the Code, signatories are required to provide their international students with a range of outcomes, as well as key processes for supporting international students’ achievement, well-being, and rights.\n\nA Copy of the [Education (Pastoral Care of Tertiary and International Learners) Code of Practice 2021](https://www.nzqa.govt.nz/assets/Providers-and-partners/Code-of-Practice/Tertiary-and-International-Learners-Code-2021/NZQA_Pastoral-Care-Code-of-Practice_English.pdf) can be downloaded from this [Link](https://www.nzqa.govt.nz/assets/Providers-and-partners/Code-of-Practice/Tertiary-and-International-Learners-Code-2021/NZQA_Pastoral-Care-Code-of-Practice_English.pdf).\n\n**How does the Code relate to you as a learner ?**\n\nTo ensure that international students are well informed, safe and properly cared for when they come to study in New Zealand, PBRS (pastoral care) follows the code of practice, and through a dedicated support line, students have the right to be treated fairly at all ages and levels of education.\n\n**PBRS Self-Review Report**\n\nPlease find the link to access [PBRS self-review report can be accessed from here](http://www.pbrs.ac.nz/wp/wp-content/uploads/2023/10/2023-PBRS-Self-Review_Toolkit_Tertiary_Providers-Tool-E-Outcome-1-12-Final.pdf).\n\nIn our role as a tertiary provider, we ensure that our learners are aware of the Code, so that they will be protected and their wellbeing will be protected. For more information on how you can get to know the Code, [please click here](https://www.nzqa.govt.nz/providers-partners/tertiary-and-international-learners-code/know-the-code/).\n\n### Our Campus.\n\nThis is within walking distance of Auckland’s central train and bus stations, close to a variety of shops, restaurants and cafes as well as being located beside the highest structure in the Southern hemisphere, the iconic Sky Tower.\nThe Auckland campus has a purpose built training bar, equipped with industry recognised equipment and staffed by both New Zealand and international hospitality professionals. Our cookery qualifications are delivered in purpose built facilities located on campus.\n\nAs a specialist training institute we know the importance of studying in an environment that is completely orientated towards your industry of choice. PBRS combines highly qualified industry professional staff, purpose-built training facilities and a curriculum designed to meet the needs of employers. PBRS graduates are working world wide in bars, restaurants, hotels, cafes and on cruise ships: choose a career that’s going places and the institute that will take you there!"},"awards":{"title":"Awards & Recognition","md":"PBRS has a strong record of success in providing excellent outcomes for its students. For over 15 years, PBRS has achieved a myriad of successes and a reputation as a leading hospitality training establishment, winning the New Zealand Hospitality Championship, NZ Training Provider of the Year for 2014, 2016, 2017 and 2018 and winning the Auckland Regional Championships in 2019\n\n- 2014 New Zealand Training Establishment of the Year\n- 2016 New Zealand Training Establishment of the Year\n- 2017 New Zealand Training Establishment of the Year\n- 2018 New Zealand Training Establishment of the Year\n- 2017 Training Chef of the Year: Sio Sio Wang ( Cookery level 5 student )\n- 2017 Cocktail Supreme Champion of the Year : Mohit Sharma ( PBRS Tutor )\n- 2018 Training Chef of the Year: Carrie Eunsook IM ( Cookery level 5 student )\n- 2018 Training Service Person of the Year: Marisa Omaweng ( PBRS Hospitality student )\n\n### **Auckland Regional Championships 2019**\n\n### **13 Gold 7 Silver 6 Bronze!**\n\nThe Professional Business & Restaurant School (PBRS) which is part of Cornell Education Group participated in the Auckland Regional Hospitality Championships 2019 on 24th June. PBRS entered 26 students in 13 different categories this year with outstanding successIt is with great pride that we report our students’ excellent results:\n\nThis gratifying result is a reflection of all the extra hours of work and passion that our Cookery and Hospitality tutors put in to ensure that our students received excellent training, that is up to date and relevant to the cookery / hospitality industry in New Zealand.\n\nExperts confirm that PBRS is the BEST\n\n### NZ Chefs Hospitality Championships Winner of the 2018\n\n### NZ Training Establishment of the Year\n\nExperts confirm that PBRS is the BEST\n\nIt is with great pride that The Cornell Education Group accepts the following awards for The NZ Chefs National Hospitality Championships 2018:\n\n• New Zealand Training Establishment of the Year\n• Training Chef of the Year\n• Training Service Person of the Year for TCEG Professional Cookery and Hospitality schools.\n\nThis is an outstanding result that has demonstrated The Cornell Education Group’s professionalism and excellence in training future personnel for the cookery and hospitality industry in New Zealand.\n\n### NZ Chefs Hospitality Championships Winner of the 2017\n\n### NZ Training Establishment of the Year\n\nThe NZ Chefs National Hospitality Championships 2017 event (Held from the 27th ~ 30th of July 2017 at the Logan Campbell Centre, ASB Showgrounds) was well attended by all of the leading training establishments across New Zealand who were anxiously waiting to see the outcomes of the highly coveted awards.\n\nThe Cornell competitors excelled in their trades and brought home 45 medals along with immense pride in their skills. With 12 gold, 25 silver and 8 Bronze medals won by the Cornell students, there is an air of confidence and appreciation, for the support that the school has provided in preparing the students for the competitions. Cornell prides itself on investing in the next generation and creating opportunities for those who may not have competed in such a prestigious competition before.\n\nAll staff members at Cornell congratulate the Tutors and competitors on a great effort and an extremely positive outcome. This result reflects the extra work that our tutors put in to ensure that our students achieve their potential and enjoy success. This result is a reflection on all the extra hours of work and passion that our Tutors have put in it to ensure that our students receive excellent training, that is up to date and relevant to the cookery and hospitality industry in New Zealand.\n\n### NZ Chefs National Salon Winner of the 2016\n\n### NZ Training Establishment of the Year\n\n**(8 Gold, 13 Silver, 12 Bronze Medals)**\n\nIt is with great pride that The Cornell Education Group accepts the award of ‘New Zealand Training Establishment of the year’ for our Professional Cookery and Hospitality schools.\n\nThis is an outstanding results that has demonstrated The Cornell Education Group’s professionalism and excellence in training for the cookery / hospitality industry in New Zealand.\n\nThis NZ Chefs National Salon 2016 event ( 28 July – 31 July 2016 at the Logan Campbell Centre, ASB Showgrounds) was dominated by all of the larger training establishments who were present to see the outcomes of the highly coveted awards.\n\nAll the staff members at Cornell congratulates the trainers and competitors on a great effort and extremely positive outcome.\n\nThis result reflects the extra work that our tutors put into ensuring that our students receive training that is excellent, up to date and relevant to our industry,\n\n### New Zealand Culinary Fare Training Excellence Award 2014\n\nWe are also the recipient of the New Zealand Culinary Fare Training Excellence Award 2014.\n\nThe [Restaurant Association of New Zealand](https://www.restaurantnz.co.nz/) was formed in 1975 with the aim of serving and representing owners and managers of restaurants and foodservice operations. The association represents 1,800 members throughout New Zealand. They were the organizers of the New Zealand Culinare Fare.\n\n### Indian Business Awards\n\nThe Professional Business and Restaurant School is an award winning education provider both domestically and internationally. Notably, PBRS won the Best Exporter to India Award at the Indian Business Awards 2012 for the third year running."},"testimonials":{"title":"Our Students – Testimonials","md":"## Read what our current students have to say about PBRS!\n\n### Vanilyn Tugay\n\nDiploma in Hotel Management, Level 6\n\nMy Mentor was Mohit Sharma. As this was my first competition I was very excited to win a Gold medal and I put this down to the excellent training and hard work put in by Mohit.\n\nI highly recommend Cornell, the staff are knowledgeable and friendly and Andrew Ayles who is the Academic Team Leader of Hospitality school is also very supportive of the students entering competitions. This competition has helped me to find new jobs and has opened up my career prospects.”\n\n**Gold Medal, National Culinary Fare, 2016**\n\n### Daryl Mercurio\n\nDiploma in Hospitality(Operational Management & Rooms Division) Level 5\n\n“My Tutor Jacques was also my mentor for this competition. He was very helpful and pushed me to achieve my very best and to get me out of my comfit zone. Because of this experience I am now a lot more confident when dealing with customers, especially as English is a second language for me.\n\nCornell is a great place to learn and improve on your knowledge. The icareer department are very helpful and knowable when helping you look for a job in Auckland. ”\n\n**Gold Medal, National Culinary Fare, 2016**\n\n### Candice Siazan\n\nDiploma in Hotel Management, Level 6\n\n“Olivia Ramos was my tutor and mentor. My training has been very beneficial to my career progress. It has given me the confidence and skills to advance quickly through my chosen field. Olivia is very passionate about the Hospitality Industry and has a huge amount of knowledge.\n\nI will refer this school to my friends as it has not only given me the level 6 qualification but also hands on experience which is invaluable when looking for the right job’s in Auckland.”\n\n**Gold Medal, Regional Culinary Fare, 2016**\n\n### Ma. Karina K. Makasaet\n\nDiploma in Hospitality (Operational Management & Rooms Division) Level 5\n\n“I had no idea about coffee making and ‘barista’ skills until I started studying at Cornell. My tutor Olivia Ramos, encouraged me to enter the culinary fare in 2016. My competition success has given me an edge over other candidates and also looks great on my C.V.\n\nI would highly recommend Cornell to my friends as I have not only gained a qualification but also a lot of practical skills as well, which has given me the confidence to grow in the Hospitality Industry”\n\n**Bronze Medal, National Culinary Fare, 2016**\n\n### Joanna Tabusares\n\nDiploma in Hotel Management, L6\n\n“Jauqes was my training tutor and helped me to build up my confidence before I entered the competition. He taught me how to fold napkins and how to set a table up under pressure. I am now more confident to move forward with my career as a result of his excellent training that I have received.\n\nI also have an edge over other’s applying for jobs as this looks really good on my C.V. as well. I would highly recommend Cornell to my friends. I have learnt how to work hard and how to balance my studies with work.”\n\n**Silver Medal, National Culinary Fare, 2016**\n\n### Ryuk Jo\n\nNew Zealand Certificate in Food and Beverage Service (Café Services and Bar Services) (Level 3)\n\nDiploma in Hospitality – Level 5 (Operational Management & Rooms Division)\n\nWhere are you from?\n\nJapan. I came over to New Zealand with my family.\n\nI moved from Papermoon Mairangi Bay which is a workplace introduced to me by my tutor (Mohit Sharma) at the time.\n\nMy level 3 tutor Mohit knew the manager at Papermoon and helped me get a job there.\n\nThroughout the course Mohit helped me and gave me advice to being a good bartender.\n\nI want to gain more skills and knowledge to become a top bartender. Enter competitions where I can, challenge and improve myself to move up within the hospitality industry.\n\n### Beau McLean\n\nCertificate in Hospitality (Operations & Supervision) Level 4\n\nI was born in Australia, after which I moved to Scotland, and then I moved to New Zealand in 1997. Before coming to study at PBRS I was at Unitec studying Performance Technology, but I decided to come to The Professional Bar & Restaurant School so I could expand my qualifications and learn something new and exciting.\n\nHospitality is my passion, and I knew people who were going here who said it was really good, so I thought I would give it a go. I chose to study the Certificate in Hospitality (Operations & Supervision) Level 4 as it is a stepping stone to move up to a level 5 then a level 6 qualification.\n\nMy favourite part of studying here so far is learning about HR and the process of opening a bar, as it really puts you into the frame of mind of what is required to own your own business in the hospitality industry.\n\nI currently work at Bestaff Hospitality Recruitment, through which I have worked at Vector Arena, SkyCity, Viaduct Events, and ASB Showgrounds, as well as contract catering at Spotless at Eden Park. Richard Doolan who runs Functionality, the PBRS employment agency, helped me get the job at Spotless.\n\nAfter finishing my studies I want to move to Australia and work for Carnival Australia, working on a cruise ship, or to go to New Plymouth and study the level 7 and 8 courses at their Hospitality Management School.\n\n### Ashley Jordan Hunt\n\nCertificate in Hospitality (Operations & Supervision) Level 4\n\nBefore I came to PBRS I had left high school in 2010, after which I spent two years working at The Warehouse being on call and mostly sitting around doing nothing with my life until a friend suggested to me that I join PBRS. I have quite a few friends who study here and everybody had really good things to say about the course.\n\nI have never been an academic, but PBRS sets you up for success. The first month of the course (practical) gives you a taste of what working behind a bar would really be like. And even after you graduate if you think hospitality isn’t for you, you have the skills and the certificate to fall back on because it is NZQA recognised. So far I have really enjoyed our first block, as we got to make our own cocktails which were also judged. It brought us together as a class and we all got to know each other a lot better as it broke the ice.\n\nStudying here has opened up the opportunity to work in hospitality straight away, as I am currently working as a bartender at Mainstreet Bar & Bistro in Henderson. Richard Doolan, who is the Careers Advisor at PBRS, helped me with the format and my language in my CV, and the tutors helped me with what I should expect in the interview, such as what sort of questions would be asked. Functionality (PBRS’ in-house employment agency) is always friendly and full of advice, and the tutors are always willing to give you one on one practical experience.After I graduate I plan to continue on all courses I possibly can, and maybe one day own and run my own bar.\n\n### Raven Panapa\n\nCertificate in Hospitality (Operations & Supervision) Level 4\n\nBefore I came to The Professional Bar & Restaurant School I was studying at Education Action in Papakura, but after some thought I decided that I wanted to work in hospitality. My Grandmother was a caterer at Wesley College, and she used to get me to help her out, which I really enjoyed doing, so I knew I needed to change my studies to suit what made me happy. I saw the ad on TV and I thought “I really want to go there”, then when I came in and spoke with the staff I saw how cool they were and it sealed the deal for me.\n\nI chose to study the Certificate in Hospitality (Operations & Supervision) Level 4 as I knew it would teach me everything I needed to know to go out and get a good job in the industry. My favourite part was the practical bar course, where you learn all the cocktails and practical skills. It is nerve racking coming in not knowing anyone, but from day one you make lots of friends.\n\nI am currently working at Sun Yum Thai in Pukekohe. I got my job because one night when I was eating there I saw that they were really busy so I offered to help. They saw the skills that I learnt at The Professional Bar & Restaurant School and it really impressed them so they hired me.\n\nWhen I am done studying I want to work my way up to be a manager of a restaurant and PBRS is teaching me everything I need to know to get my start in the hospitality industry. The Professional Bar & Restaurant School has helped me on this pathway more than I could have ever imagined."},"staff":{"title":"Our Staff","md":"## **Staff**\n\n### Strategic Management Team\n\n#### **Principal**\n\n**Parks White**\n\n#### **General Manager, Operations**\n\n**Jun Kim**\n\n#### **Programme Manager**\n\n**Michael Corbett**\n\n#### Quality Assurance Manager\n\n**Andrew Ayles**\n\n### Administration & Student Service\n\n#### Administration Manager\n\n**Kathy Ku**\n\n#### Administrator\n\n**Herlin Wahyuni**\n\n### Marketing\n\n#### Marketing Manager\n\n**Jayaraj ARUL SAMJI**\nDDI: +64-9-915-3503\n\n#### Marketing Manager\n\n**Regina Lee**\nDDI: +64-9-367-3504\n\n#### Marketing Assistant\n\n**Simonne Ferro**"},"student-services":{"title":"Student Services","md":"There are various means by which students can seek support and guidance at PBRS. These include Academic Guidance, Pastoral Care, Learning Support, Careers Advice and help in securing study-related jobs through.\n\n### Academic Guidance\n\nStudents are welcome to consult their lecturers in the first instance if they wish to receive guidance in regard to the program that they are studying.\n\n### Pastoral Care\n\nthere are two separate avenues to gain this support. PBRS has a dedicated Pastoral Care Team offering front line personal support for students. Students from other language groups can gain frontline support from one of our Marketing Services team members in their own language. In cases where it is established that more professional services are required, the Pastoral Care Team will refer the student to specialist support services.\n\n### Mental health support\n\n#### Covid-19: Mental health and wellbeing resources\n\nThe stress and uncertainty of Covid-19 restrictions can impact on students’ mental health. The Ministry of Health has provided a list of resources, including some specifically aimed at young people.\n\nSee [Covid-19: Mental health and wellbeing resources](https://www.health.govt.nz/our-work/diseases-and-conditions/covid-19-novel-coronavirus/covid-19-health-advice-public/covid-19-mental-health-and-wellbeing-resources)\n\n#### **If you need help in a mental health crisis you should call:**\n\n- Auckland DHB – Mental Health Community Acute Service (CAS): [0800 800 717](tel:0800800717)\n- In an emergency, you should call 111\n\n#### **After-hours support**\n\nFor support outside regular hours you can call:\n\n- Lifeline [0800 543 354](tel:0800543354)\n- Youthline [0800 376633](tel:0800376633) or Free TXT 234\n- Outline (Rainbow Support) [0800 688 5463](tel:08006885463)\n\n### Learning Support\n\nWhere it is established that students need additional support they will have access to a Learning Support Lecturer or to our English Language School.\n\n### Accommodation\n\nPBRS provides accommodation arrangements for international students on request but we must have a minimum of 4 weeks’ notice. The minimum period of homestay is 4 weeks. A homestay placement fee ($240, non-refundable) will apply for this service. The homestay fees are (around $280/wk for over 18 students and $300/wk for under18 students). Airport pick up is available on request, and $100 will be charged for each pickup. All homestay families in PBRS homestay program are carefully selected. Students staying in a homestay are required to exhibit appropriate behaviour. For under 18 students, we will monitor the satisfaction of the Homestay placement regularly. Please check with your Pastoral Care Team for details.\n\nFor international students aged over 18 who want to find your own accommodation, you may find general information on renting at <https://www.tenancy.govt.nz>, or find information on quality standards for renting at: [http://www.mbie.govt.nz/info-services/housing-property/tenancy/residential-tenancies-regulations-for-insulation-and-smoke-alarms](http://www.mbie.govt.nz/info-services/housing-property/tenancy/residential-tenancies-regulations-insulation-smoke-alarms/). You are also welcome to talk with our Pastoral Care Team and seek more advice.\n\n### **Your rights as a tenant**\n\nWhen you rent a property as a tenant or join a shared house as a flatmate, you will have a number of rights and responsibilities.\n\nPlease visit [www.tenancy.govt.nz](http://www.tenancy.govt.nz/) website for more information\n\n**[Renting a property, being a tenant or flatmate, and resolving disputes](https://www.tenancy.govt.nz/starting-a-tenancy/)**\n\n### Careers Advice\n\nStudents can consult either the lecturers in the field that they are most interested in, or in some cases, PBRS Employment Support staff may also be able to help. You may check [**here**](/employment/students) for more information about Employment Support.\n\n### Computer Access:\n\nAccess to computers at PBRS is offered between 9:00 am – 5:00 pm. Printing facilities are available. Wifi access is available in all campuses as well.\n\n### Library access\n\nPBRS has a student library on site at level 2, 150 Hobson St. The library holds non-prescribed textbooks, other relevant readings, trade and professional magazines and some software.\n\nThere are other significant libraries within easy walking distance of the PBRS facilities in Auckland. These are to be found at the University of Auckland and AUT. They have very significant holdings in all fields – PBRS students may use but not borrow from these libraries."},"facilities":{"title":"School Facilities","md":"### Classrooms\n\nAll our classrooms are equipped computer systems and multimedia projectors for effective teaching tools.\n\n### Computer Laboratories\n\nThere are 5 computer laboratories for use at PBRS, equipped with the latest computers for an efficient learning experience in a modern teaching environment. We provide internet access, e-mail access, and printing services for our students.\n\n### Kitchen\n\nOur kitchens are fully equipped with state-of-the-art appliances which provide the opportunity to acquire practical expertise in a realistic working environment for our cookery students.\n\n### Training Restaurant\n\nThe training restaurant serves as the laboratory for our hospitality students which exposes them to real situations in a restaurant setting.\n\n### Cafeteria & Student Lounge\n\nA cafeteria and student lounge are available for our students’ use for their class breaks, where they can meet up and get acquainted with students from other programs.\n\n### Library\n\nThe library is equipped with the latest edition of textbooks, journals and reference materials, which can be used by the students for their academic learning and assignments"},"new-zealand":{"title":"About New Zealand","md":"## New Zealand Information\n\nAuckland is also known as one the top five cities worldwide for quality of living, according to (Mercer’s 2008 Quality of Living survey) and it is considered much cheaper than many other countries like Sydney or London.\n\n### General Profile(New Zealand)\n\n|  |  |\n| --- | --- |\n| **Area** | 103,736 sq mi = 269,000 sq km |\n| **Population Feb 2014** | 4,509,700 |\n| **Capital City** | Wellington |\n\n### Climate\n\nOur coldest month is July, and our warmest is in January; our seasons opposite to those in the Northern Hemisphere. Average temperatures are around 15C (60F) in the upper North Island, and around 10C (50F) near the bottom of the South Island. The climate is fairly mild, without the extremes experienced in many other countries.\n\nIn fact, New Zealand doesn’t tend to have temperatures over 35C (100F) or under -10C (14F). It tends to snow only in the mountains in the North Island, and mainly in the Southern Alps in the South Island, although it has been known to snow on some of the cities on the East Coast of the South Island from time to time.\n\n### Currency\n\nDecimal system based on New Zealand dollar, with cent denominations.\n\n|  |  |  |  |  |  |\n| --- | --- | --- | --- | --- | --- |\n| **Coins** | 10 cent | 20 cent | 50 cent | 1 dollar | 2 dollar |\n| **Notes** | 5 dollar | 10 dollar | 20 dollar | 50 dollar | 100 dollar |\n\n### Travel Details\n\n**Visa:**\n\nNot required of US citizens in possession of a return or onward ticket\nstaying up to 90 days.\nPassports must be valid 3 months beyond date of departure\n\n**Health:**\n\nMust provide the Health Medical Certificate required by the NZ Immigration.\n\n### Cultural\n\n|  |  |  |\n| --- | --- | --- |\n| **Languages** | English & Maori |  |\n| **Ethnic Groups** | European  Maori  Pacific Islander  Other | 88 %  9 %  2 %  1 % |\n| **Religions** | Christian  Unaffil. & Other | 81 %  19 % |\n\n### Cost of Living NZ\n\nNew Zealand is a popular destination for international students. It has an excellent education system and internationally\n\n### Costs by commodities\n\n|  |  |\n| --- | --- |\n| **A cup of coffee** | $ 3.50 – 4.00 |\n| **Hamburger** | $ 3.50 – 5.00 |\n| **Bread** | $ 2.50 per loaf |\n| **Milk** | $ 2.00 per litre |\n| **Banana** | $ 2.30 per Kg |\n| **Instant Noodles** | $ 0.80 per packet |\n| **Main meal at restaurant** | $ 10.00 – 25.00 |\n| **Takeaway pie** | $ 2.50 – 3.00 |\n| **Supermarket per week  (If not living in homestay)** | $ 100.00 |\n\n|  |  |\n| --- | --- |\n| **Jeans** | $ 20 – 200 per item |\n| **Sport shoes** | $ 50 per item |\n| **Shirts** | $ 25 + per item |\n| **sweatshirts** | $ 25 + per item |\n| **Warm padded jackets** | $ 100 + per item |\n\nIt is generally expected that International Students allow approximately NZ$ 15,000 to NZ$ 19,000 per year available for living and accommodation costs, above the cost of your tuition.\n\n|  |  |\n| --- | --- |\n| **Single bus fare per trip (inner city ride)** | $ 0.50 – 9.70 |\n| **Monthly bus pass  (travel within Auckland and suburbs)** | $ 110.00 – 170.00 |\n| **Sport shoes** | $ 50 per item |\n| **Health Insurance** | $ 450 per year |\n| **Cell phone charges** | $ 10.00 – 20.00 |\n| **Medical appointments** | $ 20.00 – 65.00 |\n| **Hair cut** | $ 25.00 – 35.00 |\n\nThere may be other costs that you wish to budget for, for example, vacation expenses, travelling, social activities etc."},"employment":{"title":"Employment support service","md":"## Who we are?\n\nEmployment and Internship Services assists both Current students and graduates on a day to day basis into sustainable long term employment. We are passionate about establishing a well-respected reputation with students, trainers and with business partners.\n\n## Our Mission\n\nEnrich, Empower and Engage.\nTo prepare TCEG students through practical and theoretical skill development, so that they are work ready, within their chosen pathway. We endeavour to develop the right mind set and passion that empowers students to confidently engage with a career that enriches the industry.\n\n## Our Goals\n\n- Provide the relevant tools to enable our students to enter the employment market successfully\n- Be inspirational and supportive in career guidance for all students.\n- To be an effective and proactive employment advisory advocate for both our students and industry partners.\n- To build significant partnerships amongst professional industry businesses that facilitates student development and infuses the sector with work ready staff"},"employment-students":{"title":"For Students","md":"After completing a PBRS Diploma or National Certificate, you are ideally placed to begin to take advantage of the many hospitality opportunities and jobs in this sector.\n\nThe knowledge that you gain from your course, including the pathway planning and career development that you are encouraged to undertake, will allow you to apply for a number of diverse roles such as; food and beverage attendant, bartender, front of house hotel worker, receptionist, café worker, barista or waiter. Subsequently you will be able to move to a more senior position.\n\nDue to recent changes in legislation and requirements of industry your qualification is important in obtaining even the most entry level role. Subjects such as food safety, hygiene, coffee training and Licence Controllers Qualification (LCQ) will put you ahead of the game when it comes to applying for jobs both during and after your course.\n\nStandards in hospitality have increased as New Zealand becomes the focus of more and more major world events, and it is increasingly evident that a PBRS qualification will help you climb the ladder faster.\n\nNew Zealand has a diverse range of hospitality businesses – you might want to work in a hotel, night club, fine dining restaurant, café, brasserie or bistro. The standards required for each job differ, but PBRS strives to ensure that you have a full range of skills and knowledge to be a success whatever your chosen career path.\n\nMany of our students have gone on to become senior workers in a short space of time – many of these stories are a combination of your qualification and your own hard work. Your tutors are available to assist you with your career pathway, and PBRS operates a dedicated person who will help you gain work experience if you are finding difficulty."},"employment-employers":{"title":"For Employers","md":"PBRS’ recruitment service Employment support service a dedicated Placement Consultant who assists students and graduates in all facets of career planning. We can help you in job placements if you need employees for your business or company.\n\n### How to become an industry partner\n\nWe offer our hand in building meaningful partnerships that strengthen business operations and enhances profitability in the local industry sector. PBRS would like to reach out to forward thinking industry leaders that have vision and capacity to participate in the growth of the region.\nLet us speak to you directly and let us find how we can support your staffing and business networking goals this year. We will work closely with you to provide aspiring part time candidates and qualified graduates that meet the criteria of your employment needs.\n\n### Employment support service"},"employment-contact":{"title":"Contact Employment support service","md":"We can assist students with CV preparation and editing, interviewing techniques, identify careers prospects and choices, career counseling and permanent and part time work & Job Placement.\n\nWe will update the employment bulletin board which put up notices for Job Vacancies – employment and other relevant information that would be of interest and useful in promoting our students welfare.\n\n**Employment support service**\n\n- Experience in partnership and internship development\n- Business development in hospitality & hotel background"},"how-to-enrol":{"title":"How to Enrol?","md":"### Step 1– Decide what you would like to study\n\nCheck course information by visiting our website [www.pbrs.ac.nz](/courses) or visiting one of our recruitment agents or calling us on 09 300 7277 for an information pack to be sent to you. Find a course that meets your career expectation and make your decision.\n\n### Step 2 – Complete the Enrolment Form\n\nDownload our [Enrolment Form](http://www.pbrs.ac.nz/wp/wp-content/uploads/2024/01/Application-Form-PBRS_2024.v01.pdf) at www.pbrs.ac.nz , or fill in the form with one of our recruitment agents or fill in the form at one of our campuses.\n\nDepending on the course you have chosen, you will be required to supply evidence of any previous qualifications you have gained, and evidence of your English proficiency at the appropriate level. You are also required to provide a copy of your personal ID (Passport, Birth Certificate or Driver’s License etc.)\n\nBefore you sign the Enrolment Form, please make sure you have read and understood our [enrolment policies](/policies), policies in our [Student Handbook](http://www.pbrs.ac.nz/wp/wp-content/uploads/2023/01/A31-PBRS-Student-Handbook-January-2023-.pdf) and [the Education (Pastoral Care of International Students) Code of Practice 2021](http://www.pbrs.ac.nz/wp/wp-content/uploads/2022/08/NZQA_Pastoral-Care-Code-of-Practice_English.pdf).\n\nSubmit your enrolment documents to PBRS directly or through your agent.\n\n### Step 3 – Get the Offer of Placement and the Fee Schedule\n\nAfter receiving your enrolment document, PBRS will consult and assess your application, according to the documents and information you have provided and, if appropriate, PBRS will issue an Offer of Placement (conditional or unconditional) and a Fee Schedule. Please be aware that all international students are required to have a proper Medical and Travel insurance while they are studying in New Zealand. Therefore, an insurance fee will be included in the fee schedule.\n\n### Step 4 – Pay your fees and get your student visa\n\nTo study in New Zealand, all international students are required to have a proper visa.\n\nIf you are out of New Zealand, you may lodge your Student Visa Application with our unconditional offer and other documents as required by [Immigration New Zealand (INZ)](https://www.immigration.govt.nz/new-zealand-visas). Pay your fees listed on the Fee Schedule once you receive the Approval in Principle from INZ. In some countries, you may be required to pay your fees before you lodge your Student Visa Application. Please follow INZ’s requirement at all the time.\n\nIf you are in New Zealand, please pay your fees before you lodge your Student Visa Application.\n\nYou will find our trust account details on the Fee Schedule for your direct payment to PBRS.\n\nUpon your payment, PBRS will send you a receipt for your payment\n\n### Step 5 – Start your study\n\nOnce you get your visa approved, you will start your study on the course start date. Congratulations!\n\nRemember to check our website to get more information about the orientation and living in New Zealand.\n\nDownload the [International Prospectus](http://www.pbrs.ac.nz/wp/wp-content/uploads/2020/01/PBRS-Prospectus_web.pdf)"},"contact":{"title":"Contact Us","md":"### Auckland Campus & Head Office\n\nTel:+64 (09) 367 1010 Fax:+64 9 367 1020\n\nEmail: [info@pbrs.ac.nz](mailto:info@pbrs.ac.nz)\n\nPhysical Address: Level 1 150 Hobson Street Auckland CBD\n\nFacebook:[facebook.com/pbrsinternational](https://www.facebook.com/pbrsinternational/)"}},"news":[{"slug":"pbrs-presents-its-students-achievements","title":"PBRS Presents its Students’ Achievements!","date":"2020-05-05","excerpt":"Dear PBRS’s Friends, Amidst this Global Pandemic, PBRS is reminicising its achievements over the past year and has been feeling proud of its Student Stories! PBRS would love to share this...","md":"#### Dear PBRS’s Friends,\n\nAmidst this Global Pandemic, PBRS is reminicising its achievements over the past year and has been feeling proud of its Student Stories! PBRS would love to share this with all our Well Wishers!\n\n## PBRS’s Recent Achievements & Events !\n\n#### PBRS winning Regional Competition in 2019!\n\nBeing New Zealand reigning champions in Hospitality and Culinary awards following our wins in 2014, 2016,2017, 2018. PBRS took over the regional competition in 2019 ! Couldn’t be less proud of our Student Achievements. PBRS looking forward to be reigning Champions in 2020!\n\n#### **PBRS Cultural events**!\n\nAn eventful day which started by the traditional Diwali Diya lighting then proceeded to a Multi Cultural Walk by 5 different cultures which was then followed by different cultures performances hosted by dignitaries and media and our well wishers from the student recruitment agency.\n\n#### **100 Reasons to Study at PBRS!**\n\nIn 2019, we started spreading our success stories and achievements to all PBRS’s well wishers through 100 Reasons Why to Study at PBRS! Do let us know if you haven’t been receiving them, we can add you’ll on the list.\n\n#### **Wine & Cheese Tasting!**\n\nAn event organised by our students as a part of their curriculum! Brilliant job done by our students as they gave everyone a New Zealand Tour on Wine & Cheese tasting!\n\nFor further inquiries,\nJayaraj Arul Samji : 0064 9 300 PBRS [7277]\nMobile: +64 021 568 200"},{"slug":"1755","title":"Auckland Regional Championships 2019","date":"2019-06-27","excerpt":"13 Gold 7 Silver 6 Bronze! The Professional Business & Restaurant School PBRS which is part of Cornell Education Group participated in the Auckland Regional Hospitality Championships 2019...","md":"## **13 Gold 7 Silver 6 Bronze!**\n\nThe Professional Business & Restaurant School (PBRS) which is part of Cornell Education Group participated in the Auckland Regional Hospitality Championships 2019 on 24th June. PBRS entered 26 students in 13 different categories this year with outstanding successIt is with great pride that we report our students’ excellent results:\n\nThis gratifying result is a reflection of all the extra hours of work and passion that our Cookery and Hospitality tutors put in to ensure that our students received excellent training, that is up to date and relevant to the cookery / hospitality industry in New Zealand.\n\nCookery student ZHENG Zhihua (International Diploma in Food Preparation and Cookery Supervision (Advanced)( Level 5) won Gold for Live Salmon, Live Dessert, and Bronze for Live Knife Skills. “After one month hard training, I finally got two gold and one bronze. Thanks to all chefs and Program Manager’s contribution and full support from my school. This competition has been great in improving my skills and learning new and different cooking techniques. I am looking forward to getting better performance and better results at the national competition as well”.\n\nKHADKA,Bhushan (Hospitality Level 5)said “I couldn’t have done it without My tutor Mr. Mohit, the value of training was impeccable and I want to thank Shyam and Shanti from Rohini International who inspired me to study at PBRS. I am looking forward to the National Championships to bring pride to my country, Nepal and my family. “\n\n“On the day of the competition, through the ups and downs of the practising period, there was a very rewarding result for all the competitors for the regional competition which made me happy as we were all fighting to get through this together as friends and as a school” said Mi So Kim from International Diploma in Food Preparation and Cookery Supervision.\n\nMr. Parks White, Principal said “It is with great pleasure that I announce the success of PBRS Cookery and Hospitality students who competed in the NZ Regional Hospitality Championships this week. I want to thank Michael Corbett, Programme Manager Cookery & Hospitality and all Hospitality and Cookery staff for the long hours and expertise and dedication in training our PBRS students to a high standard yet again!\n\n**“Congratulations and best wishes for the National Hospitality Championships in August!”**"},{"slug":"auckland-regional-championships-2018","title":"Auckland Regional Championships 2018","date":"2018-07-09","excerpt":"12 Class Winners, 13 Golds, 23 Silvers, 5 Bronzes The Cornell Education Group participated in the recent Auckland Regional Championships 2018. The Cornell Education Group entered 40...","md":"12 Class Winners, 13 Golds, 23 Silvers, 5 Bronzes\n\nThe Cornell Education Group participated in the recent Auckland Regional Championships 2018. The Cornell Education Group entered 40 students in 13different categories this year with outstanding success.\n\nIt is with pride that we report our students’ excellent results:\n\n|  |  |  |  |  |\n| --- | --- | --- | --- | --- |\n| **Category** | **Class Winner** | **Gold** | **Silver** | **Bronze** |\n| Fruit Flan Static | 1 |  | 1 | 3 |\n| Individual Cold Dessert – Static | 1 | 1 | 3 |  |\n| Cold Entrée – Static | 1 |  | 3 | 1 |\n| Live knife Skills | 1 |  | 2 |  |\n| Live Dessert | 1 | 2 | 1 |  |\n| Live Pasta & Mushrooms | 1 | 2 | 3 |  |\n| Live Salmon | 1 | 1 | 1 |  |\n| Live Soup | 1 | 1 | 2 |  |\n| Live Venison | 1 | 2 | 2 |  |\n| Live Café Breakfast | 1 | 2 |  | 1 |\n| Barista | 1 | 2 |  |  |\n| Classic Cocktail |  |  | 3 |  |\n| Classic Table Setting | 1 |  | 2 | 1 |\n| **Total** | **12** | **13** | **23** | **5** |\n\nThis outstanding result is a reflection of all the extra hours of work and passion that our tutors
