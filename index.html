other a lot better as it broke the ice. Studying here has opened up the opportunity to work in hospitality straight away, as I am currently working as a bartender at Mainstreet Bar & Bistro in Henderson. Richard Doolan, who is the Careers Advisor at PBRS, helped me with the format and my language in my CV, and the tutors helped me with what I should expect in the interview, such as what sort of questions would be asked. Functionality (PBRS' in-house employment agency) is always friendly and full of advice, and the tutors are always willing to give you one on one practical experience.After I graduate I plan to continue on all courses I possibly can, and maybe one day own and run my own bar."},{"h":"Raven Panapa","t":"Certificate in Hospitality (Operations & Supervision) Level 4 Before I came to The Professional Bar & Restaurant School I was studying at Education Action in Papakura, but after some thought I decided that I wanted to work in hospitality. My Grandmother was a caterer at Wesley College, and she used to get me to help her out, which I really enjoyed doing, so I knew I needed to change my studies to suit what made me happy. I saw the ad on TV and I thought “I really want to go there”, then when I came in and spoke with the staff I saw how cool they were and it sealed the deal for me. I chose to study the Certificate in Hospitality (Operations & Supervision) Level 4 as I knew it would teach me everything I needed to know to go out and get a good job in the industry. My favourite part was the practical bar course, where you learn all the cocktails and practical skills. It is nerve racking coming in not knowing anyone, but from day one you make lots of friends. I am currently working at Sun Yum Thai in Pukekohe. I got my job because one night when I was eating there I saw that they were really busy so I offered to help. They saw the skills that I learnt at The Professional Bar & Restaurant School and it really impressed them so they hired me. When I am done studying I want to work my way up to be a manager of a restaurant and PBRS is teaching me everything I need to know to get my start in the hospitality industry. The Professional Bar & Restaurant School has helped me on this pathway more than I could have ever imagined."}],"words":1489},{"id":"wp-contact-icareer","type":"page","title":"Contact Employment support service","route":"emp-employers","updated":"2020-07-31","source":"/icareer/contact-icareer/","sections":[{"h":"Contact Employment support service","t":"We can assist students with CV preparation and editing, interviewing techniques, identify careers prospects and choices, career counseling and permanent and part time work & Job Placement. We will update the employment bulletin board which put up notices for Job Vacancies – employment and other relevant information that would be of interest and useful in promoting our students welfare. Employment support service Experience in partnership and internship development Business development in hospitality & hotel background - Experience in partnership and internship development - Business development in hospitality & hotel background"}],"words":94},{"id":"wp-enrol","type":"page","title":"Enrol Now","route":"enrol","updated":"2026-10-16","source":"/enrol/","sections":[{"h":"Complete the form below and we will get in touch with you immediately.","t":"Please click the following links to download the enrolment forms - International Enrolment Form - International Prospectus"}],"words":30},{"id":"wp-contact-us","type":"page","title":"Contact Us","route":"contact","updated":"2021-05-10","source":"/about-us/contact-us/","sections":[{"h":"Auckland Campus & Head Office","t":"Tel:+64 (09) 367 1010 Fax:+64 9 367 1020 Email: info@pbrs.ac.nz Physical Address: Level 1 150 Hobson Street Auckland CBD Facebook: facebook.com/pbrsinternational"}],"words":26},{"id":"wp-diploma-in-hotel-management-level-6-2","type":"page","title":"New Zealand Diploma in Hospitality Management Level 6","route":"course-h6","updated":"2024-01-16","source":"/courses/diploma-in-hotel-management-level-6-2/","sections":[{"h":"New Zealand Diploma in Hospitality Management-Level 6","t":"Students will be able to manage and develop staff to optimise positive customer experiences and enhance positive staff relationships through communication, consultation, negotiation and reporting strategies. The programme further enables students to strategies for the future in relation to financial management, product development, marketing and continuous improvement processes. Employment pathway This programme is targeted for those who would like to enhance their career in management roles with minimal supervision across a range of setting in the hospitality sector. The graduates will be able to gain opportunities within the hospitality industry in trainee manager or assistant manager roles such as: Food and Beverage Manager, Event Manager, Banquet Manager, Bar Manager, Café Manager, Restaurant Manager, Duty Manager and Operations Manager and to demonstrate professional practice and provide customers with confidence in their roles. Overview of Programme Modules: 120 Credits – Nine (9) week programme over four (4) terms Total weeks (including term breaks and Christmas holidays) 48 Weeks Module Code & Title Module Code & Title Semester One Semester One NZDHM 601 | Hospitality Environment Analysis NZDHM 601 NZDHM 602 | Strategic Hospitality Management NZDHM 602 NZDHM 603 | Business Performance NZDHM 603 NZDHM 604 | Hospitality Marketing NZDHM 604 Semester Two Semester Two NZDHM 605 | Human Resource Management NZDHM 605 NZDHM 606 | Business Communication NZDHM 606 NZDHM 607 | Financial Management NZDHM 607 NZDHM 608 | Food & Beverage Management NZDHM 608 NZDHM 601 – Hospitality Environment Analysis Module Description: The aim of this module is to assess the significance that Manaakitanga has on New Zealand hospitality, using basic tikanga Māori, and investigate the differences in Māori and non-Māori business models. Students will conduct environmental analyses, using tools such as Porter's Five Forces and PESTLE, to develop and justify business strategy or growth initiatives. NZDHM 602 – Strategic Hospitality Management Module Description: This module focuses on various concepts, principles, theories, frameworks, tools and techniques of quality management. They will be able to create a quality management plan in response to changes in the environment by applying a range of quality tools for systems and process improvement. NZDHM 603 – Business Performance Module Description: This module draws on the changing dynamics of the hospitality sector in New Zealand and propels students to maintain currency with hospitality trends, updates and changes. The paper stimulates strategic thinking and enables students to apply a range of strategic solutions including innovative strategies, sustainability and productivity principles and continuous process improvements. NZDHM 604 – Hospitality Marketing Module Description: This module aims at developing marketing strategies, including the use of digital media and business market analysis, for hospitality business growth and expansion in the New Zealand context. NZDHM 605 – Human Resource Management Module Description: This module focuses on the role Human Resource Management (HRM) plays within Māori and non-Māori organisations within the New Zealand hospitality sector. Students will be able to identify HRM challenges and apply strategic solutions to address them. They will further identify how to manage and develop staff to ensure positive customer experiences. NZDHM 606 – Business Communication Module Description: In this module, students will critically review recent developments in communication practices, including kaupapa Māori, and evaluate associated risks, ethical and equity issues using a range of tools. They will select and apply a range of communication, consultation, negotiation and reporting strategies in their hospitality management practice. Students will also apply advanced professional communication standards to collaborate and plan for continuous improvement techniques and processes in the hospitality environment. NZDHM 607 – Financial Management Module Description: The aim of this module is to provide a straight forward and practical approach for students to be able to analyse and apply financial management techniques to attain profitability, yield and productivity for a hospitality business operation. NZDHM 608 – Food & Beverage Management Module Description: Planning and developing business strategies for continuous improvement and growth in food and beverage business is the aim of this module. Recognising kaupapa Māori tikanga and kawa, students will demonstrate strategic thinking, operational understandings and capabilities to plan and develop sound financial, inventory management, risk management, and product development strategies for a successful food and beverage establishment."},{"h":"Start dates","t":"CAMPUS | START DATE Auckland | 30th January 2024 Auckland | 15th April 2024 Auckland | 1st July 2024 Auckland | 16th September 2024 Auckland | 25th November 2024 Enrolment Information Fees: Tuition fee : $14,000 & Material and Resource Fee : $1,500 Material and Resource fee include: - Access to all school facilities and equipment during school hours or by arrangement with the tutor in charge after class hours - Processing, recording and reporting of assessment results and personal data - Course work books and text books (If it is applicable) - Uniform - Student ID card - Field trips (If it is applicable) Entry requirement: - All applicants who are over 18 years with the right aptitude and skills needed to succeed will be considered for the programme. - Applicants will need to hold a New Zealand Diploma in Hospitality Management Level 5 or equivalent (i.e. – A hospitality background is essential; having relevant hospitality industry work experience of at least two years) - All applicants must have a level of English sufficient to be able to study at this level. - Applicants for whom English is not their first language are required to have achieved one of the following criteria: An International English Language Testing System (IELTS) overall academic score of 6.0 with no band score lower than 5.5 Or Any of the other recognised proficiency outcomes for international students listed in the appendix to NZQF Programme Approval and Accreditation Rules 2018 - All applicants will be required to complete a PBRS Enrolment Form and may be interviewed in person or via Skype to evaluate their suitability for the programme."}],"words":969},{"id":"wp-national-certificate-in-hospitality","type":"course-archive","title":"National Certificate in Hospitality (Operations Supervision) Level 4","route":"courses","updated":"2015-11-03","source":"/courses/national-certificate-in-hospitality/","sections":[{"h":"Programme Introduction","t":"Students will be taught how to professionally make basic coffees and provide customer service by our tutors who have extensive experience in hospitality industries. They will teach you exactly what you need to start working in the industry as soon as possible. You will be taught skills that will give you the confidence to take on more responsibility in a hospitality establishment from supervising and training, to staff rostering. The programme will give you the sound business skills to help you think on your feet within this exciting industry. The course includes; first line management, human resource supervision, and food and beverage supervision."},{"h":"Course Highlights","t":"During your time at PBRS you will learn hospitality service skills, as well as operational supervisory theories. You will also learn how to provide best hospitality service to customers as well as supervising a team. Regular field trips to some of the top hotels, bars, restaurants, cafes are included throughout the course duration. (Subject to availability)"},{"h":"Course Structure","t":"• Customer service skills • Rosters and employment • Stock management • Supervising skills • Communication skills • Staff training • Performance management • LCQ Certificate PBRS, you will be taught skills that will give you the confidence to take on more responsibility in a hospitality establishment. Campus | Start Date Auckland | 26 Jan 2015 Auckland | 04 May 2015 Auckland | 10 Aug. 2015"},{"h":"Enrolment Info(Domestic):","t":"Campus – Auckland"},{"h":"domestic :","t":"Tuition fee : $4,584 Material fee : $400(Can be applied from studylink course related cost)"},{"h":"International:","t":"Tuition fee : $7,250 Material fee : $500"},{"h":"Material fee include:","t":"- Access to all school facilities and equipment during school hours or by arrangement with the tutor in charge after class hours - Processing, recording and reporting of assessment results and personal data - Course work books and text books (If it is applicable) - Uniform - Student ID card - Field trips (If it is applicable) Entry Criteria: Age: To enrol in this course, you must be at least 18 years of age, or older by the first day of course commencement. English: Literacy & Numeracy unit standards to NCEA level 2 or higher. Schooling: NCEA Level 2 or higher. Academic: Previous tertiary study an advantage You will be required to sit a written entry test."}],"words":382},{"id":"wp-icareer-employers","type":"page","title":"For Employers","route":"emp-employers","updated":"2020-07-31","source":"/icareer/icareer-employers/","sections":[{"h":"For Employers","t":"PBRS' recruitment service Employment support service a dedicated Placement Consultant who assists students and graduates in all facets of career planning. We can help you in job placements if you need employees for your business or company."},{"h":"How to become an industry partner","t":"We offer our hand in building meaningful partnerships that strengthen business operations and enhances profitability in the local industry sector. PBRS would like to reach out to forward thinking industry leaders that have vision and capacity to participate in the growth of the region. Let us speak to you directly and let us find how we can support your staffing and business networking goals this year. We will work closely with you to provide aspiring part time candidates and qualified graduates that meet the criteria of your employment needs. Employment support service"}],"words":137},{"id":"wp-students-jobs","type":"page","title":"For Students","route":"emp-students","updated":"2019-07-30","source":"/icareer/students-jobs/","sections":[{"h":"For Students","t":"After completing a PBRS Diploma or National Certificate, you are ideally placed to begin to take advantage of the many hospitality opportunities and jobs in this sector. The knowledge that you gain from your course, including the pathway planning and career development that you are encouraged to undertake, will allow you to apply for a number of diverse roles such as; food and beverage attendant, bartender, front of house hotel worker, receptionist, café worker, barista or waiter. Subsequently you will be able to move to a more senior position. Due to recent changes in legislation and requirements of industry your qualification is important in obtaining even the most entry level role. Subjects such as food safety, hygiene, coffee training and Licence Controllers Qualification (LCQ) will put you ahead of the game when it comes to applying for jobs both during and after your course. Standards in hospitality have increased as New Zealand becomes the focus of more and more major world events, and it is increasingly evident that a PBRS qualification will help you climb the ladder faster. New Zealand has a diverse range of hospitality businesses – you might want to work in a hotel, night club, fine dining restaurant, café, brasserie or bistro. The standards required for each job differ, but PBRS strives to ensure that you have a full range of skills and knowledge to be a success whatever your chosen career path. Many of our students have gone on to become senior workers in a short space of time – many of these stories are a combination of your qualification and your own hard work. Your tutors are available to assist you with your career pathway, and PBRS operates a dedicated person who will help you gain work experience if you are finding difficulty."}],"words":300},{"id":"wp-nz-diploma-in-hospitality-2","type":"page","title":"New Zealand Diploma in Hospitality Management -Level 5","route":"course-h5","updated":"2024-01-16","source":"/courses/nz-diploma-in-hospitality-2/","sections":[{"h":"Programme Introduction","t":"New Zealand Diploma in Hospitality Management provides students with a pathway to enter the hospitality industry after only one year of study. You will learn supervisory management and business management right through to starting up your own business. You will also learn how to make sure the company you own or work for is profitable, the staff is competent and facilities are managed efficiently."},{"h":"Course Highlights","t":"Learning from seasoned hospitality professional tutors and guest speakers this is a fast track intensive course to help accelerate you into management positions in the hospitality industry. This course is suitable for all applicants who are ready to increase their employability and learn transferable skills that can be utilised in management within any industry."},{"h":"Course Structure","t":"• Staff training and development • Licensed premises management • Human resources management • Hospitality management control systems • Business management • Hospitality facility control and management PBRS' Diploma in Hospitality is an intensive course where students will learn to manage large enterprises from operational management, supervisory management, business training and assessments right through to starting up your own business."},{"h":"Start dates","t":"CAMPUS | START DATE Auckland | 30th January 2024 Auckland | 15th April 2024 Auckland | 1st July 2024 Auckland | 16th September 2024 Auckland | 25th November 2024"},{"h":"Enrolment Info:","t":"Duration: 1 year Fees: -Tuition fee : $16,000 -Material and Resource Fee : $1,500 Material and Resource fee include: - Access to all school facilities and equipment during school hours or by arrangement with the tutor in charge after class hours - Processing, recording and reporting of assessment results and personal data - Training ingredients used in the practice classes - Course work books and text books (If it is applicable) - Uniform - Student ID card - Field trips (If it is applicable) Entry requirement: An applicant must be 18 years or older (due to alcohol regulations) and have ONE of the following: a) Year 12 School Certificate or equivalent; or b) Achieved NCEA Level 3; or c) A level 4 qualification in hospitality or equivalent; or d) Work experience of at least two years in a relevant field; or e) 20 years or older with the right aptitude and skills needed to succeed in the programme. International learners must also have achieved an English proficiency outcome of an IELTS academic score of 5.5 with no band score lower than 5 or any of the other recognised proficiency outcomes for international students listed in the appendix to the NZQF Programme Approval and Accreditation Rules 2013."}],"words":423},{"id":"wp-awards","type":"page","title":"Awards & Recognition","route":"awards","updated":"2020-07-17","source":"/about-us/awards/","sections":[{"h":"","t":"PBRS has a strong record of success in providing excellent outcomes for its students. For over 15 years, PBRS has achieved a myriad of successes and a reputation as a leading hospitality training establishment, winning the New Zealand Hospitality Championship, NZ Training Provider of the Year for 2014, 2016, 2017 and 2018 and winning the Auckland Regional Championships in 2019 - 2014 New Zealand Training Establishment of the Year - 2016 New Zealand Training Establishment of the Year - 2017 New Zealand Training Establishment of the Year - 2018 New Zealand Training Establishment of the Year - 2017 Training Chef of the Year: Sio Sio Wang ( Cookery level 5 student ) - 2017 Cocktail Supreme Champion of the Year : Mohit Sharma ( PBRS Tutor ) - 2018 Training Chef of the Year: Carrie Eunsook IM ( Cookery level 5 student ) - 2018 Training Service Person of the Year: Marisa Omaweng ( PBRS Hospitality student )"},{"h":"13 Gold 7 Silver 6 Bronze!","t":"The Professional Business & Restaurant School (PBRS) which is part of Cornell Education Group participated in the Auckland Regional Hospitality Championships 2019 on 24th June. PBRS entered 26 students in 13 different categories this year with outstanding success It is with great pride that we report our students' excellent results: This gratifying result is a reflection of all the extra hours of work and passion that our Cookery and Hospitality tutors put in to ensure that our students received excellent training, that is up to date and relevant to the cookery / hospitality industry in New Zealand. Experts confirm that PBRS is the BEST"},{"h":"NZ Training Establishment of the Year","t":"Experts confirm that PBRS is the BEST It is with great pride that The Cornell Education Group accepts the following awards for The NZ Chefs National Hospitality Championships 2018: • New Zealand Training Establishment of the Year • Training Chef of the Year • Training Service Person of the Year for TCEG Professional Cookery and Hospitality schools. This is an outstanding result that has demonstrated The Cornell Education Group's professionalism and excellence in training future personnel for the cookery and hospitality industry in New Zealand."},{"h":"NZ Training Establishment of the Year","t":"The NZ Chefs National Hospitality Championships 2017 event (Held from the 27th ~ 30th of July 2017 at the Logan Campbell Centre, ASB Showgrounds) was well attended by all of the leading training establishments across New Zealand who were anxiously waiting to see the outcomes of the highly coveted awards. The Cornell competitors excelled in their trades and brought home 45 medals along with immense pride in their skills. With 12 gold, 25 silver and 8 Bronze medals won by the Cornell students, there is an air of confidence and appreciation, for the support that the school has provided in preparing the students for the competitions. Cornell prides itself on investing in the next generation and creating opportunities for those who may not have competed in such a prestigious competition before. All staff members at Cornell congratulate the Tutors and competitors on a great effort and an extremely positive outcome. This result reflects the extra work that our tutors put in to ensure that our students achieve their potential and enjoy success. This result is a reflection on all the extra hours of work and passion that our Tutors have put in it to ensure that our students receive excellent training, that is up to date and relevant to the cookery and hospitality industry in New Zealand."},{"h":"NZ Training Establishment of the Year","t":"(8 Gold, 13 Silver, 12 Bronze Medals) It is with great pride that The Cornell Education Group accepts the award of 'New Zealand Training Establishment of the year' for our Professional Cookery and Hospitality schools. This is an outstanding results that has demonstrated The Cornell Education Group's professionalism and excellence in training for the cookery / hospitality industry in New Zealand. This NZ Chefs National Salon 2016 event ( 28 July – 31 July 2016 at the Logan Campbell Centre, ASB Showgrounds) was dominated by all of the larger training establishments who were present to see the outcomes of the highly coveted awards. All the staff members at Cornell congratulates the trainers and competitors on a great effort and extremely positive outcome. This result reflects the extra work that our tutors put into ensuring that our students receive training that is excellent, up to date and relevant to our industry,"},{"h":"New Zealand Culinary Fare Training Excellence Award 2014","t":"We are also the recipient of the New Zealand Culinary Fare Training Excellence Award 2014. The Restaurant Association of New Zealand was formed in 1975 with the aim of serving and representing owners and managers of restaurants and foodservice operations. The association represents 1,800 members throughout New Zealand. They were the organizers of the New Zealand Culinare Fare."},{"h":"Indian Business Awards","t":"The Professional Business and Restaurant School is an award winning education provider both domestically and internationally. Notably, PBRS won the Best Exporter to India Award at the Indian Business Awards 2012 for the third year running."}],"words":843},{"id":"wp-staff-2-2","type":"page","title":"Our Staff","route":"about","updated":"2024-02-28","source":"/staff-2-2/","sections":[{"h":"Strategic Management Team","t":"Principal Parks White | | Principal Parks White | General Manager, Operations Jun Kim | | General Manager, Operations Jun Kim Principal Parks White"},{"h":"Principal","t":"Parks White General Manager, Operations Jun Kim"},{"h":"General Manager, Operations","t":"Jun Kim Programme Manager Michael Corbett | | Programme Manager Michael Corbett | Quality Assurance Manager Andrew Ayles | | Quality Assurance Manager Andrew Ayles Programme Manager Michael Corbett"},{"h":"Programme Manager","t":"Michael Corbett Quality Assurance Manager Andrew Ayles"},{"h":"Quality Assurance Manager","t":"Andrew Ayles Administration & Student Service"},{"h":"Administration & Student Service","t":"Administration Manager Kathy Ku | | Administration Manager Kathy Ku | Administrator Herlin Wahyuni | | Administrator Herlin Wahyuni Administration Manager Kathy Ku"},{"h":"Administration Manager","t":"Kathy Ku Administrator Herlin Wahyuni"},{"h":"Administrator","t":"Herlin Wahyuni Marketing"},{"h":"Marketing","t":"Marketing Manager Jayaraj ARUL SAMJI DDI: +64-9-915-3503 Marketing Manager Regina Lee DDI: +64-9-367-3504 Marketing Assistant Simonne Ferro | Marketing Manager Jayaraj ARUL SAMJI DDI: +64-9-915-3503 | | Marketing Manager Jayaraj ARUL SAMJI DDI: +64-9-915-3503 | Marketing Manager Regina Lee DDI: +64-9-367-3504 | | Marketing Manager Regina Lee DDI: +64-9-367-3504 | Marketing Assistant Simonne Ferro | | Marketing Assistant Simonne Ferro | Marketing Manager Jayaraj ARUL SAMJI DDI: +64-9-915-3503 | | Marketing Manager Jayaraj ARUL SAMJI DDI: +64-9-915-3503 | Marketing Manager Regina Lee DDI: +64-9-367-3504 | | Marketing Manager Regina Lee DDI: +64-9-367-3504 Marketing Manager Jayaraj ARUL SAMJI DDI: +64-9-915-3503"},{"h":"Marketing Manager","t":"Jayaraj ARUL SAMJI DDI: +64-9-915-3503 Marketing Manager Regina Lee DDI: +64-9-367-3504"},{"h":"Marketing Manager","t":"Regina Lee DDI: +64-9-367-3504 Marketing Assistant Simonne Ferro | | Marketing Assistant Simonne Ferro | Marketing Assistant Simonne Ferro"},{"h":"Marketing Assistant","t":"Simonne Ferro"}],"words":261},{"id":"wp-why-learn-at-pbrs","type":"page","title":"Why learn at PBRS","route":"about","updated":"2015-08-07","source":"/about-us/why-learn-at-pbrs/","sections":[{"h":"About PBRS","t":"Welcome to New Zealand's specialist hospitality training institute. Established in 1993, PBRS has many graduates working worldwide. By studying with New Zealand's specialist hospitality institute you can be sure that your future career is in good hands. As part of the Cornell Education Group, PBRS combines an unequalled blend of highly qualified, and industry experienced tutorial staff, outstanding training facilities, a rigorous quality assurance process, and offer a completely up-to-date and relevant course curriculum which meets the needs of the local industry. This approach guarantees that students graduate from PBRS with qualifications that will fully prepare them for success in their careers."},{"h":"Why PBRS is an excellent study choice?","t":"- All PBRS qualifications are world-class and internationally recognised. - We have highly skilled professionals on our teaching staff, who are dedicated to motivate students to realise their full potential, and who are taught in a culturally safe, and respectful manner. - The PBRS Hospitality qualifications are industry driven: this maximises your investment and enhances your potential for future success. - PBRS has purpose built educational facilities with fully functional bars, cafes and restaurants that allow students to develop their skills in a real hospitality environment. - PBRS student employment service team, iCareer, is developing constantly relevant and beneficial employment alliances with large hotels as well as with small independent hospitality businesses. - PBRS has campuses located in Auckland and Panmure; both are conveniently situated in the central business and hospitality districts of New Zealand's two largest cities. - Learn and have fun at the same time! Be part of this family where your tutors will focus and guide you in every step of the way."}],"words":277},{"id":"wp-calendar","type":"page","title":"Calendar","route":"events","updated":"2017-01-17","source":"/calendar/","sections":[{"h":"Public holidays 2017","t":"- Sunday 1 January or Tuesday 3 January — New Year's Day - Monday 2 January — Day after New Year's Day - Monday 6 February — Waitangi Day - Friday 14 April — Good Friday - Monday 17 April — Easter Monday - Tuesday 25 April — ANZAC Day - Monday 5 June — Queen's Birthday - Monday 23 October — Labour Day - Monday 25 December — Christmas Day - Tuesday 26 December — Boxing Day"},{"h":"Anniversary days 2017","t":"- Monday 30 January — Auckland anniversary day - Monday 25 September — Canterbury (South) anniversary day - Friday 17 November — Canterbury anniversary day - Monday 27 November — Chatham Islands anniversary day - Friday 20 October — Hawke's Bay anniversary day - Monday 30 October — Marlborough anniversary day - Monday 30 January — Nelson anniversary day - Monday 30 January — Northland anniversary day - Monday 20 March — Otago anniversary day - Tuesday 18 April — Southland anniversary day - Monday 13 March — Taranaki anniversary day - Monday 23 January — Wellington anniversary day - Monday 4 December — Westland anniversary day"}],"words":191},{"id":"wp-courses","type":"course-archive","title":"Courses","route":"courses","updated":"2020-10-07","source":"/courses/","sections":[{"h":"Courses at PBRS.","t":"Choose from a variety of courses offered here at PBRS. PBRS prepares graduates for the height of what hospitality professionalism is all about. Upon graduation they have the opportunity to work in a wide range of diverse and exciting hospitality roles. Some of which include: – Bartender – Bar/Restaurant Manager – Waiter – Barista (coffee maker) One of the great things about working in the hospitality industry is the flexibility of working hours so that a role can easily fit around your life. With the ability to choose between part time or full time hours, a job in hospitality offers you plenty of options for when and where you can, or wish to work. Your passport to travel the world! PBRS has thousands of graduates working not only throughout New Zealand but also around the world. Whether working on cruise ships, international hotels and resorts, or traveling around Europe working in pubs and restaurants on your overseas experience; hospitality is a career choice that can take you around the world. Hospitality is the world's fastest-growing industry If you are serious about a career in an industry with a bright future, hospitality is the path for you. It is the world's largest and fastest growing industry and it is set to expand even more. With this constant growth there are constant employment opportunities for you to further develop your career. Is hospitality for you? Are you: - Looking for a fun, practical, hands-on job? - Interested in a career which opens up opportunities to meet people? - Wanting to enjoy new and different challenges every day? - Eager for great career advancement and travel? - …..Then yes, the hospitality industry may well be for you! Click among these courses: - New Zealand Certificate in Cookery Level 4 - International Diploma in Food Preparation and Cookery Supervision – (Advanced) Level 5 - New Zealand Diploma in Hospitality Managemen Level 5 - New Zealand Diploma in Hospitality Management-Level 6"}],"words":329},{"id":"wp-about-us","type":"page","title":"About Us","route":"about","updated":"2023-11-21","source":"/about-us/","sections":[{"h":"","t":"Employment Focus Limited trading as the Professional Business and Restaurant School (PBRS) was established in 2000 and operates a specialist management and hospitality training institute. PBRS aims to provide high quality courses that are relevant to the needs of the hospitality industry and to the students. It is located in central Auckland with excellent access to hospitality outlets. Many of the other hospitality training institutions are located out of the city centre. PBRS is proud of its excellent reputation in the industry and the high esteem in which its graduates are held. PBRS acknowledges that it has an important role to play in ensuring that progress is made in the areas identified as Government priorities. It takes cognizance of the positive outlook for the hospitality industry and adopts a holistic approach to catering for the needs of its students. PBRS has a strong record of success in providing excellent outcomes for its students. All our facilities are modern with spacious classrooms and computer laboratories and five professional commercial training kitchens and a training restaurant. PBRS is a long-standing and reputable private training establishment (PTE) specialising in the provision of tertiary education and training for the hospitality industry. With campuses in Central Auckland, its goal is to provide high quality, relevant training and education supported by appropriate work experience to ensure that graduates have excellent career opportunities and/or a solid basis for further education in the field of hospitality. Vision: PBRS will be the most distinguished educational institution with a local and international reputation for excellence. Mission: To provide quality and relevant education and professional training delivered by skilled and qualified teachers to meet industry, student and community needs. Strategies: - Adopt a distinctive educational emphasis - Provide a holistic learning, teaching and student experience that is unique - Deepen engagement with alumni, industry and other stakeholders - Strengthen PBRS's capability Our Strategic Business Plan with our Renewed focus towards Building for Education Success can be viewed in detail through this link: Strategic Business Plan Values: PBRS's core ethical values are: - Respect/Aroha: We treat everyone with respect, empathy, hospitality and generosity, showing connection - Excellence: We strive to be extremely good or outstanding in all we do - Equity: We are fair and impartial with everyone - Integrity: We behave with honesty, showing strong moral principles - Ako: The effective partnership we aim to create through a two-way teaching and learning relationship EER review NZQA assesses the standard of education for tertiary education organisations through a regular system of external evaluation and review (EER). Through periodic EER, tertiary education organisations are held accountable to their students, employers, funders, quality assurance bodies and other interested parties. Professional Business and Restaurant School (PBRS) http://www.nzqa.govt.nz/providers/details.do?providerId=745571001 PBRS's most recent EER was in 2022, where we retained our Category two status. The NZQA EER team was Confident in the educational performance and Confident in the capability in self- assessment of Employment Focus Limited ( T/A : PBRS: The Professional Business and Restaurant School ) Education Code of Practice 2021 The Education (Pastoral Care of Tertiary and International Learners) Code of Practice 2021 (the Code) supports the wellbeing of tertiary and international learners enrolled with New Zealand education providers. For the wellbeing and safety of their learners, education providers including PBRS must follow guidelines set out in the Education (Pastoral Care of International Students) Code of Practice 2021. These guidelines are meant to assist signatories and potential signatories in establishing practices that comply with legislative expectations and requirements. In the Code, signatories are required to provide their international students with a range of outcomes, as well as key processes for supporting international students' achievement, well-being, and rights. A Copy of the Education (Pastoral Care of Tertiary and International Learners) Code of Practice 2021 can be downloaded from this Link . How does the Code relate to you as a learner ? To ensure that international students are well informed, safe and properly cared for when they come to study in New Zealand, PBRS (pastoral care) follows the code of practice, and through a dedicated support line, students have the right to be treated fairly at all ages and levels of education. PBRS Self-Review Report Please find the link to access PBRS self-review report can be accessed from here . In our role as a tertiary provider, we ensure that our learners are aware of the Code, so that they will be protected and their wellbeing will be protected. For more information on how you can get to know the Code, please click here ."},{"h":"Our Campus.","t":"This is within walking distance of Auckland's central train and bus stations, close to a variety of shops, restaurants and cafes as well as being located beside the highest structure in the Southern hemisphere, the iconic Sky Tower. The Auckland campus has a purpose built training ails and campus","route":"contact","updated":"2026-10-01","words":40,"sections":[{"h":"Contact","t":"Professional Business & Restaurant School (PBRS) is at Level 1, 150 Hobson Street, Auckland CBD. Telephone +64 (09) 367 1010. Fax +64 9 367 1020. Email info@pbrs.ac.nz. PBRS is 100% NZ owned and operated and part of the Cornell Education Group."}]}]};

/* PBRS knowledge-base search (BM25 with title/heading boosts and phrase matching).
   One file, used by the browser prototype and by the Express server (server/src/kb.js), so answers are identical in both.
   Input: the object in server/data/kb.json. Nothing here touches the network. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.KBS = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const STOP = new Set(('a an and are as at be by can could do does for from had has have how i if in into is it its me my of on or our ' +
    'so than that the their them then there these they this to up us was we were what when where which who why will with would you your ' +
    'about tell please want need know get give show find any some more also just like').split(' '));

  function stem(w) {
    if (w.length > 5 && w.endsWith('ing')) w = w.slice(0, -3);
    else if (w.length > 4 && w.endsWith('ies')) w = w.slice(0, -3) + 'y';
    else if (w.length > 4 && w.endsWith('ed')) w = w.slice(0, -2);
    else if (w.length > 3 && w.endsWith('es') && /(s|x|z|ch|sh)es$/.test(w)) w = w.slice(0, -2);
    else if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) w = w.slice(0, -1);
    return w;
  }
  const SYN = { fee: 'fee', fees: 'fee', cost: 'fee', price: 'fee', tuition: 'fee', pay: 'fee', payment: 'fee', money: 'fee', charge: 'fee',
    refund: 'refund', withdraw: 'refund', cancel: 'refund', quit: 'refund', leave: 'refund',
    visa: 'visa', immigration: 'visa', permit: 'visa',
    job: 'job', work: 'job', employ: 'job', employment: 'job', career: 'job', placement: 'job',
    insurance: 'insurance', insure: 'insurance', medical: 'insurance', health: 'insurance',
    stay: 'accommodation', housing: 'accommodation', homestay: 'accommodation', accommodation: 'accommodation', live: 'accommodation',
    english: 'english', ielts: 'english', language: 'english',
    start: 'intake', begin: 'intake', intake: 'intake', date: 'intake', term: 'intake', calendar: 'intake',
    phone: 'contact', call: 'contact', email: 'contact', address: 'contact', contact: 'contact', location: 'contact', where: 'contact' };

  function tokens(text, keepStop) {
    const out = [];
    String(text || '').toLowerCase().replace(/[’']/g, '').split(/[^a-z0-9$]+/).forEach(w => {
      if (!w || (!keepStop && STOP.has(w))) return;
      out.push(stem(w));
    });
    return out;
  }
  const withSyn = ts => { const o = ts.slice(); ts.forEach(t => { if (SYN[t] && SYN[t] !== t) o.push(SYN[t]) }); return o };

  /* split a section into chunks of about 70 words, on sentence boundaries */
  function sentences(text) {
    const t = String(text || '').replace(/\s+/g, ' ').trim();
    const parts = t.split(/(?<=[.!?])\s+(?=[A-Z0-9"(\-])/);
    return parts.map(s => s.trim()).filter(Boolean);
  }
  function chunkSection(text, max) {
    const ss = sentences(text), out = []; let cur = [], n = 0;
    ss.forEach(s => { const w = s.split(' ').length; if (n + w > max && cur.length) { out.push(cur.join(' ')); cur = []; n = 0 } cur.push(s); n += w });
    if (cur.length) out.push(cur.join(' '));
    return out;
  }

  function createIndex(kb) {
    const chunks = [], df = new Map();
    kb.docs.forEach((d, di) => {
      const tt = tokens(d.title);
      d.sections.forEach((s, si) => {
        const ht = tokens(s.h);
        chunkSection(s.t, 70).forEach((c, ci) => {
          const body = tokens(c);
          const weighted = body.concat(ht, ht, tt, tt, tt);
          const tf = new Map(); weighted.forEach(w => tf.set(w, (tf.get(w) || 0) + 1));
          tf.forEach((_, w) => df.set(w, (df.get(w) || 0) + 1));
          chunks.push({ di, si, ci, text: c, lower: c.toLowerCase(), tf, len: weighted.length });
        });
      });
    });
    const N = chunks.length, avg = chunks.reduce((a, c) => a + c.len, 0) / Math.max(1, N);
    const idf = w => Math.log(1 + (N - (df.get(w) || 0) + .5) / ((df.get(w) || 0) + .5));

  /* returns the best passages, at most one per document unless `perDoc` is raised */
  function search(index, query, opts) {
    opts = opts || {};
    const limit = opts.limit || 5, perDoc = opts.perDoc || 1;
    const qt = withSyn(tokens(query));
    if (!qt.length) return { terms: [], hits: [], best: 0 };
    const uniq = [...new Set(qt)];
    const k1 = 1.3, b = .72;
    const q = String(query || '').toLowerCase();
    const bigrams = []; { const raw = tokens(query, true); for (let i = 0; i < raw.length - 1; i++) bigrams.push(raw[i] + ' ' + raw[i + 1]) }
    const scored = [];
    index.chunks.forEach(c => {

      uniq.forEach(w => { const f = c.tf.get(w); if (!f) return; matched++; sc += index.idf(w) * (f * (k1 + 1)) / (f + k1 * (1 - b + b * c.len / index.avg)) });

    scored.sort((a, z) => z.sc - a.sc);
    const hits = [], seen = new Map(), texts = new Set();
    for (const s of scored) {
      const n = seen.get(s.c.di) || 0;
      if (n >= perDoc) continue;
      const key = s.c.lower.slice(0, 70);
      if (texts.has(key)) continue;   /* the same passage stored twice (migrated copy and public copy) */
      texts.add(key);
      seen.set(s.c.di, n + 1);
      const d = index.kb.docs[s.c.di], sec = d.sections[s.c.si];
      hits.push({ doc: d, heading: sec.h, text: s.c.text, score: s.sc, matched: s.matched, terms: uniq });
      if (hits.length >= limit) break;
    }
    return { terms: uniq, hits, best: hits.length ? hits[0].score : 0 };
  }

  /* the sentences of a passage that answer the query best, in their original order */
  function bestSentences(text, terms, max) {
    const ss = sentences(text);
    if (ss.length <= max) return ss;
    const set = new Set(terms);
    const sc = ss.map((s, i) => ({ s, i, v: tokens(s).reduce((a, w) => a + (set.has(w) ? 1 : 0), 0) - i * .01 - (/(https?:|www\.|@)/i.test(s) ? 3 : 0) - (s.length < 25 ? 1.5 : 0) }));
    return sc.sort((a, z) => z.v - a.v).slice(0, max).sort((a, z) => a.i - z.i).map(x => x.s);

  /* strong enough to answer? (tuned on the questions in test/kb.test.js) */
  function confident(res, query) {

    const top = res.hits[0], need = Math.min(2, Math.max(1, Math.ceil(res.terms.length / 3)));

  function answer(index, query, opts) {
    const res = search(index, query, { limit: 6, perDoc: 1 });
    if (!confident(res, query)) return { ok: false, res };
    const [h1, ...rest] = res.hits;

});
