itle":"Enrolment policy: Withdrawal and Refund Policy","route":"policies","anchor":"withdrawal-and-refund-policy","updated":"2022-08-26","sections":[{"h":"Withdrawal and Refund Policy","t":"| Course length | When you withdraw | Refund | | --- | --- | --- | | 1 to 34 days | Before the course starts, or within the first two working days | 50% of total fees paid | | 1 to 34 days | After two working days | No refund | | 35 days to 3 months | Before the course starts, or within the first five working days | 75% of total fees paid | | 35 days to 3 months | After five working days | No refund | | More than 3 months | Before the course starts, or within the first ten working days | Full refund of all fees paid, less 25% of total tuition and enrolment fees | | More than 3 months | After ten working days | No refund |"},{"h":"Withdrawal and Refund Policy","t":"Please note:"},{"h":"Withdrawal and Refund Policy","t":"- The first day of your programme is recorded on the student's “Offer of Place” letter. - Student visa not granted before and/or within the first 10 working days of the course commencement – The student must provide an official letter from INZ confirming the visa decline: The student will receive a full refund of all fees paid less a deduction of 10% up to a maximum of $500 - Student visa not granted after the first 10 working days of the course commencement – The student must provide an official letter from INZ confirming the visa decline: The student will receive a refund of the balance of unconsumed tuition fees paid - Student visa extension not granted – The student must provide an official letter from INZ confirming the extension decline: The student will receive a refund of the balance of unconsumed tuition fees paid - If PBRS decides, for any reason, to discontinue a programme of study (including if PBRS ceases to be a signatory of the Code or a registered provider), all fees paid for services not delivered or the unused portion of fees will be refunded or transferred to another institute as agreed with the student. Other than the student being entitled to such refund, it will have no other further claim against PBRS. - No refund is available if a student is withdrawn from study by PBRS for disciplinary reasons including: inappropriate behaviour, poor attendance or inadequate academic progress, transfer to another school after the refund period. - No refund is available if a student's enrolment is cancelled because the enrolment application is found to be inaccurate in any way. - No refund is available if a student has their visa/permit to study at PBRS cancelled. - If a student wishes to withdraw from a homestay arranged by PBRS, they must provide at least two (2) weeks' notice in advance either before they arrive in New Zealand or before the date on which they wish to leave the homestay accommodation. Failure to provide this notice will result in 2 weeks accommodation fees being forfeited. The homestay placement fee is not refunded under any circumstances. - If a student wishes to cancel a booked airport pick up, they must provide at least one (1) week's notice before the arrival date and a full refund of the airport pick up fee will be made. Otherwise, the entire fee will be retained. - Full refund of an insurance fee paid through PBRS will be made if the student requests withdrawal before the course starts or within one week of the course starts. No refund of an insurance fee will be given after one week of the programme start date. - In a case where a student has asked PBRS to buy insurance earlier than within one (1) week of when the course starts, the student is required to inform PBRS in advance, so that the student insurance can be arranged earlier. In this case, no refund of insurance fee will be given after two weeks of when the insurance is bought. - Living costs paid to PBRS will be fully refunded on the student's request - Late requests: In exceptional circumstances, late notices of withdrawal and requests for refund may be submitted, and these will be considered on a case-by-case basis. Possible reasons for such requests include: - Serious illness or disability of the student - Death of a student or close family member (parent, sibling, spouse or child) - Political, civil or natural event that prevents arrival of the student"},{"h":"Withdrawal and Refund Policy","t":"Full documentation must be supplied to support each application."},{"h":"Withdrawal and Refund Policy","t":"Where a late request is approved, the amount to be refunded may be reduced at the Institute's sole discretion. In particular, deductions may be made to take account of items such as fees for services provided prior to withdrawal, and any payments to agents in relation to the student's enrolment. Refund of other fees will be made in accordance with the relevant policies."}],"words":829},{"id":"policy-withdrawal-and-refund-process","type":"policy","title":"Enrolment policy: Withdrawal and Refund Process","route":"policies","anchor":"withdrawal-and-refund-process","updated":"2022-08-26","sections":[{"h":"Withdrawal and Refund Process","t":"1. Any applications for withdrawal must be made in writing on the appropriate withdrawal form, and must state reasons in full. Written confirmation from the payee student's parents or legal guardian is required, if the student is under 18. 2. All applications for a refund will be reviewed and decided upon by the PBRS Executive Management Team in accordance with the Withdrawal and Refund Policy 3. Notification as to the decision in relation to the refund application will be supplied to the student within ten working days of receipt of the application. 4. A refund will be made within five (5) working days of the day on which a decision to refund is made. Payment will be made to the student's account or a third party account agreed by the student. Where a student is under 18 years of age, the parent(s) or the legal guardian will need to give his/her signed approval and a clear indication of the account into which the refund will be made. 5. All fees are received and refunded in NZ dollars. PBRS is not responsible for any currency fluctuations between enrolment and payment of refund, and is not responsible for any bank charges incurred through the deposit of funds into your nominated account. 6. PBRS will notify Immigration New Zealand (INZ) of your withdrawal within one (1) week. This may affect the student's visa status."}],"words":235},{"id":"policy-attendance","type":"policy","title":"Enrolment policy: Attendance","route":"policies","anchor":"attendance","updated":"2022-08-26","sections":[{"h":"Attendance","t":"Students studying at PBRS are required to maintain excellent attendance throughout the programme. Any student who fails to meet this attendance requirement may be subject to expulsion from the programme and PBRS will notify Immigration New Zealand."},{"h":"Attendance","t":"At PBRS, you are expected to attend class for 20 hours per week. Classes will be arranged during the week. Class Time each day may be different. A detailed timetable will be given to you on the orientation day for the first term and will be given about 1 week before term starts for the rest. It is important to think about your class time before you take any job."}],"words":109},{"id":"policy-recognition-of-prior-learning-rpl-and-cross-credit-cc","type":"policy","title":"Enrolment policy: Recognition of Prior Learning (RPL) and Cross Credit (CC)","route":"policies","anchor":"recognition-of-prior-learning-rpl-and-cross-credit-cc","updated":"2022-08-26","sections":[{"h":"Recognition of Prior Learning (RPL) and Cross Credit (CC)","t":"Where a student believes he/she may be eligible for this, contact needs to be made with the school for the forms to apply for this recognition. An additional processing fee of $500 will be required. This process must be completed before the Offer of Placement Letter is issued. No RPL/CC will be considered after the student has started his/her course."}],"words":69},{"id":"policy-notification","type":"policy","title":"Enrolment policy: Notification","route":"policies","anchor":"notification","updated":"2022-08-26","sections":[{"h":"Notification","t":"In signing this enrolment form you undertake to comply with the regulation to notify PBRS of your current contact details in New Zealand and in your home country, accommodation type, residential address and immigration status at all times, and you accept that failure to do so may result in your enrolment with PBRS being terminated."}],"words":56},{"id":"policy-orientation","type":"policy","title":"Enrolment policy: Orientation","route":"policies","anchor":"orientation","updated":"2022-08-26","sections":[{"h":"Orientation","t":"Before your course starts, there will be a class orientation that will include:"},{"h":"Orientation","t":"- Warm welcome from all staff and students - An introduction to your fellow students, members of management, lecturers and all other staff - An introduction to your chosen program, facilities and the requirements for training - An explanation of the rules, regulations (including the Education (Pastoral Care of Tertiary and International Learner) Code of Practice 2021 and the Health & Safety requirements etc. You will have the opportunity to sign the learning contract to demonstrate your agreement to abide by these. A Student Handbook will be provided on the day. - A copy of your passport & student visa and a copy of your medical & travel insurance certificate are required to be provided to the school."},{"h":"Orientation","t":"Make sure to check our Facebook page ([www.facebook.com/pbrsinternational](https://www.facebook.com/pbrsinternational)) for announcements, and these schedules are subject to change."}],"words":151},{"id":"policy-accommodation","type":"policy","title":"Enrolment policy: Accommodation","route":"policies","anchor":"accommodation","updated":"2022-08-26","sections":[{"h":"Accommodation","t":"As per the requirement of the Education (Pastoral Care of Tertiary and International Learner) Code of Practice 2021, for international students aged under 18, they must live with their parents, designated caregiver or PBRS arranged homestay. Please discuss with our Marketing Managers about your accommodation arrangement if you are under 18. You and your parents may be required to fill in some forms regarding this."},{"h":"Accommodation","t":"PBRS also provides accommodation arrangements for international students aged over 18 on request but we must have a minimum of 4 weeks' notice. The minimum period of homestay is 4 weeks. Fees will apply. Please check with us for details."},{"h":"Accommodation","t":"For international students aged over 18 who want to find your own accommodation, you may find general information on renting at <https://www.tenancy.govt.nz, or find information on quality standards for renting at: <http://www.mbie.govt.nz/info-services/housing-property/tenancy/residential-tenancies-regulations-for-insulation-and-smoke-alarms. You are also welcome to talk with our Pastoral Care Team and seek more advice."}],"words":155},{"id":"policy-circumstances-in-which-pbrs-may-terminate-enrolment","type":"policy","title":"Enrolment policy: Circumstances in which PBRS may Terminate Enrolment","route":"policies","anchor":"circumstances-in-which-pbrs-may-terminate-enrolment","updated":"2022-08-26","sections":[{"h":"Circumstances in which PBRS may Terminate Enrolment","t":"- If a student is expelled according to the Disciplinary Process. Including situations as continued and/or unexplained absenteeism, inadequate progress, any breach of disciplinary regulations etc. - If a student is found having provided false or misleading information - If the Academy is unable to guarantee accommodation due to the student's behaviour (under 18 students) - If a student has criminal behaviour inside or outside the Academy's premises - If a student can not attend school to make up the missed programme time and needs to re-enrol if they wish to complete the programme for reasons such as illness or family obligations."},{"h":"Circumstances in which PBRS may Terminate Enrolment","t":"All decisions to terminate enrolment will be based on evidence, and the normal appeal procedure applies. If your enrolment is terminated:"},{"h":"Circumstances in which PBRS may Terminate Enrolment","t":"- No refund will be given - Immigration New Zealand and parents (if you are under 18) of yours will be notified about your problem and status."}],"words":171},{"id":"page-about-us","type":"page","title":"About Us","route":"about","updated":"2023-11-21","source":"/about-us/","sections":[{"h":"","t":"Employment Focus Limited trading as the Professional Business and Restaurant School (PBRS) was established in 2000 and operates a specialist management and hospitality training institute. PBRS aims to provide high quality courses that are relevant to the needs of the hospitality industry and to the students. It is located in central Auckland with excellent access to hospitality outlets. Many of the other hospitality training institutions are located out of the city centre. PBRS is proud of its excellent reputation in the industry and the high esteem in which its graduates are held."},{"h":"","t":"PBRS acknowledges that it has an important role to play in ensuring that progress is made in the areas identified as Government priorities. It takes cognizance of the positive outlook for the hospitality industry and adopts a holistic approach to catering for the needs of its students."},{"h":"","t":"PBRS has a strong record of success in providing excellent outcomes for its students. All our facilities are modern with spacious classrooms and computer laboratories and five professional commercial training kitchens and a training restaurant. PBRS is a long-standing and reputable private training establishment (PTE) specialising in the provision of tertiary education and training for the hospitality industry. With campuses in Central Auckland, its goal is to provide high quality, relevant training and education supported by appropriate work experience to ensure that graduates have excellent career opportunities and/or a solid basis for further education in the field of hospitality."},{"h":"","t":"Vision: PBRS will be the most distinguished educational institution with a local and international reputation for excellence."},{"h":"","t":"Mission: To provide quality and relevant education and professional training delivered by skilled and qualified teachers to meet industry, student and community needs."},{"h":"","t":"Strategies:"},{"h":"","t":"1. Adopt a distinctive educational emphasis 2. Provide a holistic learning, teaching and student experience that is unique 3. Deepen engagement with alumni, industry and other stakeholders 4. Strengthen PBRS's capability"},{"h":"","t":"Our Strategic Business Plan with our Renewed focus towards Building for Education Success can be viewed in detail through this link: [Strategic Business Plan](http://www.pbrs.ac.nz/wp/wp-content/uploads/2023/11/Strategic-Business-Plan-PBRS-2021-2024-Final-.pdf)"},{"h":"","t":"Values: PBRS's core ethical values are:"},{"h":"","t":"- Respect/Aroha: We treat everyone with respect, empathy, hospitality and generosity, showing connection - Excellence: We strive to be extremely good or outstanding in all we do - Equity: We are fair and impartial with everyone - Integrity: We behave with honesty, showing strong moral principles - Ako: The effective partnership we aim to create through a two-way teaching and learning relationship"},{"h":"","t":"EER review"},{"h":"","t":"NZQA assesses the standard of education for tertiary education organisations through a regular system of external evaluation and review (EER). Through periodic EER, tertiary education organisations are held accountable to their students, employers, funders, quality assurance bodies and other interested parties."},{"h":"","t":"Professional Business and Restaurant School (PBRS) <http://www.nzqa.govt.nz/providers/details.do?providerId=745571001"},{"h":"","t":"PBRS's most recent EER was in 2022, where we retained our Category two status. The NZQA EER team was Confident in the educational performance and Confident in the capability in self- assessment of Employment Focus Limited ( T/A : PBRS: The Professional Business and Restaurant School )"},{"h":"","t":"Education Code of Practice 2021"},{"h":"","t":"The [Education (Pastoral Care of Tertiary and International Learners) Code of Practice 2021 (the Code)](https://www.nzqa.govt.nz/providers-partners/tertiary-and-international-learners-code/) supports the wellbeing of tertiary and international learners enrolled with New Zealand education providers."},{"h":"","t":"For the wellbeing and safety of their learners, education providers including PBRS must follow guidelines set out in the Education (Pastoral Care of International Students) Code of Practice 2021. These guidelines are meant to assist signatories and potential signatories in establishing practices that comply with legislative expectations and requirements."},{"h":"","t":"In the Code, signatories are required to provide their international students with a range of outcomes, as well as key processes for supporting international students' achievement, well-being, and rights."},{"h":"","t":"A Copy of the [Education (Pastoral Care of Tertiary and International Learners) Code of Practice 2021](https://www.nzqa.govt.nz/assets/Providers-and-partners/Code-of-Practice/Tertiary-and-International-Learners-Code-2021/NZQAPastoral-Care-Code-of-PracticeEnglish.pdf) can be downloaded from this [Link](https://www.nzqa.govt.nz/assets/Providers-and-partners/Code-of-Practice/Tertiary-and-International-Learners-Code-2021/NZQAPastoral-Care-Code-of-PracticeEnglish.pdf)."},{"h":"","t":"How does the Code relate to you as a learner ?"},{"h":"","t":"To ensure that international students are well informed, safe and properly cared for when they come to study in New Zealand, PBRS (pastoral care) follows the code of practice, and through a dedicated support line, students have the right to be treated fairly at all ages and levels of education."},{"h":"","t":"PBRS Self-Review Report"},{"h":"","t":"Please find the link to access [PBRS self-review report can be accessed from here](http://www.pbrs.ac.nz/wp/wp-content/uploads/2023/10/2023-PBRS-Self-ReviewToolkitTertiaryProviders-Tool-E-Outcome-1-12-Final.pdf)."},{"h":"","t":"In our role as a tertiary provider, we ensure that our learners are aware of the Code, so that they will be protected and their wellbeing will be protected. For more information on how you can get to know the Code, [please click here](https://www.nzqa.govt.nz/providers-partners/tertiary-and-international-learners-code/know-the-code/)."},{"h":"Our Campus.","t":"This is within walking distance of Auckland's central train and bus stations, close to a variety of shops, restaurants and cafes as well as being located beside the highest structure in the Southern hemisphere, the iconic Sky Tower. The Auckland campus has a purpose built training bar, equipped with industry recognised equipment and staffed by both New Zealand and international hospitality professionals. Our cookery qualifications are delivered in purpose built facilities located on campus."},{"h":"Our Campus.","t":"As a specialist training institute we know the importance of studying in an environment that is completely orientated towards your industry of choice. PBRS combines highly qualified industry professional staff, purpose-built training facilities and a curriculum designed to meet the needs of employers. PBRS graduates are working world wide in bars, restaurants, hotels, cafes and on cruise ships: choose a career that's going places and the institute that will take you there!"}],"words":905},{"id":"page-awards","type":"page","title":"Awards & Recognition","route":"awards","updated":"2020-07-17","source":"/about-us/awards/","sections":[{"h":"","t":"PBRS has a strong record of success in providing excellent outcomes for its students. For over 15 years, PBRS has achieved a myriad of successes and a reputation as a leading hospitality training establishment, winning the New Zealand Hospitality Championship, NZ Training Provider of the Year for 2014, 2016, 2017 and 2018 and winning the Auckland Regional Championships in 2019"},{"h":"","t":"- 2014 New Zealand Training Establishment of the Year - 2016 New Zealand Training Establishment of the Year - 2017 New Zealand Training Establishment of the Year - 2018 New Zealand Training Establishment of the Year - 2017 Training Chef of the Year: Sio Sio Wang ( Cookery level 5 student ) - 2017 Cocktail Supreme Champion of the Year : Mohit Sharma ( PBRS Tutor ) - 2018 Training Chef of the Year: Carrie Eunsook IM ( Cookery level 5 student ) - 2018 Training Service Person of the Year: Marisa Omaweng ( PBRS Hospitality student )"},{"h":"**13 Gold 7 Silver 6 Bronze!**","t":"The Professional Business & Restaurant School (PBRS) which is part of Cornell Education Group participated in the Auckland Regional Hospitality Championships 2019 on 24th June. PBRS entered 26 students in 13 different categories this year with outstanding successIt is with great pride that we report our students' excellent results:"},{"h":"**13 Gold 7 Silver 6 Bronze!**","t":"This gratifying result is a reflection of all the extra hours of work and passion that our Cookery and Hospitality tutors put in to ensure that our students received excellent training, that is up to date and relevant to the cookery / hospitality industry in New Zealand."},{"h":"**13 Gold 7 Silver 6 Bronze!**","t":"Experts confirm that PBRS is the BEST"},{"h":"NZ Training Establishment of the Year","t":"Experts confirm that PBRS is the BEST"},{"h":"NZ Training Establishment of the Year","t":"It is with great pride that The Cornell Education Group accepts the following awards for The NZ Chefs National Hospitality Championships 2018:"},{"h":"NZ Training Establishment of the Year","t":"• New Zealand Training Establishment of the Year • Training Chef of the Year • Training Service Person of the Year for TCEG Professional Cookery and Hospitality schools."},{"h":"NZ Training Establishment of the Year","t":"This is an outstanding result that has demonstrated The Cornell Education Group's professionalism and excellence in training future personnel for the cookery and hospitality industry in New Zealand."},{"h":"NZ Training Establishment of the Year","t":"The NZ Chefs National Hospitality Championships 2017 event (Held from the 27th ~ 30th of July 2017 at the Logan Campbell Centre, ASB Showgrounds) was well attended by all of the leading training establishments across New Zealand who were anxiously waiting to see the outcomes of the highly coveted awards."},{"h":"NZ Training Establishment of the Year","t":"The Cornell competitors excelled in their trades and brought home 45 medals along with immense pride in their skills. With 12 gold, 25 silver and 8 Bronze medals won by the Cornell students, there is an air of confidence and appreciation, for the support that the school has provided in preparing the students for the competitions. Cornell prides itself on investing in the next generation and creating opportunities for those who may not have competed in such a prestigious competition before."},{"h":"NZ Training Establishment of the Year","t":"All staff members at Cornell congratulate the Tutors and competitors on a great effort and an extremely positive outcome. This result reflects the extra work that our tutors put in to ensure that our students achieve their potential and enjoy success. This result is a reflection on all the extra hours of work and passion that our Tutors have put in it to ensure that our students receive excellent training, that is up to date and relevant to the cookery and hospitality industry in New Zealand."},{"h":"NZ Training Establishment of the Year","t":"(8 Gold, 13 Silver, 12 Bronze Medals)"},{"h":"NZ Training Establishment of the Year","t":"It is with great pride that The Cornell Education Group accepts the award of 'New Zealand Training Establishment of the year' for our Professional Cookery and Hospitality schools."},{"h":"NZ Training Establishment of the Year","t":"This is an outstanding results that has demonstrated The Cornell Education Group's professionalism and excellence in training for the cookery / hospitality industry in New Zealand."},{"h":"NZ Training Establishment of the Year","t":"This NZ Chefs National Salon 2016 event ( 28 July – 31 July 2016 at the Logan Campbell Centre, ASB Showgrounds) was dominated by all of the larger training establishments who were present to see the outcomes of the highly coveted awards."},{"h":"NZ Training Establishment of the Year","t":"All the staff members at Cornell congratulates the trainers and competitors on a great effort and extremely positive outcome."},{"h":"NZ Training Establishment of the Year","t":"This result reflects the extra work that our tutors put into ensuring that our students receive training that is excellent, up to date and relevant to our industry,"},{"h":"New Zealand Culinary Fare Training Excellence Award 2014","t":"We are also the recipient of the New Zealand Culinary Fare Training Excellence Award 2014."},{"h":"New Zealand Culinary Fare Training Excellence Award 2014","t":"The [Restaurant Association of New Zealand](https://www.restaurantnz.co.nz/) was formed in 1975 with the aim of serving and representing owners and managers of restaurants and foodservice operations. The association represents 1,800 members throughout New Zealand. They were the organizers of the New Zealand Culinare Fare."},{"h":"Indian Business Awards","t":"The Professional Business and Restaurant School is an award winning education provider both domestically and internationally. Notably, PBRS won the Best Exporter to India Award at the Indian Business Awards 2012 for the third year running."}],"words":922},{"id":"page-testimonials","type":"page","title":"Our Students – Testimonials","route":"testimonials","updated":"2019-10-21","source":"/about-us/our-students-testimonials/","sections":[{"h":"Vanilyn Tugay","t":"Diploma in Hotel Management, Level 6"},{"h":"Vanilyn Tugay","t":"My Mentor was Mohit Sharma. As this was my first competition I was very excited to win a Gold medal and I put this down to the excellent training and hard work put in by Mohit."},{"h":"Vanilyn Tugay","t":"I highly recommend Cornell, the staff are knowledgeable and friendly and Andrew Ayles who is the Academic Team Leader of Hospitality school is also very supportive of the students entering competitions. This competition has helped me to find new jobs and has opened up my career prospects.”"},{"h":"Vanilyn Tugay","t":"Gold Medal, National Culinary Fare, 2016"},{"h":"Daryl Mercurio","t":"Diploma in Hospitality(Operational Management & Rooms Division) Level 5"},{"h":"Daryl Mercurio","t":"“My Tutor Jacques was also my mentor for this competition. He was very helpful and pushed me to achieve my very best and to get me out of my comfit zone. Because of this experience I am now a lot more confident when dealing with customers, especially as English is a second language for me."},{"h":"Daryl Mercurio","t":"Cornell is a great place to learn and improve on your knowledge. The icareer department are very helpful and knowable when helping you look for a job in Auckland. ”"},{"h":"Daryl Mercurio","t":"Gold Medal, National Culinary Fare, 2016"},{"h":"Candice Siazan","t":"Diploma in Hotel Management, Level 6"},{"h":"Candice Siazan","t":"“Olivia Ramos was my tutor and mentor. My training has been very beneficial to my career progress. It has given me the confidence and skills to advance quickly through my chosen field. Olivia is very passionate about the Hospitality Industry and has a huge amount of knowledge."},{"h":"Candice Siazan","t":"I will refer this school to my friends as it has not only given me the level 6 qualification but also hands on experience which is invaluable when looking for the right job's in Auckland.”"},{"h":"Candice Siazan","t":"Gold Medal, Regional Culinary Fare, 2016"},{"h":"Ma. Karina K. Makasaet","t":"Diploma in Hospitality (Operational Management & Rooms Division) Level 5"},{"h":"Ma. Karina K. Makasaet","t":"“I had no idea about coffee making and 'barista' skills until I started studying at Cornell. My tutor Olivia Ramos, encouraged me to enter the culinary fare in 2016. My competition success has given me an edge over other candidates and also looks great on my C.V."},{"h":"Ma. Karina K. Makasaet","t":"I would highly recommend Cornell to my friends as I have not only gained a qualification but also a lot of practical skills as well, which has given me the confidence to grow in the Hospitality Industry”"},{"h":"Ma. Karina K. Makasaet","t":"Bronze Medal, National Culinary Fare, 2016"},{"h":"Joanna Tabusares","t":"Diploma in Hotel Management, L6"},{"h":"Joanna Tabusares","t":"“Jauqes was my training tutor and helped me to build up my confidence before I entered the competition. He taught me how to fold napkins and how to set a table up under pressure. I am now more confident to move forward with my career as a result of his excellent training that I have received."},{"h":"Joanna Tabusares","t":"I also have an edge over other's applying for jobs as this looks really good on my C.V. as well. I would highly recommend Cornell to my friends. I have learnt how to work hard and how to balance my studies with work.”"},{"h":"Joanna Tabusares","t":"Silver Medal, National Culinary Fare, 2016"},{"h":"Ryuk Jo","t":"New Zealand Certificate in Food and Beverage Service (Café Services and Bar Services) (Level 3)"},{"h":"Ryuk Jo","t":"Diploma in Hospitality – Level 5 (Operational Management & Rooms Division)"},{"h":"Ryuk Jo","t":"Where are you from?"},{"h":"Ryuk Jo","t":"Japan. I came over to New Zealand with my family."},{"h":"Ryuk Jo","t":"I moved from Papermoon Mairangi Bay which is a workplace introduced to me by my tutor (Mohit Sharma) at the time."},{"h":"Ryuk Jo","t":"My level 3 tutor Mohit knew the manager at Papermoon and helped me get a job there."},{"h":"Ryuk Jo","t":"Throughout the course Mohit helped me and gave me advice to being a good bartender."},{"h":"Ryuk Jo","t":"I want to gain more skills and knowledge to become a top bartender. Enter competitions where I can, challenge and improve myself to move up within the hospitality industry."},{"h":"Beau McLean","t":"Certificate in Hospitality (Operations & Supervision) Level 4"},{"h":"Beau McLean","t":"I was born in Australia, after which I moved to Scotland, and then I moved to New Zealand in 1997. Before coming to study at PBRS I was at Unitec studying Performance Technology, but I decided to come to The Professional Bar & Restaurant School so I could expand my qualifications and learn something new and exciting."},{"h":"Beau McLean","t":"Hospitality is my passion, and I knew people who were going here who said it was really good, so I thought I would give it a go. I chose to study the Certificate in Hospitality (Operations & Supervision) Level 4 as it is a stepping stone to move up to a level 5 then a level 6 qualification."},{"h":"Beau McLean","t":"My favourite part of studying here so far is learning about HR and the process of opening a bar, as it really puts you into the frame of mind of what is required to own your own business in the hospitality industry."},{"h":"Beau McLean","t":"I currently work at Bestaff Hospitality Recruitment, through which I have worked at Vector Arena, SkyCity, Viaduct Events, and ASB Showgrounds, as well as contract catering at Spotless at Eden Park. Richard Doolan who runs Functionality, the PBRS employment agency, helped me get the job at Spotless."},{"h":"Beau McLean","t":"After finishing my studies I want to move to Australia and work for Carnival Australia, working on a cruise ship, or to go to New Plymouth and study the level 7 and 8 courses at their Hospitality Management School."},{"h":"Ashley Jordan Hunt","t":"Certificate in Hospitality (Operations & Supervision) Level 4"},{"h":"Ashley Jordan Hunt","t":"Before I came to PBRS I had left high school in 2010, after which I spent two years working at The Warehouse being on call and mostly sitting around doing nothing with my life until a friend suggested to me that I join PBRS. I have quite a few friends who study here and everybody had really good things to say about the course."},{"h":"Ashley Jordan Hunt","t":"I have never been an academic, but PBRS sets you up for success. The first month of the course (practical) gives you a taste of what working behind a bar would really be like. And even after you graduate if you think hospitality isn't for you, you have the skills and the certificate to fall back on because it is NZQA recognised. So far I have really enjoyed our first block, as we got to make our own cocktails which were also judged. It brought us together as a class and we all got to know each other a lot better as it broke the ice."},{"h":"Ashley Jordan Hunt","t":"Studying here has opened up the opportunity to work in hospitality straight away, as I am currently working as a bartender at Mainstreet Bar & Bistro in Henderson. Richard Doolan, who is the Careers Advisor at PBRS, helped me with the format and my language in my CV, and the tutors helped me with what I should expect in the interview, such as what sort of questions would be asked. Functionality (PBRS' in-house employment agency) is always friendly and full of advice, and the tutors are always willing to give you one on one practical experience.After I graduate I plan to continue on all courses I possibly can, and maybe one day own and run my own bar."},{"h":"Raven Panapa","t":"Certificate in Hospitality (Operations & Supervision) Level 4"},{"h":"Raven Panapa","t":"Before I came to The Professional Bar & Restaurant School I was studying at Education Action in Papakura, but after some thought I decided that I wanted to work in hospitality. My Grandmother was a caterer at Wesley College, and she used to get me to help her out, which I really enjoyed doing, so I knew I needed to change my studies to suit what made me happy. I saw the ad on TV and I thought “I really want to go there”, then when I came in and spoke with the staff I saw how cool they were and it sealed the deal for me."},{"h":"Raven Panapa","t":"I chose to study the Certificate in Hospitality (Operations & Supervision) Level 4 as I knew it would teach me everything I needed to know to go out and get a good job in the industry. My favourite part was the practical bar course, where you learn all the cocktails and practical skills. It is nerve racking coming in not knowing anyone, but from day one you make lots of friends."},{"h":"Raven Panapa","t":"I am currently working at Sun Yum Thai in Pukekohe. I got my job because one night when I was eating there I saw that they were really busy so I offered to help. They saw the skills that I learnt at The Professional Bar & Restaurant School and it really impressed them so they hired me."},{"h":"Raven Panapa","t":"When I am done studying I want to work my way up to be a manager of a restaurant and PBRS is teaching me everything I need to know to get my start in the hospitality industry. The Professional Bar & Restaurant School has helped me on this pathway more than I could have ever imagined."}],"words":1565},{"id":"page-staff","type":"page","title":"Our Staff","route":"about","updated":"2024-02-28","source":"/staff-2-2/","sections":[{"h":"**Principal**","t":"Parks White"},{"h":"**General Manager, Operations**","t":"Jun Kim"},{"h":"**Programme Manager**","t":"Michael Corbett"},{"h":"Quality Assurance Manager","t":"Andrew Ayles"},{"h":"Administration Manager","t":"Kathy Ku"},{"h":"Administrator","t":"Herlin Wahyuni"},{"h":"Marketing Manager","t":"Jayaraj ARUL SAMJI DDI: +64-9-915-3503"},{"h":"Marketing Manager","t":"Regina Lee DDI: +64-9-367-3504"},{"h":"Marketing Assistant","t":"Simonne Ferro"}],"words":41},{"id":"page-student-services","type":"page","title":"Student Services","route":"services","updated":"2022-04-08","source":"/student-services/","sections":[{"h":"","t":"There are various means by which students can seek support and guidance at PBRS. These include Academic Guidance, Pastoral Care, Learning Support, Careers Advice and help in securing study-related jobs through."},{"h":"Academic Guidance","t":"Students are welcome to consult their lecturers in the first instance if they wish to receive guidance in regard to the program that they are studying."},{"h":"Pastoral Care","t":"there are two separate avenues to gain this support. PBRS has a dedicated Pastoral Care Team offering front line personal support for students. Students from other language groups can gain frontline support from one of our Marketing Services team members in their own language. In cases where it is established that more professional services are required, the Pastoral Care Team will refer the student to specialist support services."},{"h":"Covid-19: Mental health and wellbeing resources","t":"The stress and uncertainty of Covid-19 restrictions can impact on students' mental health. The Ministry of Health has provided a list of resources, including some specifically aimed at young people."},{"h":"Covid-19: Mental health and wellbeing resources","t":"See [Covid-19: Mental health and wellbeing resources](https://www.health.govt.nz/our-work/diseases-and-conditions/covid-19-novel-coronavirus/covid-19-health-advice-public/covid-19-mental-health-and-wellbeing-resources)"},{"h":"**If you need help in a mental health crisis you should call:**","t":"- Auckland DHB – Mental Health Community Acute Service (CAS): [0800 800 717](tel:0800800717) - In an emergency, you should call 111"},{"h":"**After-hours support**","t":"For support outside regular hours you can call:"},{"h":"**After-hours support**","t":"- Lifeline [0800 543 354](tel:0800543354) - Youthline [0800 376633](tel:0800376633) or Free TXT 234 - Outline (Rainbow Support) [0800 688 5463](tel:08006885463)"},{"h":"Learning Support","t":"Where it is established that students need additional support they will have access to a Learning Support Lecturer or to our English Language School."},{"h":"Accommodation","t":"PBRS provides accommodation arrangements for international students on request but we must have a minimum of 4 weeks' notice. The minimum period of homestay is 4 weeks. A homestay placement fee ($240, non-refundable) will apply for this service. The homestay fees are (around $280/wk for over 18 students and $300/wk for under18 students). Airport pick up is available on request, and $100 will be charged for each pickup. All homestay families in PBRS homestay program are carefully selected. Students staying in a homestay are required to exhibit appropriate behaviour. For under 18 students, we will monitor the satisfaction of the Homestay placement regularly. Please check with your Pastoral Care Team for details."},{"h":"Accommodation","t":"For international students aged over 18 who want to find your own accommodation, you may find general information on renting at <https://www.tenancy.govt.nz, or find information on quality standards for renting at: [http://www.mbie.govt.nz/info-services/housing-property/tenancy/residential-tenancies-regulations-for-insulation-and-smoke-alarms](http://www.mbie.govt.nz/info-services/housing-property/tenancy/residential-tenancies-regulations-insulation-smoke-alarms/). You are also welcome to talk with our Pastoral Care Team and seek more advice."},{"h":"**Your rights as a tenant**","t":"When you rent a property as a tenant or join a shared house as a flatmate, you will have a number of rights and responsibilities."},{"h":"**Your rights as a tenant**","t":"Please visit [www.tenancy.govt.nz](http://www.tenancy.govt.nz/) website for more information"},{"h":"**Your rights as a tenant**","t":"[Renting a property, being a tenant or flatmate, and resolving disputes](https://www.tenancy.govt.nz/starting-a-tenancy/)"},{"h":"Careers Advice","t":"Students can consult either the lecturers in the field that they are most interested in, or in some cases, PBRS Employment Support staff may also be able to help. You may check [here](/employment/students) for more information about Employment Support."},{"h":"Computer Access:","t":"Access to computers at PBRS is offered between 9:00 am – 5:00 pm. Printing facilities are available. Wifi access is available in all campuses as well."},{"h":"Library access","t":"PBRS has a student library on site at level 2, 150 Hobson St. The library holds non-prescribed textbooks, other relevant readings, trade and professional magazines and some software."},{"h":"Library access","t":"There are other significant libraries within easy walking distance of the PBRS facilities in Auckland. These are to be found at the University of Auckland and AUT. They have very significant holdings in all fields – PBRS students may use but not borrow from these libraries."}],"words":635},{"id":"page-facilities","type":"page","title":"School Facilities","route":"facilities","updated":"2017-03-08","source":"/facilities-2/","sections":[{"h":"Classrooms","t":"All our classrooms are equipped computer systems and multimedia projectors for effective teaching tools."},{"h":"Computer Laboratories","t":"There are 5 computer laboratories for use at PBRS, equipped with the latest computers for an efficient learning experience in a modern teaching environment. We provide internet access, e-mail access, and printing services for our students."},{"h":"Kitchen","t":"Our kitchens are fully equipped with state-of-the-art appliances which provide the opportunity to acquire practical expertise in a realistic working environment for our cookery students."},{"h":"Training Restaurant","t":"The training restaurant serves as the laboratory for our hospitality students which exposes them to real situations in a restaurant setting."},{"h":"Cafeteria & Student Lounge","t":"A cafeteria and student lounge are available for our students' use for their class breaks, where they can meet up and get acquainted with students from other programs."},{"h":"Library","t":"The library is equipped with the latest edition of textbooks, journals and reference materials, which can be used by the students for their academic learning and assignments"}],"words":162},{"id":"page-new-zealand","type":"page","title":"About New Zealand","route":"newzealand","updated":"2017-03-08","source":"/newzealand/","sections":[{"h":"New Zealand Information","t":"Auckland is also known as one the top five cities worldwide for quality of living, according to (Mercer's 2008 Quality of Living survey) and it is considered much cheaper than many other countries like Sydney or London."},{"h":"General Profile(New Zealand)","t":"| | | | --- | --- | | Area | 103,736 sq mi = 269,000 sq km | | Population Feb 2014 | 4,509,700 | | Capital City | Wellington |"},{"h":"Climate","t":"Our coldest month is July, and our warmest is in January; our seasons opposite to those in the Northern Hemisphere. Average temperatures are around 15C (60F) in the upper North Island, and around 10C (50F) near the bottom of the South Island. The climate is fairly mild, without the extremes experienced in many other countries."},{"h":"Climate","t":"In fact, New Zealand doesn't tend to have temperatures over 35C (100F) or under -10C (14F). It tends to snow only in the mountains in the North Island, and mainly in the Southern Alps in the South Island, although it has been known to snow on some of the cities on the East Coast of the South Island from time to time."},{"h":"Currency","t":"Decimal system based on New Zealand dollar, with cent denominations."},{"h":"Currency","t":"| | | | | | | | --- | --- | --- | --- | --- | --- | | Coins | 10 cent | 20 cent | 50 cent | 1 dollar | 2 dollar | | Notes | 5 dollar | 10 dollar | 20 dollar | 50 dollar | 100 dollar |"},{"h":"Travel Details","t":"Visa:"},{"h":"Travel Details","t":"Not required of US citizens in possession of a return or onward ticket staying up to 90 days. Passports must be valid 3 months beyond date of departure"},{"h":"Travel Details","t":"Health:"},{"h":"Travel Details","t":"Must provide the Health Medical Certificate required by the NZ Immigration."},{"h":"Cultural","t":"| | | | | --- | --- | --- | | Languages | English & Maori | | | Ethnic Groups | European Maori Pacific Islander Other | 88 % 9 % 2 % 1 % | | Religions | Christian Unaffil. & Other | 81 % 19 % |"},{"h":"Cost of Living NZ","t":"New Zealand is a popular destination for international students. It has an excellent education system and internationally"},{"h":"Costs by commodities","t":"| | | | --- | --- | | A cup of coffee | $ 3.50 – 4.00 | | Hamburger | $ 3.50 – 5.00 | | Bread | $ 2.50 per loaf | | Milk | $ 2.00 per litre | | Banana | $ 2.30 per Kg | | Instant Noodles | $ 0.80 per packet | | Main meal at restaurant | $ 10.00 – 25.00 | | Takeaway pie | $ 2.50 – 3.00 | | Supermarket per week (If not living in homestay) | $ 100.00 |"},{"h":"Costs by commodities","t":"| | | | --- | --- | | Jeans | $ 20 – 200 per item | | Sport shoes | $ 50 per item | | Shirts | $ 25 + per item | | sweatshirts | $ 25 + per item | | Warm padded jackets | $ 100 + per item |"},{"h":"Costs by commodities","t":"It is generally expected that International Students allow approximately NZ$ 15,000 to NZ$ 19,000 per year available for living and accommodation costs, above the cost of your tuition."},{"h":"Costs by commodities","t":"| | | | --- | --- | | Single bus fare per trip (inner city ride) | $ 0.50 – 9.70 | | Monthly bus pass (travel within Auckland and suburbs) | $ 110.00 – 170.00 | | Sport shoes | $ 50 per item | | Health Insurance | $ 450 per year | | Cell phone charges | $ 10.00 – 20.00 | | Medical appointments | $ 20.00 – 65.00 | | Hair cut | $ 25.00 – 35.00 |"},{"h":"Costs by commodities","t":"There may be other costs that you wish to budget for, for example, vacation expenses, travelling, social activities etc."}],"words":679},{"id":"page-employment","type":"page","title":"Employment support service","route":"employment","updated":"2020-03-11","source":"/icareer/","sections":[{"h":"Who we are?","t":"Employment and Internship Services assists both Current students and graduates on a day to day basis into sustainable long term employment. We are passionate about establishing a well-respected reputation with students, trainers and with business partners."},{"h":"Our Mission","t":"Enrich, Empower and Engage. To prepare TCEG students through practical and theoretical skill development, so that they are work ready, within their chosen pathway. We endeavour to develop the right mind set and passion that empowers students to confidently engage with a career that enriches the industry."},{"h":"Our Goals","t":"- Provide the relevant tools to enable our students to enter the employment market successfully - Be inspirational and supportive in career guidance for all students. - To be an effective and proactive employment advisory advocate for both our students and industry partners. - To build significant partnerships amongst professional industry businesses that facilitates student development and infuses the sector with work ready staff"}],"words":154},{"id":"page-employment-students","type":"page","title":"For Students","route":"emp-students","updated":"2019-07-30","source":"/icareer/students-jobs/","sections":[{"h":"","t":"After completing a PBRS Diploma or National Certificate, you are ideally placed to begin to take advantage of the many hospitality opportunities and jobs in this sector."},{"h":"","t":"The knowledge that you gain from your course, including the pathway planning and career development that you are encouraged to undertake, will allow you to apply for a number of diverse roles such as; food and beverage attendant, bartender, front of house hotel worker, receptionist, café worker, barista or waiter. Subsequently you will be able to move to a more senior position."},{"h":"","t":"Due to recent changes in legislation and requirements of industry your qualification is important in obtaining even the most entry level role. Subjects such as food safety, hygiene, coffee training and Licence Controllers Qualification (LCQ) will put you ahead of the game when it comes to applying for jobs both during and after your course."},{"h":"","t":"Standards in hospitality have increased as New Zealand becomes the focus of more and more major world events, and it is increasingly evident that a PBRS qualification will help you climb the ladder faster."},{"h":"","t":"New Zealand has a diverse range of hospitality businesses – you might want to work in a hotel, night club, fine dining restaurant, café, brasserie or bistro. The standards required for each job differ, but PBRS strives to ensure that you have a full range of skills and knowledge to be a success whatever your chosen career path."},{"h":"","t":"Many of our students have gone on to become senior workers in a short space of time – many of these stories are a combination of your qualification and your own hard work. Your tutors are available to assist you with your career pathway, and PBRS operates a dedicated person who will help you gain work experience if you are finding difficulty."}],"words":298},{"id":"page-employment-employers","type":"page","title":"For Employers","route":"emp-employers","updated":"2020-07-31","source":"/icareer/icareer-employers/","sections":[{"h":"","t":"PBRS' recruitment service Employment support service a dedicated Placement Consultant who assists students and graduates in all facets of career planning. We can help you in job placements if you need employees for your business or company."},{"h":"How to become an industry partner","t":"We offer our hand in building meaningful partnerships that strengthen business operations and enhances profitability in the local industry sector. PBRS would like to reach out to forward thinking industry leaders that have vision and capacity to participate in the growth of the region. Let us speak to you directly and let us find how we can support your staffing and business networking goals this year. We will work closely with you to provide aspiring part time candidates and qualified graduates that meet the criteria of your employment needs."}],"words":132},{"id":"page-employment-contact","type":"page","title":"Contact Employment support service","route":"emp-employers","updated":"2020-07-31","source":"/icareer/contact-icareer/","sections":[{"h":"","t":"We can assist students with CV preparation and editing, interviewing techniques, identify careers prospects and choices, career counseling and permanent and part time work & Job Placement."},{"h":"","t":"We will update the employment bulletin board which put up notices for Job Vacancies – employment and other relevant information that would be of interest and useful in promoting our students welfare."},{"h":"","t":"Employment support service"},{"h":"","t":"- Experience in partnership and internship development - Business development in hospitality & hotel background"}],"words":77},{"id":"page-how-to-enrol","type":"page","title":"How to Enrol?","route":"enrolment","updated":"2024-01-16","source":"/how-to-enrol/","sections":[{"h":"Step 1– Decide what you would like to study","t":"Check course information by visiting our website [www.pbrs.ac.nz](/courses) or visiting one of our recruitment agents or calling us on 09 300 7277 for an information pack to be sent to you. Find a course that meets your career expectation and make your decision."},{"h":"Step 2 – Complete the Enrolment Form","t":"Download our [Enrolment Form](http://www.pbrs.ac.nz/wp/wp-content/uploads/2024/01/Application-Form-PBRS2024.v01.pdf) at www.pbrs.ac.nz , or fill in the form with one of our recruitment agents or fill in the form at one of our campuses."},{"h":"Step 2 – Complete the Enrolment Form","t":"Depending on the course you have chosen, you will be required to supply evidence of any previous qualifications you have gained, and evidence of your English proficiency at the appropriate level. You are also required to provide a copy of your personal ID (Passport, Birth Certificate or Driver's License etc.)"},{"h":"Step 2 – Complete the Enrolment Form","t":"Before you sign the Enrolment Form, please make sure you have read and understood our [enrolment policies](/policies), policies in our [Student Handbook](http://www.pbrs.ac.nz/wp/wp-content/uploads/2023/01/A31-PBRS-Student-Handbook-January-2023-.pdf) and [the Education (Pastoral Care of International Students) Code of Practice 2021](http://www.pbrs.ac.nz/wp/wp-content/uploads/2022/08/NZQAPastoral-Care-Code-of-PracticeEnglish.pdf)."},{"h":"Step 2 – Complete the Enrolment Form","t":"Submit your enrolment documents to PBRS directly or through your agent."},{"h":"Step 3 – Get the Offer of Placement and the Fee Schedule","t":"After receiving your enrolment document, PBRS will consult and assess your application, according to the documents and information you have provided and, if appropriate, PBRS will issue an Offer of Placement (conditional or unconditional) and a Fee Schedule. Please be aware that all international students are required to have a proper Medical and Travel insurance while they are studying in New Zealand. Therefore, an insurance fee will be included in the fee schedule."},{"h":"Step 4 – Pay your fees and get your student visa","t":"To study in New Zealand, all international students are required to have a proper visa."},{"h":"Step 4 – Pay your fees and get your student visa","t":"If you are out of New Zealand, you may lodge your Student Visa Application with our unconditional offer and other documents as required by [Immigration New Zealand (INZ)](https://www.immigration.govt.nz/new-zealand-visas). Pay your fees listed on the Fee Schedule once you receive the Approval in Principle from INZ. In some countries, you may be required to pay your fees before you lodge your Student Visa Application. Please follow INZ's requirement at all the time."},{"h":"Step 4 – Pay your fees and get your student visa","t":"If you are in New Zealand, please pay your fees before you lodge your Student Visa Application."},{"h":"Step 4 – Pay your fees and get your student visa","t":"You will find our trust account details on the Fee Schedule for your direct payment to PBRS."},{"h":"Step 4 – Pay your fees and get your student visa","t":"Upon your payment, PBRS will send you a receipt for your payment"},{"h":"Step 5 – Start your study","t":"Once you get your visa approved, you will start your study on the course start date. Congratulations!"},{"h":"Step 5 – Start your study","t":"Remember to check our website to get more information about the orientation and living in New Zealand."},{"h":"Step 5 – Start your study","t":"Download the [International Prospectus](http://www.pbrs.ac.nz/wp/wp-content/uploads/2020/01/PBRS-Prospectusweb.pdf)"}],"words":531},{"id":"page-contact","type":"page","title":"Contact Us","route":"contact","updated":"2021-05-10","source":"/about-us/contact-us/","sections":[{"h":"Auckland Campus & Head Office","t":"Tel:+64 (09) 367 1010 Fax:+64 9 367 1020"},{"h":"Auckland Campus & Head Office","t":"Email: [info@pbrs.ac.nz](mailto:info@pbrs.ac.nz)"},{"h":"Auckland Campus & Head Office","t":"Physical Address: Level 1 150 Hobson Street Auckland CBD"},{"h":"Auckland Campus & Head Office","t":"Facebook:[facebook.com/pbrsinternational](https://www.facebook.com/pbrsinternational/)"}],"words":40},{"id":"news-pbrs-presents-its-students-achievements","type":"news","title":"PBRS Presents its Students' Achievements!","route":"news-pbrs-presents-its-students-achievements","date":"2020-05-05","updated":"2020-05-05","sections":[{"h":"","t":"Dear PBRS's Friends,"},{"h":"","t":"Amidst this Global Pandemic, PBRS is reminicising its achievements over the past year and has been feeling proud of its Student Stories! PBRS would love to share this with all our Well Wishers!"},{"h":"","t":"PBRS's Recent Achievements & Events !"},{"h":"","t":"PBRS winning Regional Competition in 2019!"},{"h":"","t":"Being New Zealand reigning champions in Hospitality and Culinary awards following our wins in 2014, 2016,2017, 2018. PBRS took over the regional competition in 2019 ! Couldn't be less proud of our Student Achievements. PBRS looking forward to be reigning Champions in 2020!"},{"h":"","t":"PBRS Cultural events!"},{"h":"","t":"An eventful day which started by the traditional Diwali Diya lighting then proceeded to a Multi Cultural Walk by 5 different cultures which was then followed by different cultures performances hosted by dignitaries and media and our well wishers from the student recruitment agency."},{"h":"","t":"100 Reasons to Study at PBRS!"},{"h":"","t":"In 2019, we started spreading our success stories and achievements to all PBRS's well wishers through 100 Reasons Why to Study at PBRS! Do let us know if you haven't been receiving them, we can add you'll on the list."},{"h":"","t":"Wine & Cheese Tasting!"},{"h":"","t":"An event organised by our students as a part of their curriculum! Brilliant job done by our students as they gave everyone a New Zealand Tour on Wine & Cheese tasting!"},{"h":"","t":"For further inquiries, Jayaraj Arul Samji : 0064 9 300 PBRS [7277] Mobile: +64 021 568 200"}],"words":236},{"id":"news-1755","type":"news","title":"Auckland Regional Championships 2019","route":"news-1755","date":"2019-06-27","updated":"2019-06-27","sections":[{"h":"","t":"13 Gold 7 Silver 6 Bronze!"},{"h":"","t":"The Professional Business & Restaurant School (PBRS) which is part of Cornell Education Group participated in the Auckland Regional Hospitality Championships 2019 on 24th June. PBRS entered 26 students in 13 different categories this year with outstanding successIt is with great pride that we report our students' excellent results:"},{"h":"","t":"This gratifying result is a reflection of all the extra hours of work and passion that our Cookery and Hospitality tutors put in to ensure that our students received excellent training, that is up to date and relevant to the cookery / hospitality industry in New Zealand."},{"h":"","t":"Cookery student ZHENG Zhihua (International Diploma in Food Preparation and Cookery Supervision (Advanced)( Level 5) won Gold for Live Salmon, Live Dessert, and Bronze for Live Knife Skills. “After one month hard training, I finally got two gold and one bronze. Thanks to all chefs and Program Manager's contribution and full support from my school. This competition has been great in improving my skills and learning new and different cooking techniques. I am looking forward to getting better performance and better results at the national competition as well”."},{"h":"","t":"KHADKA,Bhushan (Hospitality Level 5)said “I couldn't have done it without My tutor Mr. Mohit, the value of training was impeccable and I want to thank Shyam and Shanti from Rohini International who inspired me to study at PBRS. I am looking forward to the National Championships to bring pride to my country, Nepal and my family. “"},{"h":"","t":"“On the day of the competition, through the ups and downs of the practising period, there was a very rewarding result for all the competitors for the regional competition which made me happy as we were all fighting to get through this together as friends and as a school” said Mi So Kim from International Diploma in Food Preparation and Cookery Supervision."},{"h":"","t":"Mr. Parks White, Principal said “It is with great pleasure that I announce the success of PBRS Cookery and Hospitality students who competed in the NZ Regional Hospitality Championships this week. I want to thank Michael Corbett, Programme Manager Cookery & Hospitality and all Hospitality and Cookery staff for the long hours and expertise and dedication in training our PBRS students to a high standard yet again!"},{"h":"","t":"“Congratulations and best wishes for the National Hospitality Championships in August!”"}],"words":387},{"id":"news-auckland-regional-championships-2018","type":"news","title":"Auckland Regional Championships 2018","route":"news-auckland-regional-championships-2018","date":"2018-07-09","updated":"2018-07-09","sections":[{"h":"","t":"12 Class Winners, 13 Golds, 23 Silvers, 5 Bronzes"},{"h":"","t":"The Cornell Education Group participated in the recent Auckland Regional Championships 2018. The Cornell Education Group entered 40 students in 13different categories this year with outstanding success."},{"h":"","t":"It is with pride that we report our students' excellent results:"},{"h":"","t":"| | | | | | | --- | --- | --- | --- | --- | | Category | Class Winner | Gold | Silver | Bronze | | Fruit Flan Static | 1 | | 1 | 3 | | Individual Cold Dessert – Static | 1 | 1 | 3 | | | Cold Entrée – Static | 1 | | 3 | 1 | | Live knife Skills | 1 | | 2 | | | Live Dessert | 1 | 2 | 1 | | | Live Pasta & Mushrooms | 1 | 2 | 3 | | | Live Salmon | 1 | 1 | 1 | | | Live Soup | 1 | 1 | 2 | | | Live Venison | 1 | 2 | 2 | | | Live Café Breakfast | 1 | 2 | | 1 | | Barista | 1 | 2 | | | | Classic Cocktail | | | 3 | | | Classic Table Setting | 1 | | 2 | 1 | | Total | 12 | 13 | 23 | 5 |"},{"h":"","t":"This outstanding result is a reflection of all the extra hours of work and passion that our tutors put in to ensure that our students received excellent training, that is up to date and relevant to the cookery / hospitality industry in New Zealand."},{"h":"","t":"Cornell cookery student, Fangwei (International Diploma in Food Preparation and Cookery Supervision (Advanced) (Level 5) won Gold for Live Salmon and was the overall class winner."},{"h":"","t":"“This competition has been great in improving my skills and learning new different cooking techniques from my tutors and this is why I believe I was successful winning a gold medal and class winner. The training has helped me develop as a chef and gain the confidence to experiment with my culinary knowledge. The training was a great challenge, and I am looking forward to getting the best result at the national salon as well” said Fangwei. Sajith Sam (International Diploma in Food Preparation and cookery supervision (advanced) (level 5) won the highest marks with silver medal and class winner in the category – Fruit Flan. “Chef Anthony D'Cunha has taken a lot of effort to mould and guide me to the peak level. I am very glad and thank him and the other tutors in Cornell who inspired me to achieve my dreams.”"},{"h":"","t":"PBRS Hospitality student Sojeong Hwang said, “I practiced lots of times and this training gave me confidence. Joining the competition was a good experience, I would like to try other challenges and I am sure I will get a good result again”"},{"h":"","t":"“Our staff and students are motivated by this result and inspired to compete in the next round of the competition.” said Cornell Education Group's Cookery and Hospitality Programme Manager Michael Corbett."},{"h":"","t":"“Bring on the National Salons! Well done to all the students and the team at Cornell and PBRS who helped the students get where they are today”"}],"words":550},{"id":"news-hospitality-championships","type":"news","title":"NZ Hospitality Championships 2017","route":"news-hospitality-championships","date":"2017-09-12","updated":"2017-09-12","sections":[{"h":"","t":"Experts confirm that PBRS is the BEST"},{"h":"","t":"It is with great pride that The Cornell Education Group accepts the award of 'New Zealand Training Establishment of the year' & Training Chef of the Year for our Professional Cookery and Hospitality schools. This is an outstanding result that has demonstrated The Cornell Education Group's professionalism and excellence in training for the cookery and hospitality industry in New Zealand."},{"h":"","t":"The NZ Chefs National Hospitality Championships 2017 event (Held from the 27th ~ 30th of July 2017 at the Logan Campbell Centre, ASB Showgrounds) was well attended by all of the leading training establishments across New Zealand who were anxiously waiting to see the outcomes of the highly coveted awards."},{"h":"","t":"The Cornell competitors excelled in their trades and brought home 45 medals along with immense pride in their skills. With 12 gold, 25 silver and 8 Bronze medals won by the Cornell students, there is an air of confidence and appreciation, for the support that the school has provided in preparing the students for the competitions. Cornell prides itself on investing in the next generation and creating opportunities for those who may not have competed in such a prestigious competition before."},{"h":"","t":"All staff members at Cornell congratulate the Tutors and competitors on a great effort and an extremely positive outcome. This result reflects the extra work that our tutors put in to ensure that our students achieve their potential and enjoy success. This result is a reflection on all the extra hours of work and passion that our Tutors have put in it to ensure that our students receive excellent training, that is up to date and relevant to the cookery and hospitality industry in New Zealand."},{"h":"","t":"Jinna Kang, who gained a Gold medal in the trainee breakfast section commented, “The training was hard work but very rewarding at the same time. Thanks to the Institute for their awesome support and believing in my talents. The school provided everything needed for success, equipment, ingredients and knowledge.”"},{"h":"","t":"The huge number of extra hours put in by the hospitality Tutors are to be commended and further demonstrates their commitment to passing on skills to up-and-coming industry staff. The management at The Cornell Education Group are heartened by the dedication shown by the training staff as this bodes well for the future of the training institute."},{"h":"","t":"Cornell cookery student, Sio Sio Wong (International Diploma in Food Preparation and Cookery Supervision (Advanced) Level 5) won the Training Chef of the Year. “This competition was very helpful and competing in three different classes really helps to improve my skills. During my training, it helped me to develop as a chef and gain the confidence to experiment with my culinary knowledge.” said Sio Sio."},{"h":"","t":"Jin You, who gained a Gold medal in the Pasta and Mushroom category, expressed her praise, “I was so amazed that I was able to perform so highly at a National Level. Our tutors are real heroes, without their guidance it would not have been possible to gain the achievement that I did. Our tutors taught me so many skills about building a classic pasta dish and inspired me to perform at the highest possible level.”"},{"h":"","t":"“This is an outstanding result that has demonstrated The Cornell Education Group's professionalism and excellence in training staff for the hospitality industry of New Zealand. This Event was attended by all of the large training establishments who were present to see the outcomes of the highly coveted awards” said Cornell Education Group's Cookery Programme Academic Leader, Michael Corbett. “Well done to all the students and the team at Cornell who helped the students to get where they are today!”"}],"words":610},{"id":"news-cornell-is-the-best","type":"news","title":"Experts confirm that CORNELL is the BEST","route":"news-cornell-is-the-best","date":"2017-06-14","updated":"2017-06-14","sections":[{"h":"","t":"Experts confirm that CORNELL is the BEST"},{"h":"","t":"4 Class Winners, 8 Golds, 20 Silvers, 7 Bronzes"},{"h":"","t":"After six (6) weeks of training the Cornell Education Group participated in the recent New Zealand Chef Regional Salon Competition. The Cornell Education Group entered 40 students in 13 different categories this year with outstanding success."},{"h":"","t":"It is with pride that we report our students' excellent results:"},{"h":"","t":"| | | | | | | --- | --- | --- | --- | --- | | Category | Class Winner | Gold | Silver | Bronze | | Fruit Flan Static | | 1 | 1 | 2 | | Individual Cold Dessert – Static | | 1 | 1 | | | Cold Entrée – Static | | 1 | 1 | 2 | | Live knife Skills | 1 | 1 | 3 | | | Live Dessert | | | 1 | 2 | | Live Pasta & Mushrooms | 1 | 1 | 1 | | | Live Salmon | | 1 | 1 | | | Live Soup | 1 | 2 | 1 | | | Live Venison | 1 | | 4 | | | Live Café Breakfast | | | | 1 | | Barista | | | 2 | | | Classic Cocktail | | | 3 | | | Classic Table Setting | | | 1 | | | Total | 4 | 8 | 20 | 7 |"},{"h":"","t":"This gratifying result is a reflection of all the extra hours of work and passion that our tutors put to ensure that our students received excellent training, that is up to date and relevant to the cookery / hospitality industry in New Zealand."},{"h":"","t":"Cornell cookery student, Jessica OH (International Diploma in Food Preparation and Cookery Supervision (Advanced) Level 5 ) won Gold for Live Knife Skills,"},{"h":"","t":"“This competition was very helpful and guided me to get a gold medal. During my training, it helped me develop as a chef and gain the confidence to experiment with my culinary knowledge. The training was a great challenge, and I am looking forward to getting the best result at the national salon as well” said Jessica"},{"h":"","t":"“Our staff and students are motivated by this result and inspired to compete in the next round of the competition. “said Cornell Education Group's Cookery Programme Academic Leader, Michael Corbett"},{"h":"","t":"“Bring on the National Salons! Well done to all the students and the team at Cornell who helped the students to get where they are today”"}],"words":423},{"id":"news-2017-graduation","type":"news","title":"2017 Graduation","route":"news-2017-graduation","date":"2017-05-15","updated":"2017-05-15","sections":[{"h":"","t":"Congratulations on your completion of the Course"},{"h":"","t":"The Cornell Education Group would like to formally recognise your achievement at our:"},{"h":"","t":"2017 Graduation Ceremony"},{"h":"","t":"Friday 19th May 2017 at 09:00 a.m."},{"h":"","t":"St Matthew in-the-City"},{"h":"","t":"(Corner of Hobson and Wellesley Streets Auckland City)"},{"h":"","t":"We invite you to attend and bring along family or friend. As there is a limit to the total number of attendees,"},{"h":"","t":"you may bring one guest plus yourself (maximum 2 in total)."},{"h":"","t":"If you would like to participate the ceremony then,"},{"h":"","t":"Please R.S.V.P to us by the 13th of April 2017 at reception or via e-mail [sue.park@cornell.ac.nz](mailto:sue.park@cornell.ac.nz)"},{"h":"","t":"Please note if we do not receive a reply by the above date, you will be UNABLE to participate in the ceremony."},{"h":"","t":"As this event is a formal occasion graduates MUST wear the specified Regalia to be part of the ceremony:"},{"h":"","t":"Diploma graduates Regalia Hire = $80.00 (Rental: $30, Bond\\: $50.00)"},{"h":"","t":"\\ The bond fee will be refunded when you return the undamaged regalia on the day"},{"h":"","t":"You must make payment at reception for your regalia before the 28th of April 2017."},{"h":"","t":"This will help greatly in our preparation for the ceremony and will allow us to send you further details of the ceremony."}],"words":203},{"id":"news-winner","type":"news","title":"Winner of the 2016","route":"news-winner","date":"2016-08-10","updated":"2016-08-10","sections":[{"h":"","t":"NZ Chefs National Salon 2016"},{"h":"","t":"Winner of the 2016 NZ Training Establishment of the Year"},{"h":"","t":"(8 Gold, 13 Silver, 12 Bronze Medals)"},{"h":"","t":"It is with great pride that The Cornell Education Group accepts the award of 'New Zealand Training Establishment of the year' for our Professional Cookery and Hospitality schools."},{"h":"","t":"This is an outstanding results that has demonstrated The Cornell Education Group's professionalism and excellence in training for the cookery / hospitality industry in New Zealand."},{"h":"","t":"This NZ Chefs National Salon 2016 event ( 28 July – 31 July 2016 at the Logan Campbell Centre, ASB Showgrounds) was dominated by all of the larger training establishments who were present to see the outcomes of the highly coveted awards."},{"h":"","t":"All the staff members at Cornell congratulates the trainers and competitors on a great effort and extremely positive outcome."},{"h":"","t":"This result reflects the extra work that our tutors put into ensuring that our students receive training that is excellent, up to date and relevant to our industry,"}],"words":165},{"id":"news-parker","type":"news","title":"Cornell students punch above their weight at the Parker fight","route":"news-parker","date":"2015-11-11","updated":"2015-11-11","sections":[{"h":"","t":"Cornell students punch above their weight at the Parker fight"},{"h":"","t":"Top fight by Joseph Parker and top support by the Cornell hospitality students at the recent boxing event held at the Trust Stadium on 15th of October."},{"h":"","t":"This was billed as one of the biggest sporting events to be held in recent years within the boxing profession. The pressure was on to make sure that those who paid top dollar to attend the heavy weight battle were well looked after and that the food and service was at the highest quality."},{"h":"","t":"The Cornell Education Group again worked in support of the Flametree Kitchen catering company to provide skilled junior staff for both the kitchen operation and the front of house customer service. Over 30 staff members were provided by iCareer, the careers support department at Cornell Institute based in Auckland CBD. The roles covered by the Cornell trainees included food preparation, plating of entrees, mains and desserts, along with beverage service for a seated audience of over 1200 people. The night proved to be a success for the organisers and service was a star performance."},{"h":"","t":"Troy Reid the General Manger of Flametree Kitchen commented on the Cornell students, “Another great event delivered – again the student team did a top job, this one was hard work, my thanks to those who worked, great to have them as part of the service team as they helped to make the night a wonderful success from our perspective.”"}],"words":245},{"id":"news-flametree","type":"news","title":"Cornell Education Group partners with Flametree Kitchen","route":"news-flametree","date":"2015-11-11","updated":"2015-11-11","sections":[{"h":"","t":"Cornell Education Group partners with Flametree Kitchen"},{"h":"","t":"Since the third quarter of 2015 The Cornell Institute has collaborated with the number one preferred catering company at Auckland University – Flametree Kitchen. The company looks after the functions and catering needs of the university faculties. This requires a variety of skilled food production and customer service staff. Recently the University has been conducting the spring graduation ceremonies and this has meant large numbers of staff on specific dates. Cornell has stepped up to provide over 20 personnel to support the Flametree operations. The student recruitment has been generated out of iCareer, the careers support department at Cornell, which is focussed on creating opportunities for the Institute's student population."},{"h":"","t":"Troy Reid, the general manager of Flametree Kitchen, along with Carlos Atkinson the executive chef, visited Cornell in October to award a prize and certificates to the outstanding student staff during this very busy period of the year. Tiffany Lai the recipient of the main prize delightfully comments “I has been a great opportunity to work for a very supportive company such as Flametree and I learnt a lot from the experienced staff during the functions”."},{"h":"","t":"We look forward to developing this job support program further with Flametree Kitchen – watch this space."}],"words":210},{"id":"news-graduation-2015","type":"news","title":"2015 Graduation","route":"news-graduation-2015","date":"2015-03-18","updated":"2015-03-18","sections":[{"h":"","t":"Congratulations on your completion of the Course"},{"h":"","t":"The Professional Bar & Restaurant School would like to formally recognise your achievement at our:"},{"h":"","t":"2015 Graduation Ceremony"},{"h":"","t":"Thursday 14 May 2015 at 09:00 a.m."},{"h":"","t":"St Matthew in-the-City"},{"h":"","t":"(Corner of Hobson and Wellesley Streets Auckland City)"},{"h":"","t":"We invite you to attend and bring along Whanau and friends. As there is a limit to the number of attendees,"},{"h":"","t":"you may bring up to 2 guests plus yourself (maximum 3 in total)."},{"h":"","t":"If you would like to participate the ceremony then,"},{"h":"","t":"Please R.S.V.P to us by 24th April 2015 at reception or via e-mail [shanelle@pbrs.ac.nz](mailto:shanelle@pbrs.ac.nz)"},{"h":"","t":"Please note if we do not receive a reply by the above date, you will be UNABLE to participate in the ceremony"},{"h":"","t":"As this event is a formal occasion graduates MUST wear the following respectively to be part of the ceremony:"},{"h":"","t":"Regalia for Diploma graduates"},{"h":"","t":"Regalia hire = $80.00 (Rental: $30, Bond\\: $50.00)"},{"h":"","t":"\\ The bond fee will be refunded when you return the regalia on the day"},{"h":"","t":"or Formal Dress for National Certificate Level 3 & 4 graduates"},{"h":"","t":"You must make payment at reception for your regalia before 17th April 2015."},{"h":"","t":"This will help greatly in our preparation for the ceremony and will allow us to send you further details of the ceremony."}],"words":214},{"id":"news-sea-food-festival","type":"news","title":"SEA FOOD FESTIVAL","route":"news-sea-food-festival","date":"2015-01-28","updated":"2015-01-28","sections":[{"h":"","t":"PBRS trainee Chefs fire-up the hot plate in support of the Auckland Seafood Festival"},{"h":"","t":"The Seafood Festival which was held over the Auckland Anniversary weekend, from the 24th – 26th of January, was a huge success drawing in over 15,000 seafood loving visitors. It lived up to its goal of providing a variety of flavoursome fresh New Zealand seafood, fun and entertainment for all the family. The Cornell Education Group, which trains chefs and hospitality staff for the growing industry, injected over fourteen of its energetic culinary volunteers to help with the logistics of feeding such a massive number of foodies."},{"h":"","t":"Cornell, through the help of iCareer, helped to staff the popular venue's seafood stalls which includes the Scampi stall with its delicious high grade product for the discerning customers. They also worked on the mussel Fritter Barge, Salmon Plank BBQ stall with its special cedar smoked technique to wow the customer's taste buds and lastly the Bluff Oyster stalls that are always a great delight each year."},{"h":"","t":"Brian Batbatan one of the trainees chefs from Cornell comments “it has been such a wonderful experience to work with the organisers on the food stall as I got to cook with great people and to taste some very special dishes”."},{"h":"","t":"This has been another great opportunity for the professional Education Provider to engage with the industry in a fun and supportive way – see you all there 2016!"},{"h":"","t":"NB : iCareer a department in Cornell helped to coordinate with the organises to source staff for the stalls – if you need hospitality staff for your business, feel free to contact us at [aaron@icareer.co.nz](mailto:aaron@icareer.co.nz)"}],"words":272},{"id":"news-get-a-westfield-voucher","type":"news","title":"Get a Westfield Voucher","route":"news-get-a-westfield-voucher","date":"2014-10-29","updated":"2014-10-29","sections":[{"h":"","t":"REFER A FRIEND PROMOTION"},{"h":"","t":"Referral means – if you refer your friends to PBRS for our upcoming Intakes in April you"},{"h":"","t":"will receive a Westfie
