ld voucher to the value of $200. Terms and Conditions apply!"},{"h":"","t":"For more information please call 300-7277 to talk a"},{"h":"","t":"PBRS staff member or email [info@pbrs.ac.nz](mailto:info@pbrs.ac.nz)"},{"h":"","t":"PBRS"},{"h":"","t":"161 Hobson street Auckland New Zealand."}],"words":57},{"id":"news-2014-nz-culinary-fare-training-excellence-award","type":"news","title":"2014 NZ Culinary Fare Training Excellence Award","route":"news-2014-nz-culinary-fare-training-excellence-award","date":"2014-09-09","updated":"2014-09-09","sections":[{"h":"","t":"The Cornell Education Group is the recipient of the prestigious “Training Excellence Award” for 2014 at the National Culinary Fare This is an outstanding result that has demonstrated The Cornell Education Group's professionalism and excellence in training staff for the hospitality industry of New Zealand. This Event was dominated by all of the larger training establishments who were present to see the outcomes of the highly coveted awards. All the staff at Cornell congratulates the trainers and competitors on a great effort and extremely positive outcome.This has been a fantastic chance to develop camaraderie and build skill strengths for future industry engagement."}],"words":102},{"id":"news-celebration-party","type":"news","title":"Celebration Party","route":"news-celebration-party","date":"2014-07-20","updated":"2014-07-20","sections":[{"h":"","t":"Culinary Fare Celebration Party"},{"h":"","t":"Friday 18 JUNE 2014 Celebration Party"}],"words":10},{"id":"news-pbrs-demonstrates-skills","type":"news","title":"PBRS Demonstrates skills","route":"news-pbrs-demonstrates-skills","date":"2014-07-16","updated":"2014-07-16","sections":[{"h":"","t":"Culinary Fare – Auckland Regionals –"},{"h":"","t":"PBRS which is part of the Cornell Group, has sent trainees to experience the challenge of the regional competitions held in central Auckland."},{"h":"","t":"The Group came away with over forty medals (Golds, Silvers and Bronze) – what a fantastic effort from the committed students!"},{"h":"","t":"The categories covered cookery, front of house – Barista, innovative cocktails, cocktails, table setting, innovative table setting."},{"h":"","t":"This showed the passion and energy that students from PBRS are known for. The tutors gave it all to prepare the students and be there on the day to support the comps…Well done PBRS team!"},{"h":"","t":"The Nationals run by the Restaurant Association of New Zealand held in August, now beckons for the TCEG Group to step-up a level and build a great platform for the student to display their talent."}],"words":137},{"id":"news-pbrs-opens-its-doors-to-the-south","type":"news","title":"PBRS opens its doors to the South","route":"news-pbrs-opens-its-doors-to-the-south","date":"2014-05-19","updated":"2014-05-19","sections":[{"h":"","t":"PANMURE CAMPUS"},{"h":"","t":"PBRS has a newly established campus located at 108 Queens Road Panmure – opened on the 19th of May 2014. This is an exciting move by the hospitality training institute to give developing culinary students in the South East of Auckland an opportunity to sharpen their skill set in a quality facility. The site offers two fully functional training kitchens that are run by professional tutors using commercial grade equipment. It also contains a computer laboratory for modern style academic learning that enhances the achievement of its trainees. The courses offered are the NZQA Level 3 and 4 Certification in Cookery along with the Professional Cookery Diploma Level 5 Diploma. Contact PBRS student support staff for more information."}],"words":120},{"id":"news-pbrs-panmure-campus-orientation","type":"news","title":"PBRS Panmure Campus Orientation","route":"news-pbrs-panmure-campus-orientation","date":"2014-05-19","updated":"2014-05-19","sections":[{"h":"","t":"PBRS Panmure Campus Orientation"},{"h":"","t":"Monday 19 May 2014 1st Orientation in Panmure campus"}],"words":13},{"id":"news-2014-graduation-ceremony","type":"news","title":"2014 Graduation Ceremony","route":"news-2014-graduation-ceremony","date":"2014-05-16","updated":"2014-05-16","sections":[{"h":"","t":"2014 Graduation Ceremony"},{"h":"","t":"Friday 16 May 2014 at 09:00 a.m. Rendezvous Hotel (Room. 2)"}],"words":14},{"id":"wp-food_beverage_service_l4","type":"page","title":"New Zealand Certificate in Food and Beverage Service (Restaurant Services) Level 4","route":"course-fb4","updated":"2024-01-16","source":"/courses/food_beverage_service_l4/","sections":[{"h":"Programme Introduction","t":"The aim of this programme is to: - To prepare graduates with advanced knowledge, skills and understanding of food and beverage service and provide competent employees who are able to work as food servers in the restaurant services secto - To provide for those individuals who are employed as food servers a qualification that will enhance their employment opportunities across a range of restaurant service establishments. - To implement established standards of professional practice for advanced food and beverage service that can provide customers with confidence in a range of restaurant service environments Content Students will study the following modules over the 18-week duration of the programme: Module 202: Safety at Work - Module 203: Food Safety - Module 204: Customer Service - Module 207: Menu Knowledge and Design - Module 208: Hot Beverage Product Knowledge - Module 209: Beverage Product Knowledge - Module 210: Food and Beverage Service - Module 211: Handling Payments Outcome On successful completion of the programme, graduates will have met all the graduate profile outcomes of the qualification. - Monitor and maintain health and safety, food safety and security practices to ensure own safety and minimise potential hazards when serving customers. - Monitor and maintain interactions between colleagues, managers and customers to provide efficient customer service. - Monitor and maintain the application of standard operating policies and procedures to work roles in a hospitality establishment. Restaurant Services strand: - Monitor and maintain food and beverage service operations. - Monitor and maintain legislative compliance requirements for a hospitality establishment."},{"h":"Start dates","t":"CAMPUS | START DATE Auckland | 30th January 2024 Auckland | 15th April 2024 Auckland | 1stJuly 2024 Auckland | 16th September 2024 Auckland | 25th November 2024"},{"h":"Enrolment Info:","t":"Duration: 20 weeks ( including 2 weeks term break ) Fees Entry requirement - Applicants must be 18 years and over, due to alcohol requirements - Recognition of prior learning (RPL) may be considered for candidates with good industry background to credit compulsory standards for entry to the programme. All RPL candidates are required to submit relevant proof of industry experience English Language Entry English Language Entry For whom English is not a first language must have an IELTS score (General or Academic) of 5.5 with no band score lower than 5, or an equivalent NZQA approved English language test."}],"words":387},{"id":"wp-beverage_cafe_bar-l3","type":"course-archive","title":"Certificate in Food and Beverage_Café and Bar Services-Level 3","route":"courses","updated":"2024-01-16","source":"/courses/beverage_cafe_bar-l3/","sections":[{"h":"Programme Introduction","t":"The aim of this programme is to: - Establish standards of professional practice for basic service that can provide customers with confidence in cafe and bar environments. - Provide competent employees for the food and beverage sector who are able to prepare and serve food beverages in a café or bar environment. - Provide graduates with the skills and knowledge (including literacy and numeracy) to confidently work in an entry level position in a café or bar environment. Content and Subjects Covered: - Identifying and preventing hazard - Food Safety - Host Responsibility - Hospitality Security practices - Deal with problems in hospitality establishment - Communication with customers, colleagues and managers - Cash Handling - Customer Services - Professional behavior - Preparing and serving hot and cold beverages - Basic café food preparation and service - Health and Safety - Understanding and using espresso equipment - Prepare and serve alcoholic beverages"},{"h":"Start dates","t":"CAMPUS | START DATE Auckland | 30th January 2024 Auckland | 15th April 2024 Auckland | 1st July 2024 Auckland | 16th September 2024 Auckland | 25th November 2024"},{"h":"Enrolment Info:","t":"Duration: 20 weeks ( including 2 weeks term break ) Fees Entry requirement - Applicants must be 18 years and over, due to alcohol regulations - Recognition of prior learning (RPL) may be considered for candidates with good industry background to credit compulsory standards for entry to the programme. - All RPL candidates are required to submit relevant proof of industry experience English Language Entry For whom English is not a first language must have an IELTS score (General or Academic) of 5.0 with no band score lower than 5, or an equivalent NZQA approved English language test."}],"words":284},{"id":"wp-staff","type":"page","title":"Our Staff","route":"about","updated":"2020-07-30","source":"/about-us/staff/","sections":[{"h":"PBRS Marketing Team","t":"China David Xu DDI: +64 9 915 3506 david@pbrs .ac.nz"},{"h":"China","t":"David Xu DDI: +64 9 915 3506 david@pbrs .ac.nz India Jayaraj ARUL SAMJI DDI: +64-9-915-3503 jayaraj@pbrs.ac.nz"},{"h":"India","t":"Jayaraj ARUL SAMJI DDI: +64-9-915-3503 jayaraj@pbrs.ac.nz Korea / Southeast Asia / Latin America Regina Lee DDI: +64-9-367-3504 regina@pbrs.ac.nz"},{"h":"Korea / Southeast Asia / Latin America","t":"Regina Lee DDI: +64-9-367-3504 regina@pbrs.ac.nz"},{"h":"Principal","t":"Parks White Email: parks.white@pbrs.ac.nz"},{"h":"General Manager, Operations","t":"Jun Kim Email: jun.kim@pbrs.ac.nz"},{"h":"Administration Manager","t":"Kathy Ku Email: kathy.ku@pbrs.ac.nz"},{"h":"Cookery Department Programme Manager","t":"Michael Corbett Email: michael.corbett@pbrs.ac.nz"},{"h":"Hospitality Department Programme Manager","t":"Michael Corbett Email: michael.corbett@pbrs.ac.nz"}],"words":95},{"id":"wp-_fee","type":"page","title":"List of fee","route":"calculator","updated":"2019-08-15","source":"/_fee/","sections":[{"h":"Course Fee (Cornell, PBRS, WELS)","t":"(All fees are quoted in NZ$ and include GST) Enrolment fee | $500 | Airport Pickup fee | $100 Homestay placement fee | $240 | Homestay fee (under 18) Homestay fee (over 18) | $300/wk $280/wk"},{"h":"Course Information","t":"Courses | Course Length | Tuition Fee | Material and Resource Fee Cookery | New Zealand Certificate in Cookery Level 4 | 1 year | $19,500 | $2,000 International Diploma in Food Preparation and Cookery Supervision (Advanced) (Level 5) | 2 years | Year 1 $19,500 Year 2 $12,000 | Year 1 $2,000 Year 2 $1,500 Business | Cornell Diploma in Business Studies (Level 7) | 1 year | $16,000 | $1,200 Health Care | Diploma in Health (Advanced) (Applied Management) (Level 7) | 1 year | $16,000 | $1,500 Computing | New Zealand Diploma in Information Technology (Technical Support and Administration) (Level 5) | 1 year | $16,000 | $1,200 Diploma in Information Technology (Networking Technology Management) (Level 7) | 1 year | $16,000 | $1,200 Diploma in Software Development (Level 7) | 1 year | $16,000 | $1,200 English (WELS) | English for Beginner/Elementary | 4-24 weeks | $370 pw (Full Time) | $100 * English for Pre-Intermediate/Intermediate(Level 2) | 4-24 weeks | $370 pw (Full Time) | $100 * English for Upper Intermediate/Advanced (Level 4) | 4-24 weeks | $370 pw (Full Time) | $100 * English for IELTS (Level 3) | 4-24 weeks | $370 pw (Full Time) | $100 * Hospitality (PBRS) | New Zealand Diploma in Hospitality Management (Level 5) | 1 year | $16,000 | $1,500 New Zealand Diploma in Hospitality Management (Level 5) Diploma in Hotel Management (Level 6) | 1 year | $14,000 | $1,500 ** Note:  | $175 | 10 months | $387 5 months | $208 | 11 months | $421 6 months | $242 | 12 months | $454 Note: Fees is subject to change from time to time according to the insurance company's policyThe premiums set out in this table do not include any applicable age surcharges or cover for any pre-existing conditions or specified items. Premiums are accurate as at 1 May 2018 but subject to change without notice."}],"words":682},{"id":"wp-facilities-2","type":"page","title":"School Facilities","route":"facilities","updated":"2017-03-08","source":"/facilities-2/","sections":[{"h":"School Facilities","t":"| Classrooms All our classrooms are equipped computer systems and multimedia projectors for effective teaching tools."},{"h":"Classrooms","t":"All our classrooms are equipped computer systems and multimedia projectors for effective teaching tools. | Computer Laboratories There are 5 computer laboratories for use at PBRS, equipped with the latest computers for an efficient learning experience in a modern teaching environment. We provide internet access, e-mail access, and printing services for our students."},{"h":"Computer Laboratories","t":"There are 5 computer laboratories for use at PBRS, equipped with the latest computers for an efficient learning experience in a modern teaching environment. We provide internet access, e-mail access, and printing services for our students. | Kitchen Our kitchens are fully equipped with state-of-the-art appliances which provide the opportunity to acquire practical expertise in a realistic working environment for our cookery students."},{"h":"Kitchen","t":"Our kitchens are fully equipped with state-of-the-art appliances which provide the opportunity to acquire practical expertise in a realistic working environment for our cookery students. | Training Restaurant The training restaurant serves as the laboratory for our hospitality students which exposes them to real situations in a restaurant setting."},{"h":"Training Restaurant","t":"The training restaurant serves as the laboratory for our hospitality students which exposes them to real situations in a restaurant setting. | Cafeteria & Student Lounge A cafeteria and student lounge are available for our students' use for their class breaks, where they can meet up and get acquainted with students from other programs."},{"h":"Cafeteria & Student Lounge","t":"A cafeteria and student lounge are available for our students' use for their class breaks, where they can meet up and get acquainted with students from other programs. | Library The library is equipped with the latest edition of textbooks, journals and reference materials, which can be used by the students for their academic learning and assignments"},{"h":"Library","t":"The library is equipped with the latest edition of textbooks, journals and reference materials, which can be used by the students for their academic learning and assignments"}],"words":332},{"id":"wp-newzealand","type":"page","title":"About New Zealand","route":"newzealand","updated":"2017-03-08","source":"/newzealand/","sections":[{"h":"New Zealand Information","t":"Auckland is also known as one the top five cities worldwide for quality of living, according to (Mercer's 2008 Quality of Living survey) and it is considered much cheaper than many other countries like Sydney or London."},{"h":"General Profile(New Zealand)","t":"Area | 103,736 sq mi = 269,000 sq km Population Feb 2014 | 4,509,700 Capital City | Wellington"},{"h":"Climate","t":"Our coldest month is July, and our warmest is in January; our seasons opposite to those in the Northern Hemisphere. Average temperatures are around 15C (60F) in the upper North Island, and around 10C (50F) near the bottom of the South Island. The climate is fairly mild, without the extremes experienced in many other countries. In fact, New Zealand doesn't tend to have temperatures over 35C (100F) or under -10C (14F). It tends to snow only in the mountains in the North Island, and mainly in the Southern Alps in the South Island, although it has been known to snow on some of the cities on the East Coast of the South Island from time to time."},{"h":"Currency","t":"Decimal system based on New Zealand dollar, with cent denominations. Coins | 10 cent | 20 cent | 50 cent | 1 dollar | 2 dollar Notes | 5 dollar | 10 dollar | 20 dollar | 50 dollar | 100 dollar"},{"h":"Travel Details","t":"Visa: Not required of US citizens in possession of a return or onward ticket staying up to 90 days. Passports must be valid 3 months beyond date of departure Health: Must provide the Health Medical Certificate required by the NZ Immigration."},{"h":"Cultural","t":"Languages | English & Maori | Ethnic Groups | European Maori Pacific Islander Other | 88 % 9 % 2 % 1 % Religions | Christian Unaffil. & Other | 81 % 19 %"},{"h":"Cost of Living NZ","t":"New Zealand is a popular destination for international students. It has an excellent education system and internationally"},{"h":"Costs by commodities","t":"A cup of coffee | $ 3.50 – 4.00 Hamburger | $ 3.50 – 5.00 Bread | $ 2.50 per loaf Milk | $ 2.00 per litre Banana | $ 2.30 per Kg Instant Noodles | $ 0.80 per packet Main meal at restaurant | $ 10.00 – 25.00 Takeaway pie | $ 2.50 – 3.00 Supermarket per week (If not living in homestay) | $ 100.00 Jeans | $ 20 – 200 per item Sport shoes | $ 50 per item Shirts | $ 25 + per item sweatshirts | $ 25 + per item Warm padded jackets | $ 100 + per item It is generally expected that International Students allow approximately NZ$ 15,000 to NZ$ 19,000 per year available for living and accommodation costs, above the cost of your tuition. Single bus fare per trip (inner city ride) | $ 0.50 – 9.70 Monthly bus pass (travel within Auckland and suburbs) | $ 110.00 – 170.00 Sport shoes | $ 50 per item Health Insurance | $ 450 per year Cell phone charges | $ 10.00 – 20.00 Medical appointments | $ 20.00 – 65.00 Hair cut | $ 25.00 – 35.00 There may be other costs that you wish to budget for, for example, vacation expenses, travelling, social activities etc."}],"words":538},{"id":"wp-facilities","type":"page","title":"Facilities","route":"facilities","updated":"2017-02-17","source":"/facilities/","sections":[{"h":"","t":"Code of Practice www.nzqa.govt.nz PBRS has agreed to observe and be bound by the Code of Practice for the Pastoral Care of International Students administrated by the New Zealand Qualifications Authority(NZQA). Copies of the Code are available on request from this institution or from the NZQA. Immigration www.immigration.govt.nz Full details of visa and permit requirements, advice on rights to employment in New Zealand while studying, and reporting requirements are available through the New Zealand Immigration Service, and can be viewed on their website. Eligibility for Health Services Most international students are not entitled to publicly funded health services while in New Zealand. If you receive medical treatment during your visit, you may be liable for the full costs of that treatment. Full details on entitlements to publicly-funded health services are available through the Ministry of Health, and can be viewed on their website. Accident Insurance www.acc.co.nz The Accident Compensation Corporation provides accident insurance for all New Zealand citizens, residents and temporary visitors to New Zealand, but you may still be liable for all other medical and related costs. Further information can be viewed on the ACC website. FEE PROTECTION Student's fees(except for short courses) will be deposited in the government owned public trust account administered by NZ Public Trust. The fees will be released on a pro rate basis from this trust account in accordance with an agreed monthly schedule based on tuition delivered and until the completion of the programme. ACCOMMODATION Homestay fees The cost starts from NZ$ 250 per week and usually include breakfast and dinner and lunch on the weekends. Homestay students live with a host family in a suburb area with their own room where they are treated as part of the family. The host family will provide the student with a safe and friendly environment. The cost of living will vary depending on where you plan to live-inner city or surrounding suburbs. Airport Pickup Service PBRS arranges airport pick-up for new students for a fee charge($100).Students will be greeted by PBRS staff members, and will take them to their home-stay family and help them get settled. Flatting If you are not staying at homestay and intend to go FLATTING/PRIVATE RENTING, a budget is needed expenses such as: - Bonds/deposits/placement fees – required when living in a hall of residence or going flatting. They are typically charged at around 2-4 weeks rent. Budget for these. - Gas - Power - Phone connection and monthly phone charges ( spark.co.nz ) - Internet charges In a central location for a one-bedroom apartment expect to pay around $300 per week, or for a room in a flat about $ 140-150 per week. There is also a bond (2 weeks rent in advance), often an Agent's fee (1 week's rent) and you will normally be asked to pay 2 weeks rent in advance. On top of this you will need to pay power/gas/phone bills, and be in charge of your own cooking, prepare your own meals, doing your own laundry and the rental agreement (Flat Bond). Bonds & bills Bonds are initial payments required for security by companies or landlords offering their services or premises. Bonds are refundable if accounts are paid in full and premises (flats) are well-maintained Landlords can request a sum for a bond equivalent to one to four weeks' rent – often one or two weeks can be negotiated and a credit reference from previous supplier. For power: Required a $225.00 bond, a guarantor, or a credit reference from previous supplier. For gas: a $100 bond, a guarantor or a good credit rating from a previous energy provider: Terms and Conditions for our Students For International Students, the homestay placement fee ($250), Enrolment fee ($220) and Guardianship placement ($200) will not be refunded under any circumstances where as the homestay accommodation and airport pick up can be refunded under certain cases as described below. Accommodation Refund Policy: If a student wishes to withdraw from homestay arranged by the Institute, they must provide at least 2 weeks' notice in advance (either before they arrive in New Zealand, of before the date on which they wish to leave the homestay accommodation). Failure to provide this notice will result in 2 weeks accommodation fees being forfeited. If a student has paid for the airport pickup fee, and provides a notice of cancellation at least 1 week before their arrival date, the fee will be refunded in full. In all other cases, the entire fee will be held. Accommodation: PBRS arranges homestay through its recognized homestay agents but be provided a minimum of 4 weeks notice. For students between the ages of 14 and 17, it is a requirement of the Code of Practice (and thus a condition of enrolment) that the student stays in suitable accommodation such as: - Homestay - Designated caregiver - Parents Online Visa Application PBRS can provide visa application guidance upon request and process your Student Visa and Job Search Permit/Visa (Work Permit/Visa) at the campus. The student visa approval process may take from 2 to 10 weeks, depending on where you are applying for the visa. The process for getting a student visa is available through the New Zealand Immigration Service and can be viewed on the NZIS website at www.immigration.govt.nz In addition, PBRS's authorized recruitment agents can, on behalf of their student clients, gather all the required visa information and apply for their student visas. Medical and Travel Insurance All international students in New Zealand are required to have comprehensive medical and travel insurance. Most international students are not entitled to publicly funded health services while in New Zealand. If you receive medical treatment during your visit, you will be liable for the full costs of that treatment. We therefore strongly recommend that you have insurance that will cover the cost of medical treatment in New Zealand for the duration of your stay. We also strongly recommend that you obtain insurance to cover your travel to and from New Zealand. PBRS offers a comprehensive insurance policy through Inter Global Insurance, which is automatically included in your fees schedule unless you provide us with details of an alternative policy."}],"words":1025},{"id":"wp-student-services","type":"page","title":"Student Services","route":"services","updated":"2022-04-08","source":"/student-services/","sections":[{"h":"Student Services","t":"There are various means by which students can seek support and guidance at PBRS. These include Academic Guidance, Pastoral Care, Learning Support, Careers Advice and help in securing study-related jobs through."},{"h":"Academic Guidance","t":"Students are welcome to consult their lecturers in the first instance if they wish to receive guidance in regard to the program that they are studying."},{"h":"Pastoral Care","t":"there are two separate avenues to gain this support. PBRS has a dedicated Pastoral Care Team offering front line personal support for students. Students from other language groups can gain frontline support from one of our Marketing Services team members in their own language. In cases where it is established that more professional services are required, the Pastoral Care Team will refer the student to specialist support services."},{"h":"Covid-19: Mental health and wellbeing resources","t":"The stress and uncertainty of Covid-19 restrictions can impact on students' mental health. The Ministry of Health has provided a list of resources, including some specifically aimed at young people. See Covid-19: Mental health and wellbeing resources"},{"h":"If you need help in a mental health crisis you should call:","t":"- Auckland DHB – Mental Health Community Acute Service (CAS): 0800 800 717 - In an emergency, you should call 111"},{"h":"After-hours support","t":"For support outside regular hours you can call: - Lifeline 0800 543 354 - Youthline 0800 376633 or Free TXT 234 - Outline (Rainbow Support) 0800 688 5463"},{"h":"Learning Support","t":"Where it is established that students need additional support they will have access to a Learning Support Lecturer or to our English Language School."},{"h":"Accommodation","t":"PBRS provides accommodation arrangements for international students on request but we must have a minimum of 4 weeks' notice. The minimum period of homestay is 4 weeks. A homestay placement fee ($240, non-refundable) will apply for this service. The homestay fees are (around $280/wk for over 18 students and $300/wk for under18 students). Airport pick up is available on request, and $100 will be charged for each pickup. All homestay families in PBRS homestay program are carefully selected. Students staying in a homestay are required to exhibit appropriate behaviour. For under 18 students, we will monitor the satisfaction of the Homestay placement regularly. Please check with your Pastoral Care Team for details. For international students aged over 18 who want to find your own accommodation, you may find general information on renting at https://www.tenancy.govt.nz , or find information on quality standards for renting at: http://www.mbie.govt.nz/info-services/housing-property/tenancy/residential-tenancies-regulations-for-insulation-and-smoke-alarms . You are also welcome to talk with our Pastoral Care Team and seek more advice."},{"h":"Your rights as a tenant","t":"When you rent a property as a tenant or join a shared house as a flatmate, you will have a number of rights and responsibilities. Please visit www.tenancy.govt.nz website for more information Renting a property, being a tenant or flatmate, and resolving disputes"},{"h":"Careers Advice","t":"Students can consult either the lecturers in the field that they are most interested in, or in some cases, PBRS E mployment S upport staff may also be able to help. You may check here for more information about E mployment S upport ."},{"h":"Computer Access:","t":"Access to computers at PBRS is offered between 9:00 am – 5:00 pm. Printing facilities are available. Wifi access is available in all campuses as well."},{"h":"Library access","t":"PBRS has a student library on site at level 2, 150 Hobson St. The library holds non-prescribed textbooks, other relevant readings, trade and professional magazines and some software. There are other significant libraries within easy walking distance of the PBRS facilities in Auckland. These are to be found at the University of Auckland and AUT. They have very significant holdings in all fields – PBRS students may use but not borrow from these libraries."}],"words":623},{"id":"wp-policy","type":"page","title":"Enrolment Policies","route":"policies","updated":"2022-08-26","source":"/policy/","sections":[{"h":"Immigration","t":"All international students must hold an appropriate visa or permit for their entire study period. Full details of immigration requirements, advice on rights to employment in New Zealand while studying, and reporting requirements are available from Immigration New Zealand, and can be viewed on their website at www.immigration.govt.nz"},{"h":"Eligibility for Health Services","t":"Most international students are not entitled to publicly funded health services while in New Zealand. If you receive medical treatment during your visit, you may be liable for the full costs of that treatment. Full details on entitlements to publicly funded health services are available through the Ministry of Health, and can be viewed on their website at www.moh.govt.nz. All international students are required to declare any medical or learning needs before enrolment. Please note that international students are not eligible for special needs funding. If you need to take any medicine long term, please check if the medicine is available in New Zealand. If it is not, you may need to talk with your doctor and find another solution for your needs."},{"h":"Accident Insurance","t":"The New Zealand Accident Compensation Corporation (ACC) provides accident insurance for all New Zealand citizens, residents, and temporary visitors to New Zealand, but you may still be liable for all other medical and related costs. Further information can be viewed on the ACC website at www.acc.co.nz"},{"h":"Medical and Travel Insurance","t":"While an international student enrolled with PBRS for educational instruction of 2 weeks' duration or longer, the student must have appropriate insurance to cover— (a) the student's travel— (i) to and from New Zealand; and (ii) within New Zealand; and (iii) if the travel is part of the course, outside New Zealand; and (b) medical care in New Zealand, including diagnosis, prescription, surgery, and hospitalisation; and (c) repatriation or expatriation of the student as a result of serious illness or injury, including cover of travel costs incurred by family members assisting repatriation or expatriation; and (d) death of the student, including cover of— (i) travel costs of family members to and from New Zealand; and (ii) costs of repatriation or expatriation of the body; and (iii) funeral expenses. PBRS provides medical and travel insurance through a New Zealand insurance company. PBRS has assessed the policies provided by the insurance company. Insurance is compulsory for all international students studying at PBRS and will automatically be charged for unless an alternative insurance compliant with the Code of Practice has already been arranged. Please make sure you have declared all of your medical needs prior to your enrolment. Please be aware that insurance arranged by PBRS will not cover your previous health issues. With prior notification and forewarning, failing to present the up-to-date and effective insurance policy as an international student or failing to present it before the required date will be seen as deliberate violation of PBRS's rules and regulations. PBRS will exercise its right to suspend or terminate the student's study and report the case to all relevant departments (e.g. Immigration New Zealand). In this case, the individual student will be fully responsible for any consequences arise."},{"h":"Fees","t":"The Student fee payment schedule will be issued upon the receipt of an application form and all supporting documents. Fees are due for payment, before the start of your program of study. Once tuition has commenced, tuition fees will remain the same irrespective of changes to immigration status, for instance obtaining Permanent Residency, and any other changes. Prior to commencement, tuition fees are subject to change without notice. Where a student still owes money to PBRS for any outstanding items, the final qualification certificate(s) will not be issued until all accounts have been paid. Apart from fees that the student paid prior to commencement, students may need to pay for any failed courses or administrative fees. Please see our Student Handbook for details."},{"h":"Fee Protection","t":"The New Zealand Government requires that all Private Training Establishments (PTE) registered with NZQA protect student fees paid to them in advance. At PBRS, all students' fees will be deposited in the government owned public trust account administered by NZ Public Trust. The fees will be released on a pro rata basis from this trust account in accordance with an agreed monthly schedule based on tuition delivered and until the completion of the program."},{"h":"Withdrawal and Refund Policy","t":"Length of the Course/Programme | Withdrawal period | Proportion of refund 1-34 days | Before the course starts and within the first two working days of the course starts | 50% of total fees paid After two working days | No refund 35 days – 3 months | Before the course starts and within the first five working days of the course starts | 75% of total fees paid After five working days of the course starts | No refund More than 3 months | Before and/or within the first ten working days of the course starts | Full refund of all fees paid, Less 25% of total tuition and enrolment fees After ten working days of the course starts | No refund Please note: - The first day of your programme is recorded on the student's “Offer of Place” letter. - Student visa not granted before and/or within the first 10 working days of the course commencement – The student must provide an official letter from INZ confirming the visa decline: The student will receive a full refund of all fees paid less a deduction of 10% up to a maximum of $500 - Student visa not granted after the first 10 working days of the course commencement – The student must provide an official letter from INZ confirming the visa decline: The student will receive a refund of the balance of unconsumed tuition fees paid - Student visa extension not granted – The student must provide an official letter from INZ confirming the extension decline: The student will receive a refund of the balance of unconsumed tuition fees paid - If PBRS decides, for any reason, to discontinue a programme of study (including if PBRS ceases to be a signatory of the Code or a registered provider), all fees paid for services not delivered or the unused portion of fees will be refunded or transferred to another institute as agreed with the student. Other than the student being entitled to such refund, it will have no other further claim against PBRS. - No refund is available if a student is withdrawn from study by PBRS for disciplinary reasons including: inappropriate behaviour, poor attendance or inadequate academic progress, transfer to another school after the refund period. - No refund is available if a student's enrolment is cancelled because the enrolment application is found to be inaccurate in any way. - No refund is available if a student has their visa/permit to study at PBRS cancelled. - If a student wishes to withdraw from a homestay arranged by PBRS, they must provide at least two (2) weeks' notice in advance either before they arrive in New Zealand or before the date on which they wish to leave the homestay accommodation. Failure to provide this notice will result in 2 weeks accommodation fees being forfeited. The homestay placement fee is not refunded under any circumstances. - If a student wishes to cancel a booked airport pick up, they must provide at least one (1) week's notice before the arrival date and a full refund of the airport pick up fee will be made. Otherwise, the entire fee will be retained. - Full refund of an insurance fee paid through PBRS will be made if the student requests withdrawal before the course starts or within one week of the course starts. No refund of an insurance fee will be given after one week of the programme start date. - In a case where a student has asked PBRS to buy insurance earlier than within one (1) week of when the course starts, the student is required to inform PBRS in advance, so that the student insurance can be arranged earlier. In this case, no refund of insurance fee will be given after two weeks of when the insurance is bought. - Living costs paid to PBRS will be fully refunded on the student's request - Late requests: In exceptional circumstances, late notices of withdrawal and requests for refund may be submitted, and these will be considered on a case-by-case basis. Possible reasons for such requests include: Serious illness or disability of the student Death of a student or close family member (parent, sibling, spouse or child) Political, civil or natural event that prevents arrival of the student - Serious illness or disability of the student - Death of a student or close family member (parent, sibling, spouse or child) - Political, civil or natural event that prevents arrival of the student Full documentation must be supplied to support each application. Where a late request is approved, the amount to be refunded may be reduced at the Institute's sole discretion. In particular, deductions may be made to take account of items such as fees for services provided prior to withdrawal, and any payments to agents in relation to the student's enrolment. Refund of other fees will be made in accordance with the relevant policies."},{"h":"Withdrawal and Refund Process","t":"- Any applications for withdrawal must be made in writing on the appropriate withdrawal form, and must state reasons in full. Written confirmation from the payee student's parents or legal guardian is required, if the student is under 18. - All applications for a refund will be reviewed and decided upon by the PBRS Executive Management Team in accordance with the Withdrawal and Refund Policy - Notification as to the decision in relation to the refund application will be supplied to the student within ten working days of receipt of the application. - A refund will be made within five (5) working days of the day on which a decision to refund is made. Payment will be made to the student's account or a third party account agreed by the student. Where a student is under 18 years of age, the parent(s) or the legal guardian will need to give his/her signed approval and a clear indication of the account into which the refund will be made. - All fees are received and refunded in NZ dollars. PBRS is not responsible for any currency fluctuations between enrolment and payment of refund, and is not responsible for any bank charges incurred through the deposit of funds into your nominated account. - PBRS will notify Immigration New Zealand (INZ) of your withdrawal within one (1) week. This may affect the student's visa status."},{"h":"Attendance","t":"Students studying at PBRS are required to maintain excellent attendance throughout the programme. Any student who fails to meet this attendance requirement may be subject to expulsion from the programme and PBRS will notify Immigration New Zealand. At PBRS, you are expected to attend class for 20 hours per week. Classes will be arranged during the week. Class Time each day may be different. A detailed timetable will be given to you on the orientation day for the first term and will be given about 1 week before term starts for the rest. It is important to think about your class time before you take any job."},{"h":"Recognition of Prior Learning (RPL) and Cross Credit (CC)","t":"Where a student believes he/she may be eligible for this, contact needs to be made with the school for the forms to apply for this recognition. An additional processing fee of $500 will be required. This process must be completed before the Offer of Placement Letter is issued. No RPL/CC will be considered after the student has started his/her course."},{"h":"Notification","t":"In signing this enrolment form you undertake to comply with the regulation to notify PBRS of your current contact details in New Zealand and in your home country, accommodation type, residential address and immigration status at all times, and you accept that failure to do so may result in your enrolment with PBRS being terminated."},{"h":"Orientation","t":"Before your course starts, there will be a class orientation that will include: - Warm welcome from all staff and students - An introduction to your fellow students, members of management, lecturers and all other staff - An introduction to your chosen program, facilities and the requirements for training - An explanation of the rules, regulations (including the Education (Pastoral Care of Tertiary and International Learner) Code of Practice 2021 and the Health & Safety requirements etc. You will have the opportunity to sign the learning contract to demonstrate your agreement to abide by these. A Student Handbook will be provided on the day. - A copy of your passport & student visa and a copy of your medical & travel insurance certificate are required to be provided to the school. Make sure to check our Facebook page ( www.facebook.com/pbrsinternational ) for announcements, and these schedules are subject to change."},{"h":"Accommodation","t":"As per the requirement of the Education (Pastoral Care of Tertiary and International Learner) Code of Practice 2021, for international students aged under 18, they must live with their parents, designated caregiver or PBRS arranged homestay. Please discuss with our Marketing Managers about your accommodation arrangement if you are under 18. You and your parents may be required to fill in some forms regarding this. PBRS also provides accommodation arrangements for international students aged over 18 on request but we must have a minimum of 4 weeks' notice. The minimum period of homestay is 4 weeks. Fees will apply. Please check with us for details. For international students aged over 18 who want to find your own accommodation, you may find general information on renting at https://www.tenancy.govt.nz , or find information on quality standards for renting at: http://www.mbie.govt.nz/info-services/housing-property/tenancy/residential-tenancies-regulations-for-insulation-and-smoke-alarms . You are also welcome to talk with our Pastoral Care Team and seek more advice."},{"h":"Circumstances in which PBRS may Terminate Enrolment","t":"- If a student is expelled according to the Disciplinary Process. Including situations as continued and/or unexplained absenteeism, inadequate progress, any breach of disciplinary regulations etc. - If a student is found having provided false or misleading information - If the Academy is unable to guarantee accommodation due to the student's behaviour (under 18 students) - If a student has criminal behaviour inside or outside the Academy's premises - If a student can not attend school to make up the missed programme time and needs to re-enrol if they wish to complete the programme for reasons such as illness or family obligations. All decisions to terminate enrolment will be based on evidence, and the normal appeal procedure applies. If your enrolment is terminated: - No refund will be given - Immigration New Zealand and parents (if you are under 18) of yours will be notified about your problem and status."}],"words":2470},{"id":"wp-new-zealand-certificate-in-cookery-level-5","type":"page","title":"International Diploma in Food Preparation and Cookery Supervision – (Advanced) Level 5","route":"course-c5","updated":"2024-01-16","source":"/courses/new-zealand-certificate-in-cookery-level-5/","sections":[{"h":"Programme Introduction","t":"The purpose of this qualification is: - To provide the hospitality sector with competent employees who are able to work as chefs in intermediate positions producing complex dishes in a commercial kitchen. - To provide individuals who are employed or will be employed as chefs in intermediate positions a qualification that will enhance their employment opportunities in a commercial kitchen across the hospitality sector. - To implement established standards of professional practice for complex cookery that can provide customers with confidence in a range of hospitality environments."},{"h":"Course Highlights","t":"- Supervise staff training - Food safety supervision for catering - Resource management in food preparation - Menu planning and costing - Global influences of eating & drinking - Supervise food production - Realistic work experience - Advanced food & beverage event - Advance applied food project"},{"h":"Course Structure","t":"- Module 1: PC 501 International cuisine studies - Module 2: PC 502 Advanced cold larder food production - Module 3: PC 503 Advanced hot kitchen food production - Module 4: PC 504 Kitchen operations - Module 5: PC 505 Advanced menu planning and restaurant service - Module 6: PC 506 Applied food service & event catering - Module 7: PC 507 Realistic work experience - Module 8: PC 508 Advanced applied food project"},{"h":"Start dates","t":"CAMPUS | START DATE Auckland | 30th January 2024 Auckland | 15th April 2024 Auckland | 1st July 2024 Auckland | 18th September 2024 Auckland | 25th November 2024"},{"h":"Enrolment Info:","t":"Duration: 2 years Fee: -Year 1 Tuition fee : $19,500 -Year 1 Material and Resource fee : $2,000 -Year 2 Tuition fee : $12,000 -Year 2 Material and Resource fee: $1,500 Material and Resource fee include: - Access to all school facilities and equipment during school hours or by arrangement with the tutor in charge after class hours - Processing, recording and reporting of assessment results and personal data - Training ingredients used in the practical classes - Course work books and text books (If it is applicable) - Uniform - Student ID card - Field trips (If it is applicable) Entry requirement: - Applicants must be 17 years of age or older - Recognition of Prior Learning (RPL) may be considered for candidates with good industry back ground. All RPL candidates are required to provide relevant proof of industry experience - For whom English is not a first language must have an IELTS score (Academic) of 5.5 with no band score lower than 5, or an equivalent NZQA approved English language test."},{"h":"Graduate profile","t":"On successful completion of this programme and having achieved all the graduate profile outcomes, graduates will be able to: - Monitor and maintain health and safety, food safety and security practices to ensure own safety and minimize potential hazards for customers. - Monitor and maintain effective communicate and interactions colleagues, other staff, managers and customers in a hospitality service environment. - Monitor and maintain the application of standard operating policies and procedures to work roles in a commercial kitchen. - Apply cookery skills to prepare, cook and present a range of cold larder dishes utilising complex preparation and presentation techniques. - Apply cookery skills to prepare, cook and present a range of hot kitchen dishes utilising complex preparation and presentation techniques. - Apply cookery skills to prepare, cook and present a range of patisserie and desserts utilising complex preparation and presentation techniques."}],"words":564},{"id":"wp-cookery-level4","type":"page","title":"New Zealand Certificate in Cookery Level 4","route":"course-c4","updated":"2024-01-16","source":"/courses/cookery-level4/","sections":[{"h":"Programme Introduction","t":"The purpose of this qualification is: - To provide the hospitality sector with competent employees who are able to work as chefs in intermediate positions producing complex dishes in a commercial kitchen. - To provide individuals who are employed or will be employed as chefs in intermediate positions a qualification that will enhance their employment opportunities in a commercial kitchen across the hospitality sector. - To implement established standards of professional practice for complex cookery that can provide customers with confidence in a range of hospitality environments."},{"h":"Course Highlights","t":"The New Zealand Certificate in Cookery (Level 4) is a 36-week, 120 credit programme which will be delivered over four 9-week terms with a two-week break between terms. The programme provides fundamental knowledge and skills in cookery as well as to develop practical skills and applied knowledge in specific areas such as: - health and safety in the workplace - food safety and security practices - application of standard operating policies and procedures - healthy eating, foods and special diets - internal and external customer interactions and communications - costing and menu planning - applied methods of cookery – preparing, cooking and finishing a wide range of complex dishes. In addition, students will also gain 'realistic work experience' in preparing, cooling and presenting a range of dishes in modern, fully equipped commercial kitchens."},{"h":"Course Structure","t":"Module 1: PC401 Introduction to Cookery This module covers health and safety and food safety, an introduction to kitchen procedures with a focus on knife usage and safety skills, and preparation of basic stocks, soups and sauces, leading to preparation of cold foods such as salads and dressings, sandwiches, cold entrée items and canapés. Food safety is an essential part of all practical lessons and assessments. Practical tuition is based on methods of cookery and covers a comprehensive food range which enables students to progress from basic to complex food preparation, cooking and presentations. Module 2: PC402 Cookery Fundamentals This module further develops cooking competence by learning how to prepare, cook and present a range of simple dishes and introduces pasta, rice and farinaceous dishes, vegetables, fruits and pulses. Basic nutrition is introduced. The student continues to develop skills and knowledge through teaching of methods of cookery using a broad variety of commodities and students are exposed to realistic work experience in the restaurant kitchen where they practice communication skills and teamwork in a realistic work environment with all associated time constraints and pressures. Module 3: PC403 Applied Complex Cookery Skills This module further enhances cooking competence through teaching fish and shellfish, meat, poultry and offal dishes. All dishes are 'complex' with vegetables, sauces and starch commodities. Students complete work plans and present all dishes under time pressure with the expectation that the dishes served are standard and quality for a paying customer. Module 4: PC404 Patisserie and Healthy Diets This module focuses on baking and finishing of bakery products, and preparation, cooking and finishing of hot and cold desserts. Healthy foods and special diets are studied in this module. Students complete an end-point assessment where they are required to plan, cost, prepare and cook a 3-course meal which is served in the 'training' restaurant to paying customers with all associated time constraints and pressures. At the end of the module students sit for a summative theory exam covering the theory of all units."},{"h":"Start dates","t":"CAMPUS | START DATE Auckland | 30th January 2024 Auckland | 15th April 2024 Auckland | 1st July 2024 Auckland | 16th September 2024 Auckland | 25th November 2024"},{"h":"Enrolment Info:","t":"Duration: 1 year Fees: -Tuition fee : $19,500 -Material fee : $2,000 Material and Resource fee include: - Access to all school facilities and equipment during school hours or by arrangement with the tutor in charge after class hours - Processing, recording and reporting of assessment results and personal data - Training ingredients used in the practical classes - Course work books and text books (If it is applicable) - Uniform - Student ID card - Field trips (If it is applicable) Entry requirement: - Applicants must be 17 years of age or older - Recognition of Prior Learning (RPL) may be considered for candidates with good industry back ground. All RPL candidates are required to provide relevant proof of industry experience - For whom English is not a first language must have an IELTS score (General or Academic) of 5.5 with no band score lower than 5, or an equivalent NZQA approved English language test."},{"h":"Graduate profile","t":"On successful completion of this programme and having achieved all the graduate profile outcomes, graduates will be able to: - Monitor and maintain health and safety, food safety and security practices to ensure own safety and minimize potential hazards for customers. - Monitor and maintain effective communicate and interactions colleagues, other staff, managers and customers in a hospitality service environment. - Monitor and maintain the application of standard operating policies and procedures to work roles in a commercial kitchen. - Apply cookery skills to prepare, cook and present a range of cold larder dishes utilising complex preparation and presentation techniques. - Apply cookery skills to prepare, cook and present a range of hot kitchen dishes utilising complex preparation and presentation techniques. - Apply cookery skills to prepare, cook and present a range of patisserie and desserts utilising complex preparation and presentation techniques."}],"words":893},{"id":"wp-cookery-level3","type":"course-archive","title":"New Zealand Certificate in Cookery Level 3","route":"courses","updated":"2017-02-09","source":"/courses/cookery-level3/","sections":[{"h":"Programme Introduction","t":"The purpose of this qualification is: - To provide the hospitality sector with competent employees who are able to work as chefs in junior positions producing basic dishes in a commercial kitchen. - To provide individuals who are employed or will be employed as chefs in junior positions a qualification that will support their employment opportunities in a commercial kitchen within hospitality establishments. - To implement established standards of professional practice for basic cookery that can provide customers with confidence in a range of hospitality environments."},{"h":"Course Highlights","t":"The New Zealand Certificate in Cookery (Level 3) is an 18-week, 60 credit programme which will be delivered over two 9-week terms with a two-week break between terms. The programme has been designed to meet the educational needs of students and fulfil their career aspirations and be employed as chefs in junior positions in commercial kitchens within the hospitality sector. The programme provides foundational knowledge and skills in cookery as well as to develop practical skills and applied knowledge in specific areas such as: - health and safety in the workplace; - food safety and security practices; - basic kitchen procedures; - customer interactions and communications; - introduction to nutrition; - methods of cookery. In addition, students will also gain 'realistic work experience' in preparing, cooling and presenting a range of dishes in modern, fully equipped commercial kitchens."},{"h":"Course Structure","t":"Module 1: PC301 Introduction to Cookery covers health and safety and food safety, an introduction to kitchen procedures with a focus on knife usage and safety skills, and preparation of basic stocks, soups and sauces, leading to preparation of cold foods such as salads and dressings, sandwiches, cold entrée items and canapés. Food safety is an essential part of all practical lessons and assessments. Module 2: PC302 Cookery Fundamentals develops cooking competence by learning how to prepare, cook and present a range of simple dishes employing commodities commonly used in the industry. At this stage basic nutrition is introduced. The student continues to develop skills and knowledge through teaching of methods of cookery using a broad variety of commodities and students are exposed to realistic work experience in the restaurant kitchen where they practice communication skills and teamwork in a realistic work environment with all associated time restraints and pressures. Campus | Start Date Auckland | 30 th Jan. 2017, 24 th Apr. 2017, 17 th Jul. 2017, 09 th Oct. 2017, 27 th Nov. 2017"},{"h":"Enrolment Info:","t":"Duration: 6 Months"},{"h":"International:","t":"Tuition fee : $9,248 Material fee : $1,000"},{"h":"Material fee include:","t":"- Access to all school facilities and equipment during school hours or by arrangement with the tutor in charge after class hours - Processing, recording and reporting of assessment results and personal data - Course work books and text books (If it is applicable) - Uniform - Student ID card - Field trips (If it is applicable)"},{"h":"Entry Requirements :","t":"Domestic Students - Applicants must be 17 years of age or older - Recognition of Prior Learning (RPL) may be considered for candidates with good industry back ground. All RPL candidates are required to provide relevant proof of industry experience International Students - Applicants must be 17 years of age or older - Recognition of Prior Learning (RPL) may be considered for candidates with good industry back ground. All RPL candidates are required to provide relevant proof of industry experience - For whom English is not a first language must have an overall IELTS score (General or Academic) of 5 with no band score lower than 5, or an equivalent NZQA approved English language test, or our internal English Test"},{"h":"Graduate profile","t":"On successful completion of this programme and having achieved all the graduate profile outcomes, graduates will be able to: - Apply health and safety, food safety and security practices to service delivery operations including ensuring personal safety and minimizing potential hazards for customers. - Communicate effectively and interact in a professional manner with colleagues, other staff, managers and customers to provide quality service outcomes. - Apply standard operating procedures and the code of conduct to deal with familiar problems in a commercial kitchen environment. - Apply fundamental cookery skills to prepare, cook and present a range of basic dishes using commodities commonly used in commercial kitchens."}],"words":711},{"id":"wp-food-and-beverage-level-4","type":"page","title":"NZ Certificate in Food and Beverage Service (Restaurant Services) (Level 4)","route":"course-fb4","updated":"2017-01-13","source":"/courses/food-and-beverage-level-4/","sections":[{"h":"Programme Introduction","t":"Building on the New Zealand Certificate in Food and Beverage, Level 3, this 18-week programme focusses on restaurant service. On completion of this certificate, graduates will have the skills and knowledge to competently and confidently gain employment in the hospitality industry."},{"h":"Course Highlights","t":"Learners will be involved in running the campus training restaurant, whilst gaining an in-depth understanding of food safety practices, menu design, customer service and cash handling skills. There will be opportunities to serve breakfasts, lunches, high teas and cocktail functions."},{"h":"Course Structure","t":"Health & Safety and Product knowledge ( 9 weeks ) • Safety at work • Food Safety in Catering • Menu Knowledge & Design • Beverage Product Knowledge Restaurant Operations and Customer Service ( 9 weeks) • Safety at work • Customer Service • Menu Knowledge & design • Hot Beverage Product Knowledge • Food & Beverage Service • Handling Payments CAMPUS | START DATE Auckland | 30th Jan. 2017 Auckland | 24th Apr. 2017 Auckland | 17th Jul. 2017 Auckland | 09th Oct. 2017 Auckland | 27th Nov. 2017"},{"h":"Enrolment Info:","t":"Campus – Auckland"},{"h":"International:","t":"Tuition fee : $8,000 Material and Resource Fee : $800 Material fee include: - Access to all school facilities and equipment during school hours or by arrangement with the tutor in charge after class hours - Processing, recording and reporting of assessment results and personal data - Course work books and text books (If it is applicable) - Uniform - Student ID card - Field trips (If it is applicable) Entry requirement: Domestic Students - Applicants must be 18 years of age or older Applicants must be 18 years of age or older - Recognition of Prior Learning (RPL) may be considered for candidates with good industry back ground. All RPL candidates are required to provide relevant proof of industry experience Recognition of Prior Learning (RPL) may be considered for candidates with good industry back ground. All RPL candidates are required to provide relevant proof of industry experience International Students - Applicants must be 18 years of age or older - Recognition of Prior Learning (RPL) may be considered for candidates with good industry back ground. All RPL candidates are required to provide relevant proof of industry experience - For whom English is not a first language must have an IELTS score (General or Academic) of 5.5 with no band score lower than 5 , or an equivalent NZQA approved English language test, or our internal English Test For whom English is not a first language must have an IELTS score (General or Academic) of 5.5 with no band score lower than 5 , or an equivalent NZQA approved English language test, or our internal English Test"}],"words":450},{"id":"wp-basic-cookery-l3","type":"course-archive","title":"National Certificate in Hospitality (Basic Cookery) Level 3","route":"courses","updated":"2015-10-27","source":"/courses/basic-cookery-l3/","sections":[{"h":"Programme Introduction","t":"This is an introductory course to the food industry where you will learn work place safety and food handling alongside food hygiene in the first weeks of the course. Students will cover basic food preparation and cooking under supervision. The compulsory section of the qualification covers the skills and knowledge relating to:"},{"h":"Course Highlights","t":"During your time at PBRS you will develop the essential starter kit skills to carve your way into the culinary world of the hospitality industry. From learning top notch knife skills and safe food handling skills through to mains and delicious desserts you will gain the confidence to move into a role in a commercial kitchen. From there you will find that the journey continues through practical experience and using your passion for food which will take you higher in your career. Campus | Start Date | End Date Auckland | 05 Oct. 2015 | 03 Apr. 2016"},{"h":"Course Structure","t":"- Customer service skills - Food safety - Barista & espresso coffee production skills - Sales - Table service - Mixology & the science of cocktails"},{"h":"Campus – AucklandEnrolment Info:","t":"Duration: 6 months"},{"h":"Domestic :","t":"Tuition fee : $4,316 Material fee : $600(Can be applied from studylink course related cost)"},{"h":"International:","t":"Tuition fee : $9,500 Material fee : $500"},{"h":"Material fee include:","t":"- Access to all school facilities and equipment during school hours or by arrangement with the tutor in charge after class hours - Processing, recording and reporting of assessment results and personal data - Course work books and text books (If it is applicable) - Uniform - Student ID card - Field trips (If it is applicable) Entry Criteria: Age: To enrol in this course, you must be at least 18 years of age, or older by the first day of course commencement. Pass the PBRS Literacy and Numeracy Internal test. Schooling: NCEA Level 2 or higher. Academic: Previous tertiary study an advantage You will be required to sit a written entry test."}],"words":331},{"id":"wp-how-to-enrol","type":"page","title":"How to Enrol?","route":"enrolment","updated":"2024-01-16","source":"/how-to-enrol/","sections":[{"h":"How to Enrol","t":"To get started with your enrolment complete the pre-screening assessment and enrolment form online by clicking the below link and an enrolment interview will be arranged for a convenient time, or alternatively, phone us during business hours on 09 300 7277 to arrange an enrolment interview."},{"h":"Step 1– Decide what you would like to study","t":"Check course information by visiting our website www.pbrs.ac.nz or visiting one of our recruitment agents or calling us on 09 300 7277 for an information pack to be sent to you. Find a course that meets your career expectation and make your decision."},{"h":"Step 2 – Complete the Enrolment Form","t":"Download our Enrolment Form at www.pbrs.ac.nz , or fill in the form with one of our recruitment agents or fill in the form at one of our campuses. Depending on the course you have chosen, you will be required to supply evidence of any previous qualifications you have gained, and evidence of your English proficiency at the appropriate level. You are also required to provide a copy of your personal ID (Passport, Birth Certificate or Driver's License etc.) Before you sign the Enrolment Form, please make sure you have read and understood our enrolment policies , policies in our Student Handbook and the Education (Pastoral Care of International Students) Code of Practice 2021 . Submit your enrolment documents to PBRS directly or through your agent."},{"h":"Step 3 – Get the Offer of Placement and the Fee Schedule","t":"After receiving your enrolment document, PBRS will consult and assess your application, according to the documents and information you have provided and, if appropriate, PBRS will issue an Offer of Placement (conditional or unconditional) and a Fee Schedule. Please be aware that all international students are required to have a proper Medical and Travel insurance while they are studying in New Zealand. Therefore, an insurance fee will be included in the fee schedule."},{"h":"Step 4 – Pay your fees and get your student visa","t":"To study in New Zealand, all international students are required to have a proper visa. If you are out of New Zealand, you may lodge your Student Visa Application with our unconditional offer and other documents as required by Immigration New Zealand (INZ) . Pay your fees listed on the Fee Schedule once you receive the Approval in Principle from INZ. In some countries, you may be required to pay your fees before you lodge your Student Visa Application. Please follow INZ's requirement at all the time. If you are in New Zealand, please pay your fees before you lodge your Student Visa Application. You will find our trust account details on the Fee Schedule for your direct payment to PBRS. Upon your payment, PBRS will send you a receipt for your payment"},{"h":"Step 5 – Start your study","t":"Once you get your visa approved, you will start your study on the course start date. Congratulations! Remember to check our website to get more information about the orientation and living in New Zealand. Download the International Prospectus"}],"words":506},{"id":"wp-graduation-application","type":"page","title":"2018 Graduation Application","route":"events","updated":"2018-02-26","source":"/graduation-application/","sections":[{"h":"2018 Graduation Ceremony","t":"Friday 18 May 2018 at 09:00 a.m. St Matthew in-the-City(Corner of Hobson and Wellesley Streets Auckland City) We invite you to attend and bring along Whanua and friends. As there is a limit to the number of attendees, you may bring up to 1 guests plus yourself (maximum 2 in total). If you would like to participate the ceremony then, Please R.S.V.P to us by 13rd April 2018 at reception or via e-mail christine.verar@cornell.ac.nz Please note if we do not receive a reply by the above date, you will be UNABLE to participate in the ceremony. As this event is a formal occasion graduates MUST wear the following respectively to be part of the ceremony: Regalia for Diploma Level 5 & 6 graduates Regalia hire = $80.00 (Rental: $30, Bond*: $50.00) * The bond fee will be refunded when you return the regalia on the day or Formal dress with formal shoes for National Certificate Level 3 & 4 graduates • You must make payment at reception for your regalia before 28th April 2017. This will help greatly in our preparation for the ceremony and will allow us to send you further details of the ceremony. Fill-in the details below and click Submit at the bottom to complete your graduation application. PAYMENT METHODS 1. Pay with cash at PBRS Reception (With RSVP form, if it is possible) or ; 2. Transfer to Cornell Account Account Name: Cornell Institute of Business & Technology LTD. Account Number: 03 -0252-0014839-00 Reference: The last 5 digits of your PBRS student ID number For example: For ID Number Inta23456, payment reference will be 23456 . ＊ Without ID number, we may MISS your payment ＊ * You must make payment at reception before 27th April 20 18 for your regalia **Please return this form A.S.A.P by Email: christine.verar@cornell.ac.nz , or To reception at 150 Hobson St, Auckland."}],"words":315},{"id":"wp-why-choose-pbrs","type":"page","title":"PBRS: Professional Bar and Restaurant School","route":"about","updated":"2017-03-03","source":"/why-choose-pbrs/","sections":[{"h":"Why Choose PBRS?","t":"PBRS combines an unequalled blend of highly qualified tutorial staff, outstanding training facilities and offers a completely up-to-date and relevant course curriculum which meets the needs of industry. This approach guarantees that students graduate from PBRS with world-class and internationally recognised qualifications that will fully prepare them for success in their careers. PBRS is the recipient of the New Zealand Culinary Fare Training Excellence Award 2014 , 2016 along with Cornell Institute of Business and Technology , besting other training institutes across New Zealand. This event was held over three days (17th-19th August 2014) at the Vodafone Events Centre."}],"words":102},{"id":"wp-enrolment-form","type":"page","title":"Enrolment Form","route":"enrol","updated":"2024-01-15","source":"/enrolment-form/","sections":[{"h":"Enrolment Form","t":"Please click the following links to download the enrolment forms - International Enrolment Form"}],"words":16},{"id":"wp-certificate-in-hospitality","type":"course-archive","title":"National Certificate in Hospitality (Food & Beverage) Level 3","route":"courses","updated":"2015-08-14","source":"/courses/certificate-in-hospitality/","sections":[{"h":"Programme Introduction","t":"The Food and Beverage Level 3 course will take you on a journey into the global world of hospitality utilising your newly gained beverage and customer service skill set. The crucial skills gained in producing flavoursome espresso coffee will give you the edge in applying for jobs and strengthen your confidence to work in the café and restaurant environments. The importance of providing great customer service cannot be overestimated. The Level 3 program will highlight the essential practical and professional skills that will make you stand out from the crowd. Learning about mixology will be an exciting component of this course that will get you the introduction you need to enter the specialised beverage sector of bar and cocktails. Enjoy the journey!"},{"h":"Course Highlights","t":"During your time at PBRS you will practice barista skills to get you work ready, as well as food and beverage service skills to confidently step out in to the industry. The course will empower you to perform well in any given customer service environment. You will also learn the techniques in making great cocktails that keeps the customer coming back. Regular field trips to some of the top hotels, bars, restaurants, cafes are included throughout the course duration. (Subject to availability)"},{"h":"Course Structure","t":"- Customer service skills - Food safety - Barista & espresso coffee production skills - Sales - Table service - Mixology & the science of cocktails Campus | Start Date Auckland | 27 Jan. 2015 Auckland | 20 Apr. 2015 Auckland | 13 Jul. 2015 Auckland | 05 Oct. 2015"},{"h":"Enrolment Info:","t":"Campus – Auckland Duration: 6 months"},{"h":"Domestic :","t":"Tuition fee : $3,973 Material fee : $600(Can be applied from studylink course related cost)"},{"h":"International:","t":"Tuition fee : $7,250 Material fee : $500"},{"h":"Material fee include:","t":"- Access to all school facilities and equipment during school hours or by arrangement with the tutor in charge after class hours - Processing, recording and reporting of assessment results and personal data - Course work books and text books (If it is applicable) - Uniform - Student ID card - Field trips (If it is applicable) Entry Criteria: Age: To enrol in this course, you must be at least 18 years of age, or older by the first day of course commencement. English: Literacy & Numeracy unit standards to NCEA level 2 or higher. Schooling: NCEA Level 2 or higher. Academic: Previous tertiary study an advantage You will be required to sit a written entry test."}],"words":414},{"id":"wp-our-students-testimonials","type":"page","title":"Our Students – Testimonials","route":"testimonials","updated":"2019-10-21","source":"/about-us/our-students-testimonials/","sections":[{"h":"Vanilyn Tugay","t":"Diploma in Hotel Management, Level 6 My Mentor was Mohit Sharma. As this was my first competition I was very excited to win a Gold medal and I put this down to the excellent training and hard work put in by Mohit. I highly recommend Cornell, the staff are knowledgeable and friendly and Andrew Ayles who is the Academic Team Leader of Hospitality school is also very supportive of the students entering competitions. This competition has helped me to find new jobs and has opened up my career prospects.” Gold Medal, National Culinary Fare, 2016"},{"h":"Daryl Mercurio","t":"Diploma in Hospitality(Operational Management & Rooms Division) Level 5 “My Tutor Jacques was also my mentor for this competition. He was very helpful and pushed me to achieve my very best and to get me out of my comfit zone. Because of this experience I am now a lot more confident when dealing with customers, especially as English is a second language for me. Cornell is a great place to learn and improve on your knowledge. The icareer department are very helpful and knowable when helping you look for a job in Auckland. ” Gold Medal, National Culinary Fare, 2016"},{"h":"Candice Siazan","t":"Diploma in Hotel Management, Level 6 “Olivia Ramos was my tutor and mentor. My training has been very beneficial to my career progress. It has given me the confidence and skills to advance quickly through my chosen field. Olivia is very passionate about the Hospitality Industry and has a huge amount of knowledge. I will refer this school to my friends as it has not only given me the level 6 qualification but also hands on experience which is invaluable when looking for the right job's in Auckland.” Gold Medal, Regional Culinary Fare, 2016"},{"h":"Ma. Karina K. Makasaet","t":"Diploma in Hospitality (Operational Management & Rooms Division) Level 5 “I had no idea about coffee making and 'barista' skills until I started studying at Cornell. My tutor Olivia Ramos, encouraged me to enter the culinary fare in 2016. My competition success has given me an edge over other candidates and also looks great on my C.V. I would highly recommend Cornell to my friends as I have not only gained a qualification but also a lot of practical skills as well, which has given me the confidence to grow in the Hospitality Industry” Bronze Medal, National Culinary Fare, 2016"},{"h":"Joanna Tabusares","t":"Diploma in Hotel Management, L6 “Jauqes was my training tutor and helpe d me to build up my confidence before I entered the competition. He taught me how to fold napkins and how to set a table up under pressure. I am now more confident to move forward with my career as a result of his excellent training that I have received. I also have an edge over other's applying for jobs as this looks really good on my C.V. as well. I would highly recommend Cornell to my friends. I have learnt how to work hard and how to balance my studies with work.” Silver Medal, National Culinary Fare, 2016"},{"h":"Ryuk Jo","t":"New Zealand Certificate in Food and Beverage Service (Café Services and Bar Services) (Level 3) Diploma in Hospitality – Level 5 (Operational Management & Rooms Division) Where are you from? Japan. I came over to New Zealand with my family. I moved from Papermoon Mairangi Bay which is a workplace introduced to me by my tutor (Mohit Sharma) at the time. My level 3 tutor Mohit knew the manager at Papermoon and helped me get a job there. Throughout the course Mohit helped me and gave me advice to being a good bartender. I want to gain more skills and knowledge to become a top bartender. Enter competitions where I can, challenge and improve myself to move up within the hospitality industry."},{"h":"Beau McLean","t":"Certificate in Hospitality (Operations & Supervision) Level 4 I was born in Australia, after which I moved to Scotland, and then I moved to New Zealand in 1997. Before coming to study at PBRS I was at Unitec studying Performance Technology, but I decided to come to The Professional Bar & Restaurant School so I could expand my qualifications and learn something new and exciting. Hospitality is my passion, and I knew people who were going here who said it was really good, so I thought I would give it a go. I chose to study the Certificate in Hospitality (Operations & Supervision) Level 4 as it is a stepping stone to move up to a level 5 then a level 6 qualification. My favourite part of studying here so far is learning about HR and the process of opening a bar, as it really puts you into the frame of mind of what is required to own your own business in the hospitality industry. I currently work at Bestaff Hospitality Recruitment, through which I have worked at Vector Arena, SkyCity, Viaduct Events, and ASB Showgrounds, as well as contract catering at Spotless at Eden Park. Richard Doolan who runs Functionality, the PBRS employment agency, helped me get the job at Spotless. After finishing my studies I want to move to Australia and work for Carnival Australia, working on a cruise ship, or to go to New Plymouth and study the level 7 and 8 courses at their Hospitality Management School."},{"h":"Ashley Jordan Hunt","t":"Certificate in Hospitality (Operations & Supervision) Level 4 Before I came to PBRS I had left high school in 2010, after which I spent two years working at The Warehouse being on call and mostly sitting around doing nothing with my life until a friend suggested to me that I join PBRS. I have quite a few friends who study here and everybody had really good things to say about the course. I have never been an academic, but PBRS sets you up for success. The first month of the course (practical) gives you a taste of what working behind a bar would really be like. And even after you graduate if you think hospitality isn't for you, you have the skills and the certificate to fall back on because it is NZQA recognised. So far I have really enjoyed our first block, as we got to make our own cocktails which were also judged. It brought us together as a class and we all got to know each
