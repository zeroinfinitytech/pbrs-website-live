<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>PBRS International</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Sans+Arabic:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+Devanagari:wght@500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 20px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;text-rendering:optimizeLegibility}
html.theming *,html.theming *::before,html.theming *::after{transition:background-color .35s,color .35s,border-color .35s,box-shadow .35s!important}
h1,h2,h3,h4{margin:0;line-height:1.12;text-wrap:balance;font-weight:600}
h1,h2{font-family:var(--f-display);letter-spacing:-.018em}
h1{font-size:clamp(2.5rem,6vw,4.9rem)}
h2{font-size:clamp(1.8rem,3.4vw,2.85rem)}
h3{font-size:1.18rem;letter-spacing:-.005em}
p{margin:0}
a{color:var(--link)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cta);outline-offset:3px;border-radius:8px}
::selection{background:var(--sky);color:#04172a}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] .dir{transform:scaleX(-1)}
.wrap{max-width:1280px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{display:inline-flex;gap:.5rem;align-items:center;font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.eyebrow::before{content:'';width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--sky),var(--lime))}
html[lang="zh"] .eyebrow,html[lang="hi"] .eyebrow,html[lang="ar"] .eyebrow{letter-spacing:.04em;text-transform:none}
.lead{font-size:1.18rem;color:var(--ink-2);max-width:58ch}
.muted{color:var(--ink-2)}.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grad-text{background:linear-gradient(100deg,var(--sky),var(--lime) 55%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:46px;padding:.65rem 1.35rem;border-radius:999px;border:1.5px solid transparent;font-weight:650;font-size:.97rem;text-decoration:none;transition:background .25s,transform .25s var(--ease),box-shadow .25s,border-color .25s;white-space:nowrap;position:relative}
.btn:active{transform:scale(.97)}
.btn-cta{background:linear-gradient(135deg,var(--cta),#e07a1f);color:var(--on-cta)}
html[data-theme="dark"] .btn-cta{background:linear-gradient(135deg,#f0913f,#ffb25e)}
.btn-cta:hover{box-shadow:0 10px 28px rgb(232 135 43 / 38%);transform:translateY(-2px)}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-brand:hover{filter:brightness(1.1);transform:translateY(-2px)}
.btn-line{border-color:var(--line-2);background:var(--surface);color:var(--ink)}
.btn-line:hover{border-color:var(--brand);color:var(--brand)}
.btn-glass{background:rgb(255 255 255 / 14%);border-color:rgb(255 255 255 / 30%);color:#fff;backdrop-filter:blur(10px)}
.btn-glass:hover{background:rgb(255 255 255 / 24%)}
.btn-ghost{background:transparent;color:var(--brand)}.btn-ghost:hover{background:var(--brand-soft)}
.btn-sm{min-height:38px;padding:.4rem 1rem;font-size:.88rem}
.btn-lg{min-height:54px;padding:.8rem 1.8rem;font-size:1.04rem}
.btn-block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:border-color .2s,color .2s,transform .25s var(--ease)}
.icon-btn:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}

/* scroll progress */
#progress{position:fixed;inset:0 0 auto 0;height:3px;z-index:200;background:linear-gradient(90deg,var(--sky),var(--lime),var(--orange));transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
[dir="rtl"] #progress{transform-origin:100% 50%}

/* prose */
.prose{max-width:74ch;font-size:1.04rem}
.prose h2{font-size:1.7rem;margin:2.2rem 0 .8rem}.prose h3{font-size:1.3rem;margin:1.8rem 0 .6rem;font-family:var(--f-display)}.prose h4{font-size:1.1rem;margin:1.4rem 0 .4rem}
.prose p{margin:0 0 1rem;color:var(--ink-2)}
.prose ul,.prose ol{color:var(--ink-2);padding-inline-start:1.3rem;margin:0 0 1.1rem}.prose li{margin-bottom:.4rem}
.prose strong{color:var(--ink)}
.prose table{width:100%;border-collapse:collapse;font-size:.94rem;margin:1rem 0 1.4rem;display:block;overflow-x:auto}
.prose th,.prose td{text-align:start;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.prose th{background:var(--surface-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.prose a{font-weight:600}
.prose>*:first-child{margin-top:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:3rem;padding-block:3rem 5rem;align-items:start}
.aside{position:sticky;top:calc(var(--nav-h) + 60px);display:grid;gap:1rem}
.toc{display:grid;gap:.1rem}
.toc a{padding:.5rem .8rem;border-radius:10px;text-decoration:none;color:var(--ink-2);font-size:.92rem;border-inline-start:2px solid var(--line)}
.toc a:hover,.toc a.on{color:var(--brand);background:var(--brand-soft);border-color:var(--brand)}

/* tabs, accordion, pills */
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:1.6rem;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:.85rem 1.1rem;font-weight:650;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brand);border-color:var(--brand)}
.acc{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.acc+.acc{margin-top:.7rem}
.acc>button{display:flex;width:100%;justify-content:space-between;gap:1rem;align-items:center;background:none;border:0;padding:1.1rem 1.3rem;font-weight:650;text-align:start;font-size:1rem}
.acc>button .ic{transition:transform .35s var(--ease)}
.acc.open>button .ic{transform:rotate(180deg)}
.acc>div{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.acc.open>div{grid-template-rows:1fr}
.acc>div>div{overflow:hidden}
.acc .in{padding:0 1.3rem 1.2rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;border-radius:999px;padding:.22rem .7rem;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-crit{background:var(--crit-soft);color:var(--crit)}.p-info{background:var(--brand-soft);color:var(--brand)}.p-mute{background:var(--surface-2);color:var(--ink-2)}.p-cta{background:var(--cta-soft);color:var(--cta)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}
.kv div{background:var(--surface-2);border-radius:14px;padding:.9rem 1.1rem}
.kv small{display:block;font-size:.75rem;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.kv b{font-size:1.02rem}
.sidecard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:1.5rem;box-shadow:var(--shadow);display:grid;gap:1rem}
.sidecard .tot{font-family:var(--f-display);font-size:2.6rem;font-weight:600;line-height:1.05}

/* forms */
.fld{display:grid;gap:.4rem}
.fld label,.fld .lb{font-weight:650;font-size:.88rem}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line-2);background:var(--surface);border-radius:14px;padding:.75rem 1rem;min-height:48px;width:100%;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.fld small{color:var(--ink-3);font-size:.8rem}
.fld .err{color:var(--crit);font-size:.82rem;display:none}
.fld.bad input,.fld.bad textarea{border-color:var(--crit)}.fld.bad .err{display:block}
.fld option{color:#0b1b2e;background:#fff}
.chipset{display:flex;gap:.5rem;flex-wrap:wrap}
.chipset label{cursor:pointer}
.chipset input{position:absolute;opacity:0;pointer-events:none}
.chipset span{display:inline-flex;gap:.4rem;align-items:center;border:1.5px solid var(--line-2);border-radius:999px;padding:.5rem 1rem;font-weight:620;font-size:.92rem;background:var(--surface);min-height:44px;transition:all .25s var(--ease)}
.chipset span:hover{border-color:var(--brand)}
.chipset input:checked+span{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.chipset input:focus-visible+span{outline:3px solid var(--cta);outline-offset:2px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.1rem;border:1.5px solid var(--line-2);border-radius:16px;background:var(--surface)}
.switch input[type=checkbox]{appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .25s}
.switch input[type=checkbox]::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .25s var(--ease);box-shadow:0 1px 4px rgb(0 0 0 / 30%)}
.switch input[type=checkbox]:checked{background:var(--ok)}
.switch input[type=checkbox]:checked::after{inset-inline-start:23px}
.stepper-n{display:inline-flex;align-items:center;border:1.5px solid var(--line-2);border-radius:999px;background:var(--surface)}
.stepper-n button{width:42px;height:42px;border:0;background:none;border-radius:50%;font-size:1.2rem;font-weight:700;color:var(--brand)}
.stepper-n output{min-width:2.4rem;text-align:center;font-weight:700}
.search{display:flex;align-items:center;gap:.6rem;background:var(--surface);border:1.5px solid var(--line-2);border-radius:999px;padding:0 1.1rem;min-height:48px;flex:1;max-width:440px}
.search input{border:0;background:none;flex:1;min-width:0;outline:0;padding:.5rem 0}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}

/* catalog / calc / apply */
.catalog{display:grid;grid-template-columns:280px 1fr;gap:2rem;padding-block:2.5rem 6rem;align-items:start}
.filters{position:sticky;top:calc(var(--nav-h) + 60px);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:1.3rem}
.filters h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin-bottom:.6rem}
.fgroup{display:grid;gap:.15rem;margin-bottom:1.4rem}
.fgroup label{display:flex;gap:.6rem;align-items:center;padding:.4rem .3rem;border-radius:10px;cursor:pointer;font-size:.95rem}
.fgroup label:hover{background:var(--surface-2)}
.fgroup input{width:18px;height:18px;accent-color:var(--brand)}
.fgroup .ct{margin-inline-start:auto;color:var(--ink-3);font-size:.8rem}
.range{width:100%;accent-color:var(--cta)}
.rbar{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-2)}
.toolbar{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center;margin-bottom:1.3rem}
.tray{position:fixed;left:50%;transform:translate(-50%,160%);bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:90;background:var(--band);color:#fff;border-radius:999px;padding:.55rem .55rem .55rem 1.4rem;display:flex;gap:1rem;align-items:center;box-shadow:var(--shadow-lg);transition:transform .5s var(--ease);max-width:calc(100vw - 32px);border:1px solid rgb(255 255 255 / 14%)}
.tray.on{transform:translate(-50%,0)}
.calc{display:grid;grid-template-columns:1fr 420px;gap:2.5rem;padding-block:3rem 6rem;align-items:start}
.sum{position:sticky;top:calc(var(--nav-h) + 60px);background:linear-gradient(160deg,var(--band),#0b4f8c);color:#fff;border-radius:28px;padding:1.8rem;box-shadow:var(--shadow-lg);overflow:hidden}
.sum::after{content:'';position:absolute;inset-inline-end:-50px;bottom:-60px;width:220px;height:220px;background:url(img/symbol.png?v=mvdpfoju) center/contain no-repeat;opacity:.1}
.sum h3{color:var(--on-band-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}
.sum .tot{font-family:var(--f-display);font-size:3.4rem;font-weight:600;line-height:1.05;margin:.4rem 0 .2rem}
.lines{list-style:none;margin:1.3rem 0;padding:0;position:relative;z-index:1}
.lines li{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px solid rgb(255 255 255 / 14%);font-size:.94rem}
.lines li span:first-child{color:var(--on-band-2)}
.sum small{color:var(--on-band-2);display:block;margin-bottom:1rem;position:relative;z-index:1}
.sum .btn-line{background:transparent;color:#fff;border-color:rgb(255 255 255 / 35%)}
.sample{display:inline-flex;gap:.4rem;align-items:center;font-size:.76rem;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:.2rem .7rem}
.apply{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;gap:2rem;padding-block:3rem 6rem;align-items:start}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:.3rem;position:sticky;top:calc(var(--nav-h) + 60px)}
.steps li{display:flex;gap:.8rem;align-items:center;padding:.65rem .8rem;border-radius:14px;color:var(--ink-2);font-weight:620;font-size:.94rem}
.steps .b{width:32px;height:32px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-size:.8rem;flex:none;background:var(--surface)}
.steps li.done .b{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.cur{background:var(--brand-soft);color:var(--brand)}.steps li.cur .b{border-color:var(--brand);color:var(--brand)}
.saved{font-size:.82rem;color:var(--ok);display:inline-flex;gap:.4rem;align-items:center;font-weight:650}
.upl{display:grid;gap:.6rem}
.upl-row{display:flex;gap:1rem;align-items:center;padding:.9rem 1.1rem;border:1.5px dashed var(--line-2);border-radius:16px;background:var(--surface)}
.upl-row.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.upl-row .t{flex:1;min-width:0}.upl-row .t small{display:block;color:var(--ink-2)}
.dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.dot.g{background:var(--ok-soft);color:var(--ok)}.dot.b{background:var(--brand-soft);color:var(--brand)}.dot.o{background:var(--cta-soft);color:var(--cta)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--lime));border-radius:99px;transition:width .6s var(--ease)}

/* timeline (how to enrol) */
.tl{position:relative;display:grid;gap:1.4rem;padding-inline-start:3.4rem}
.tl::before{content:'';position:absolute;inset-inline-start:21px;top:10px;bottom:10px;width:3px;border-radius:3px;background:linear-gradient(var(--sky),var(--lime),var(--orange))}
.tl>div{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.4rem 1.6rem}
.tl .n{position:absolute;inset-inline-start:-3.4rem;top:1rem;width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;box-shadow:0 0 0 6px var(--bg)}
.tl h3{margin-bottom:.4rem;font-family:var(--f-display);font-size:1.25rem}
.tl p,.tl li{color:var(--ink-2)}

/* events calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.cal>div{background:var(--surface);min-height:96px;padding:.5rem .6rem;font-size:.85rem;position:relative}
.cal .h{min-height:0;background:var(--surface-2);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);text-align:center;padding:.6rem}
.cal .o{opacity:.4}.cal .today b{background:var(--cta);color:var(--on-cta);border-radius:50%;width:26px;height:26px;display:inline-grid;place-items:center}
.cal .ev{display:block;margin-top:.3rem;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:.15rem .4rem;font-size:.75rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* jobs */
.job{display:grid;grid-template-columns:60px 1fr auto;gap:1.1rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.2rem 1.4rem;transition:box-shadow .3s,border-color .3s,transform .4s var(--ease)}
.job+.job{margin-top:.8rem}
.job:hover{box-shadow:var(--shadow);border-color:var(--brand);transform:translateX(4px)}
[dir="rtl"] .job:hover{transform:translateX(-4px)}
.job .lg{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.5rem;font-weight:600;color:#fff}
.job .mt{display:flex;gap:.4rem 1rem;flex-wrap:wrap;color:var(--ink-2);font-size:.86rem;margin-top:.25rem}
.job .mt span{display:inline-flex;gap:.35rem;align-items:center}

/* map */
.map{position:relative;border-radius:24px;overflow:hidden;min-height:340px;background:var(--surface-2);border:1px solid var(--line)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .pin{position:absolute;left:52%;top:46%;transform:translate(-50%,-100%);display:grid;justify-items:center;gap:.3rem}
.map .pin span{background:var(--surface);border-radius:12px;padding:.5rem .8rem;font-weight:650;font-size:.85rem;box-shadow:var(--shadow-lg);white-space:nowrap}
.map .pin i{width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--cta);transform:rotate(-45deg);box-shadow:0 0 0 8px rgb(232 135 43 / 25%)}
.contact-cards{display:grid;gap:1rem}
.cinfo{display:flex;gap:1rem;align-items:flex-start;padding:1.2rem;border:1px solid var(--line);border-radius:18px;background:var(--surface)}

/* overlays */
.scrim{position:fixed;inset:0;background:rgb(3 12 22 / 62%);backdrop-filter:blur(4px);z-index:150;display:none}
.scrim.on{display:block;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;inset-inline-end:0;top:0;bottom:0;width:min(580px,100vw);z-index:160;background:var(--surface);box-shadow:var(--shadow-lg);transform:translateX(105%);transition:transform .5s var(--ease);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer.on{transform:none}
.dr-h{display:flex;justify-content:space-between;align-items:start;gap:1rem;padding:1.4rem 1.6rem;border-bottom:1px solid var(--line)}
.dr-h h2{font-size:1.6rem}
.dr-b{padding:1.6rem;overflow-y:auto;flex:1;display:grid;gap:1.4rem;align-content:start}
.dr-f{padding:1rem 1.6rem;border-top:1px solid var(--line);display:flex;gap:.7rem;flex-wrap:wrap}
.cmptable{width:100%;border-collapse:collapse;font-size:.9rem}
.cmptable th,.cmptable td{padding:.8rem .6rem;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.cmptable th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);width:28%}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);opacity:0;visibility:hidden;z-index:170;width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border-radius:28px;box-shadow:var(--shadow-lg);padding:1.8rem;transition:all .45s var(--ease)}
.modal.on{transform:translate(-50%,-50%);opacity:1;visibility:visible}
.pal{position:fixed;left:50%;top:12vh;transform:translate(-50%,-10px) scale(.98);opacity:0;visibility:hidden;z-index:180;width:min(640px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line-2);border-radius:24px;box-shadow:var(--shadow-lg);overflow:hidden;transition:all .35s var(--ease)}
.pal.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.pal-in{display:flex;align-items:center;gap:.8rem;padding:1rem 1.3rem;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;border:0;background:none;outline:0;font-size:1.1rem;min-width:0}
.pal-l{max-height:min(55vh,440px);overflow-y:auto;padding:.5rem}
.pal-l h6{margin:.8rem .8rem .3rem;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.pal-l button{display:flex;width:100%;gap:.8rem;align-items:center;padding:.7rem .8rem;border-radius:14px;border:0;background:none;text-align:start}
.pal-l button[aria-selected="true"],.pal-l button:hover{background:var(--brand-soft);color:var(--brand)}
.pal-l small{margin-inline-start:auto;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);background:var(--ink);color:var(--bg);padding:.8rem 1.3rem;border-radius:999px;z-index:300;font-weight:620;font-size:.92rem;transition:transform .5s var(--ease);max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0)}

/* reveal (resting state is fully visible) */
.rv{animation:rvin .8s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rvin{from{opacity:.001;transform:translateY(22px)}}
.view{animation:viewin .5s var(--ease) both}
@keyframes viewin{from{opacity:.001;transform:translateY(10px)}}

/* ---------- chat ---------- */
.fab{position:fixed;inset-inline-end:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:140;display:flex;align-items:center;gap:.7rem;background:linear-gradient(135deg,var(--cta),#e8872b);color:var(--on-cta);border:0;border-radius:999px;padding:.4rem 1.3rem .4rem .45rem;font-weight:700;box-shadow:0 14px 40px rgb(232 135 43 / 45%);transition:transform .4s var(--ease)}
[dir="rtl"] .fab{padding:.4rem .45rem .4rem 1.3rem}
.fab:hover{transform:translateY(-3px) scale(1.03)}
.fab img{width:44px;height:44px;background:#fff;border-radius:50%;padding:5px}
.fab::before{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgb(232 135 43 / 55%);animation:ring 2.6s infinite}
@keyframes ring{70%,100%{box-shadow:0 0 0 18px rgb(232 135 43 / 0%)}}
.fab .nudge{position:absolute;inset-inline-end:.4rem;top:-.35rem;background:#e23b3b;color:#fff;font-size:.75rem;font-weight:800;border-radius:99px;padding:.1rem .45rem;border:2px solid var(--bg)}
.chat{position:fixed;inset-inline-end:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:145;width:min(420px,calc(100vw - 24px));height:min(700px,calc(100dvh - 40px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:28px;box-shadow:var(--shadow-lg);overflow:hidden;transform-origin:bottom right;transform:scale(.9) translateY(24px);opacity:0;visibility:hidden;transition:all .5s var(--ease)}
[dir="rtl"] .chat{transform-origin:bottom left}
.chat.on{transform:none;opacity:1;visibility:visible}
.chat.max{width:min(980px,calc(100vw - 24px));height:calc(100dvh - 40px)}
.ch-head{position:relative;display:flex;align-items:center;gap:.8rem;padding:1rem 1.1rem;background:linear-gradient(120deg,var(--band),#0b5ea8);color:#fff;overflow:hidden}
.ch-head::after{content:'';position:absolute;inset-inline-end:-30px;top:-40px;width:150px;height:150px;background:url(img/symbol.png?v=mvdpfoju) center/contain no-repeat;opacity:.14}
.ch-av{width:44px;height:44px;border-radius:50%;background:#fff;padding:5px;flex:none;position:relative}
.ch-av::after{content:'';position:absolute;inset-inline-end:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#52d37e;border:2px solid var(--band)}
.ch-head b{display:block;line-height:1.2}.ch-head small{color:var(--on-band-2);font-size:.78rem}
.ch-tools{margin-inline-start:auto;display:flex;gap:.2rem;position:relative;z-index:1}
.ch-tools button{width:36px;height:36px;border-radius:50%;border:0;background:rgb(255 255 255 / 10%);color:#fff;display:grid;place-items:center}
.ch-tools button:hover{background:rgb(255 255 255 / 22%)}
.ch-body{flex:1;overflow-y:auto;padding:1.1rem;display:flex;flex-direction:column;gap:.8rem;background:radial-gradient(900px 300px at 100% 0,var(--brand-soft),transparent 60%),var(--bg);scroll-behavior:smooth}
.msg{max-width:90%;display:flex;gap:.6rem;align-items:flex-end}
.msg.u{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:30px;height:30px;border-radius:50%;background:#fff;padding:3px;flex:none;border:1px solid var(--line)}
.bub{padding:.75rem 1rem;border-radius:20px;font-size:.94rem;line-height:1.5;min-width:0}
.msg.a .bub{background:var(--surface);border:1px solid var(--line);border-end-start-radius:6px;box-shadow:var(--shadow)}
.msg.u .bub{background:linear-gradient(135deg,var(--brand),#0b7fd0);color:var(--on-brand);border-end-end-radius:6px}
html[data-theme="dark"] .msg.u .bub{background:linear-gradient(135deg,#2f7fc4,#5aa9ec);color:#04172a}
.bub a{font-weight:650}
.bub p+p{margin-top:.5rem}
.bub ul{margin:.4rem 0 0;padding-inline-start:1.1rem}
.cw{flex:1;min-width:0;display:grid;gap:.5rem}
.src{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.src button{font-size:.75rem;font-weight:650;background:var(--brand-soft);color:var(--brand);border:0;border-radius:999px;padding:.2rem .65rem;display:inline-flex;gap:.3rem;align-items:center}
.fb{display:flex;gap:.3rem;margin-top:.5rem}
.fb button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.15rem .6rem;font-size:.75rem;color:var(--ink-3);display:inline-flex;gap:.3rem;align-items:center}
.fb button:hover,.fb button.on{border-color:var(--ok);color:var(--ok)}
.qr{display:flex;gap:.5rem;flex-wrap:wrap;padding-inline-start:2.4rem}
.qr button{background:var(--surface);border:1.5px solid var(--brand);color:var(--brand);border-radius:999px;padding:.4rem .95rem;font-size:.86rem;font-weight:650;transition:all .25s var(--ease);animation:rvin .5s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
.qr button:hover{background:var(--brand);color:var(--on-brand);transform:translateY(-2px)}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:1.2rem;display:grid;gap:1rem;box-shadow:var(--shadow)}
.welcome .tiles{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.tile{display:flex;gap:.6rem;align-items:center;text-align:start;background:var(--surface-2);border:1px solid transparent;border-radius:16px;padding:.7rem .8rem;font-size:.86rem;font-weight:650;transition:all .3s var(--ease)}
.tile:hover{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);transform:translateY(-2px)}
.tile .ic{color:var(--brand);width:1.3em;height:1.3em}
.mini-c{display:grid;grid-template-columns:76px 1fr;gap:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.6rem;margin-top:.6rem}
.mini-c img{width:76px;height:76px;object-fit:cover;border-radius:12px}
.mini-c b{font-size:.88rem;line-height:1.25;display:block}
.mini-c small{color:var(--ink-2);display:block}
.mini-c .row{margin-top:.4rem;gap:.4rem}
.cost-c{margin-top:.6rem;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.cost-c .hd{padding:.7rem .9rem;background:var(--surface-2);font-weight:700;font-size:.86rem}
.cost-c li{display:flex;justify-content:space-between;gap:1rem;padding:.5rem .9rem;border-top:1px solid var(--line);font-size:.88rem;list-style:none}
.cost-c ul{margin:0;padding:0}
.cost-c .tt{background:var(--brand-soft);font-weight:800;color:var(--brand)}
.typing{display:inline-flex;gap:5px;padding:.3rem 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{40%{transform:translateY(-5px);opacity:.4}}
.ch-in{display:flex;gap:.5rem;align-items:flex-end;padding:.8rem;border-top:1px solid var(--line);background:var(--surface)}
.ch-in textarea{flex:1;min-width:0;resize:none;border:1.5px solid var(--line-2);border-radius:20px;padding:.7rem 1rem;background:var(--bg);max-height:110px;min-height:46px;line-height:1.4}
.ch-in textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.ch-in .send{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--cta),#e8872b);color:var(--on-cta);display:grid;place-items:center;flex:none;transition:transform .3s var(--ease)}
.ch-in .send:hover{transform:scale(1.08) rotate(-8deg)}
.ch-foot{font-size:.75rem;color:var(--ink-3);text-align:center;padding:0 1rem .7rem;background:var(--surface)}
.hform{display:grid;gap:.6rem;margin-top:.6rem}
.hform input{border:1.5px solid var(--line-2);background:var(--bg);border-radius:12px;padding:.6rem .8rem;width:100%;min-height:42px}
.hform label.cons{display:flex;gap:.5rem;font-size:.8rem;color:var(--ink-2);align-items:flex-start}
.hform label.cons input{width:18px;min-height:0;accent-color:var(--brand);margin-top:.15rem}

/* ---------- portals ---------- */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 120px)}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:1.3rem .9rem;display:flex;flex-direction:column;gap:.2rem;position:sticky;top:calc(var(--nav-h) + 40px);align-self:start;height:calc(100vh - var(--nav-h) - 40px);overflow-y:auto}
.side h4{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:.9rem .8rem .3rem}
.side button{display:flex;align-items:center;gap:.75rem;width:100%;text-align:start;background:none;border:0;padding:.7rem .85rem;border-radius:14px;font-weight:620;color:var(--ink-2);min-height:46px}
.side button:hover{background:var(--surface-2);color:var(--ink)}
.side button[aria-current="true"]{background:var(--brand-soft);color:var(--brand)}
.side .cnt{margin-inline-start:auto;background:var(--cta);color:var(--on-cta);border-radius:99px;font-size:.75rem;padding:.05rem .5rem;font-weight:700}
.side .who{display:flex;gap:.7rem;align-items:center;padding:.6rem .8rem 1rem;border-bottom:1px solid var(--line);margin-bottom:.5rem}
.main{padding:clamp(1.2rem,3vw,2.4rem);min-width:0;background:var(--bg)}
.pg{display:none}.pg.on{display:block;animation:viewin .4s var(--ease) both}
.ptitle{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem}
.ptitle h1{font-size:clamp(1.8rem,3vw,2.5rem)}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:1.2rem;align-items:start}
.cols>*{min-width:0}
.tracker{display:flex;position:relative;margin:1.6rem 0 .4rem}
.tracker::before{content:'';position:absolute;inset-inline:5%;top:18px;height:3px;background:var(--line-2)}
.tstep{flex:1;text-align:center;position:relative;font-size:.8rem;font-weight:650;color:var(--ink-3)}
.tstep .d{width:38px;height:38px;border-radius:50%;margin:0 auto .5rem;background:var(--surface);border:3px solid var(--line-2);display:grid;place-items:center;position:relative;z-index:1}
.tstep.done .d{background:var(--ok);border-color:var(--ok);color:#fff}
.tstep.cur .d{border-color:var(--cta);color:var(--cta);box-shadow:0 0 0 7px var(--cta-soft)}
.tstep.cur{color:var(--ink)}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
.tlist li{display:grid;grid-template-columns:40px 1fr;gap:.8rem}
.tlist small{color:var(--ink-3)}
.offer{background:linear-gradient(135deg,var(--band),var(--brand));color:#fff;border-radius:22px;padding:1.6rem;position:relative;overflow:hidden}
.offer::after{content:'';position:absolute;inset-inline-end:-30px;bottom:-40px;width:190px;height:190px;background:url(img/symbol.png?v=mvdpfoju) center/contain no-repeat;opacity:.18}
.offer small{color:var(--on-band-2)}.offer .big{font-family:var(--f-display);font-size:2.4rem;font-weight:600;line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.2rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.2rem 1.3rem}
.kpi small{color:var(--ink-2);font-weight:650;font-size:.82rem}
.kpi b{display:block;font-family:var(--f-display);font-size:2.1rem;font-weight:600;line-height:1.15}
.kpi .d{font-size:.8rem;font-weight:700;color:var(--ok)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px}
table.t{width:100%;border-collapse:collapse;font-size:.92rem;min-width:640px}
.t th{text-align:start;padding:.85rem 1.1rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.t td{padding:.85rem 1.1rem;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr[data-ap],.t tbody tr.clk{cursor:pointer}
.t tbody tr:hover td{background:var(--surface-2)}
.whoi{display:flex;gap:.7rem;align-items:center}
.whoi .avatar{width:36px;height:36px;font-size:.78rem}
.whoi small{display:block;color:var(--ink-3)}
.bars{display:grid;gap:.85rem}
.bar{display:grid;grid-template-columns:110px 1fr 56px;gap:.8rem;align-items:center;font-size:.9rem}
.bar .tr{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--sky))}
.bar b{text-align:end}
.chart text{fill:var(--ink-3);font-family:var(--f-body)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:.95rem}
.feed li{display:flex;gap:.8rem;align-items:flex-start;font-size:.92rem}
.q-row{display:flex;gap:.8rem;align-items:center;justify-content:space-between;padding:.8rem 0;border-bottom:1px solid var(--line);font-size:.92rem}
.q-row:last-child{border:0}
.review{display:grid;grid-template-columns:340px 1fr;gap:1.2rem;align-items:start}
.qlist{display:grid;gap:.5rem}
.qitem{display:flex;gap:.8rem;align-items:center;padding:.85rem;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:start;width:100%}
.qitem[aria-current="true"]{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.editor{display:grid;grid-template-columns:1fr 300px;gap:1.2rem;align-items:start}
.rte{border:1.5px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--surface)}
.rte .bar-t{display:flex;gap:.2rem;padding:.4rem;border-bottom:1px solid var(--line);background:var(--surface-2)}
.rte .bar-t button{width:34px;height:34px;border:0;background:none;border-radius:8px;font-weight:700}
.rte .area{padding:1rem;min-height:140px;font-size:.95rem}
.login-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:1.2rem 0}
.login-tabs button{border:1.5px solid var(--line-2);background:var(--surface);border-radius:14px;padding:.7rem .3rem;font-weight:650;font-size:.82rem;display:grid;gap:.3rem;justify-items:center}
.login-tabs button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.9rem}
.sw{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.sw i{display:block;height:84px}.sw div{padding:.7rem .9rem;font-size:.82rem}.sw b{display:block}.sw code{color:var(--ink-3)}

/* responsive */
@media (max-width:1120px){
  .nav{display:none}.burger{display:inline-grid}.kbd-btn span{display:none}
  .hero-in{grid-template-columns:1fr}.hero-side{display:none}
  .layout,.calc{grid-template-columns:1fr}.aside,.sum{position:static}
  .apply{grid-template-columns:230px minmax(0,1fr)}.apply>aside:last-child{grid-column:1/-1}
  .foot .g{grid-template-columns:1fr 1fr 1fr}
  .paths{grid-template-columns:repeat(2,1fr)}
  .cols,.review,.editor{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}
  .news-grid{grid-template-columns:1fr 1fr}.news-grid>:first-child{grid-column:1/-1}
}
@media (max-width:820px){
  :root{--nav-h:66px}
  .util .tag span,.util .hide-m{display:none}
  .stats-in{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-inline-start:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}
  .split,.cta-band,.grid3,.grid2{grid-template-columns:1fr}
  .cta-band .row{justify-content:flex-start}
  .bento{grid-template-columns:1fr 1fr}.bt.col-a,.bt.col-b,.bt.col-c,.bt.col-d{grid-column:span 2;grid-row:auto}
  .journey{grid-template-columns:1fr;gap:1.2rem}.journey::before{display:none}
  .jstep{display:grid;grid-template-columns:56px 1fr;text-align:start;gap:0 1rem;align-items:center}.jstep .n{margin:0;grid-row:span 2}
  .catalog{grid-template-columns:1fr}.filters{position:static}
  .apply{grid-template-columns:1fr}.steps{position:static;grid-auto-flow:column;overflow-x:auto;grid-auto-columns:max-content}.steps .l{display:none}.steps li.cur .l{display:inline}
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:.5rem}
  .side h4,.side .who{display:none}.side button{width:auto;white-space:nowrap}
  .finder{grid-template-columns:1fr}
  .foot .g{grid-template-columns:1fr 1fr}
  .job{grid-template-columns:48px 1fr}.job>.btn{grid-column:1/-1}.job .lg{width:48px;height:48px}
  .news-grid{grid-template-columns:1fr}
  .cal>div{min-height:60px;padding:.3rem}.cal .ev{font-size:.75rem}
  .chat,.chat.max{inset:0;width:100%;height:100dvh;border-radius:0}
  .login-tabs{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){
  .paths,.kpis{grid-template-columns:1fr}.foot .g{grid-template-columns:1fr}
  .tracker{overflow-x:auto;padding-bottom:.5rem}.tstep{min-width:84px}
  .bar{grid-template-columns:88px 1fr 44px}
  .kv{grid-template-columns:1fr 1fr}
  .fab span{display:none}.fab{padding:.4rem}
  .bento{grid-template-columns:1fr}.bt.col-a,.bt.col-b,.bt.col-c,.bt.col-d{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .mq{animation:none}.slide img{transform:none!important}
}

/* components restored from the first pass (cards, panels, popovers, page header) */
/* courses */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1.4rem}
.cc{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:transform .45s var(--ease),box-shadow .45s,border-color .3s}
.cc:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--line-2)}
.cc .im{position:relative;aspect-ratio:16/10;overflow:hidden}
.cc .im img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.cc:hover .im img{transform:scale(1.08)}
.cc .im::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgb(5 25 45 / 55%))}
.lvl{position:absolute;inset-inline-start:14px;top:14px;z-index:1;background:var(--glass);backdrop-filter:blur(10px);color:var(--ink);font-weight:700;font-size:.78rem;border-radius:999px;padding:.28rem .8rem;border:1px solid var(--line)}
.fld-tag{position:absolute;inset-inline-end:14px;top:14px;z-index:1;background:var(--cta);color:var(--on-cta);font-weight:700;font-size:.75rem;border-radius:999px;padding:.28rem .7rem}
.cc .bd{padding:1.25rem 1.35rem 1.35rem;display:flex;flex-direction:column;gap:.6rem;flex:1}
.cc h3{font-size:1.1rem;line-height:1.28}
.cc h3 a{color:var(--ink);text-decoration:none}
.cc h3 a::after{content:'';position:absolute;inset:0;z-index:0}
.meta{display:flex;gap:.5rem 1rem;flex-wrap:wrap;font-size:.86rem;color:var(--ink-2)}
.meta span{display:inline-flex;gap:.4rem;align-items:center}
.cc .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:end;gap:.6rem;padding-top:.9rem;border-top:1px solid var(--line)}
.price small{display:block;font-size:.75rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.price b{font-family:var(--f-display);font-size:1.5rem;font-weight:600}
.cmp{position:relative;z-index:2;display:inline-flex;gap:.5rem;align-items:center;font-size:.84rem;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:36px}
.cmp input{width:18px;height:18px;accent-color:var(--brand)}
.arrow-c{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);transition:background .3s,color .3s,transform .4s var(--ease)}
.cc:hover .arrow-c{background:var(--brand);color:var(--on-brand);transform:translateX(3px)}
[dir="rtl"] .cc:hover .arrow-c{transform:scaleX(-1) translateX(3px)}

/* generic cards, split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,5rem);align-items:center}
.checks{list-style:none;margin:1.4rem 0 0;padding:0;display:grid;gap:.8rem}
.checks li{display:flex;gap:.8rem;align-items:flex-start}
.checks .ic{color:var(--ok);margin-top:.25rem;stroke-width:2.6}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:1.6rem}
.panel+.panel{margin-top:1.2rem}
.stack{display:grid;gap:1rem}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:1.6rem;display:flex;flex-direction:column;gap:1rem;position:relative}
.tcard::before{content:'“';position:absolute;inset-inline-end:1.2rem;top:.2rem;font:700 5rem/1 var(--f-display);color:var(--brand);opacity:.14}
.tcard blockquote{margin:0;color:var(--ink-2);font-size:.97rem}
.tcard .who{display:flex;gap:.8rem;align-items:center;margin-top:auto}
.tcard .who b{display:block;font-size:.95rem}.tcard .who small{color:var(--ink-3)}
.medal{display:inline-flex;gap:.4rem;align-items:center;background:var(--cta-soft);color:var(--cta);font-weight:700;font-size:.78rem;border-radius:999px;padding:.2rem .7rem}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--brand));color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none}
.ai-demo{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow-lg);overflow:hidden}
.news-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:1.2rem}
.ncard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;text-decoration:none;color:var(--ink);transition:transform .4s var(--ease),box-shadow .4s}
.ncard:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.ncard .nb{padding:1.3rem;display:grid;gap:.5rem}
.ncard time{font-size:.78rem;font-weight:700;color:var(--cta);letter-spacing:.06em;text-transform:uppercase}
.ncard h3{font-size:1.05rem}
.ncard p{color:var(--ink-2);font-size:.9rem}
.ncard .ph{aspect-ratio:16/8;background:linear-gradient(135deg,var(--brand),var(--sky));position:relative;overflow:hidden}
.ncard .ph img{width:100%;height:100%;object-fit:cover}
.cta-band{position:relative;overflow:hidden;border-radius:34px;padding:clamp(2.2rem,5vw,4.5rem);background:linear-gradient(120deg,#08416f,#0b5ea8 55%,#1d8fc9);color:#fff;display:grid;grid-template-columns:1.3fr 1fr;gap:2rem;align-items:center}
.cta-band::before{content:'';position:absolute;inset-inline-end:-80px;top:-80px;width:420px;height:420px;background:url(img/symbol.png?v=mvdpfoju) center/contain no-repeat;opacity:.16;filter:blur(1px)}
.cta-band p{color:rgb(255 255 255 / 82%);margin-top:.8rem}
.cta-band .row{position:relative;justify-content:flex-end}
[dir="rtl"] .cta-band .row{justify-content:flex-start}

/* page header */
.phead{position:relative;color:#fff;background:linear-gradient(120deg,var(--band),#0b5ea8);overflow:hidden;isolation:isolate}
.phead .bgimg{position:absolute;inset:0;z-index:-2;opacity:.35}
.phead .bgimg img{width:100%;height:100%;object-fit:cover}
.phead::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgb(5 33 58 / 94%),rgb(8 65 111 / 70%))}
.phead::after{content:'';position:absolute;inset-inline-end:-60px;top:-70px;width:340px;height:340px;background:url(img/symbol.png?v=mvdpfoju) center/contain no-repeat;opacity:.12}
.phead .wrap{padding-block:clamp(2.4rem,5vw,4.2rem)}
.phead h1{font-size:clamp(2.1rem,4.6vw,3.6rem);margin-top:.9rem;max-width:20ch}
.phead p{color:rgb(255 255 255 / 80%);max-width:62ch;margin-top:.9rem;font-size:1.08rem}
.crumbs{display:flex;gap:.5rem;align-items:center;font-size:.84rem;color:rgb(255 255 255 / 70%);flex-wrap:wrap}
.crumbs a{color:#fff;text-decoration:none}.crumbs a:hover{text-decoration:underline}
.crumbs .ic{width:.8em;height:.8em}
.lang-note{display:flex;gap:.7rem;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:.7rem 1rem;font-size:.88rem;margin-bottom:1.5rem;font-weight:550}

.pop{position:absolute;inset-inline-end:0;top:calc(100% + 8px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:.5rem;min-width:220px;z-index:120;display:none}
.pop.on{display:block;animation:pop .28s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.pop button,.pop a{display:flex;width:100%;align-items:center;gap:.7rem;padding:.6rem .8rem;border-radius:12px;background:none;border:0;color:var(--ink)!important;text-align:start;font-size:.92rem;text-decoration:none}
.pop button:hover,.pop a:hover{background:var(--brand-soft)!important}
.pop [aria-checked="true"]{background:var(--brand-soft)}
.pop [aria-checked="true"]::after{content:'✓';margin-inline-start:auto;color:var(--brand);font-weight:700}
.pop small{margin-inline-start:auto;color:var(--ink-3)}
.rel{position:relative}

.slides{position:absolute;inset:0;z-index:-2;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.8s ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover}
.hero::before{content:'';position:absolute;inset:0;z-index:-1}
.stats-in,.gcard,.bento{display:none}

/* PBRS International, luxury layer.
   Concept: an editorial, cinematic school site. Huge high-contrast serif, tiny tracked-caps microtype, hairlines, full-bleed photography.
   Every colour is taken from the PBRS logo: wordmark blue #005699, symbol sky #1f93d7, lime #9ccb51, orange #fc981e.
   The symbol's sky > lime > orange sweep is the one signature gradient; orange is the single action colour. */
:root{
  --bg:#f3f8fd; --bg-2:#e5eff9; --surface:#ffffff; --surface-2:#edf4fb; --glass:rgb(255 255 255 / 70%);
  --ink:#041b33; --ink-2:#3d546c; --ink-3:#566c83; --line:rgb(4 27 51 / 12%); --line-2:rgb(4 27 51 / 24%);
  --brand:#005699; --brand-strong:#003b6b; --brand-soft:#dcebf8; --on-brand:#ffffff; --link:#005699;
  --sky:#1f93d7; --lime:#9ccb51; --orange:#fc981e;
  --cta:#fc981e; --cta-hover:#ffad47; --on-cta:#2a1400; --cta-ink:#b45309; --cta-soft:#fff0dc;
  --ok:#1b7f45; --ok-soft:#dff3e7; --warn:#97600a; --warn-soft:#fbefd2; --crit:#b3302a; --crit-soft:#fbe4e2;
  --band:#00335c; --on-band:#ffffff; --on-band-2:#b8d0ea;
  --sig:linear-gradient(100deg,#1f93d7 0%,#9ccb51 52%,#fc981e 100%);
  --hero-ov:linear-gradient(180deg,rgb(0 20 40 / 62%) 0%,rgb(0 30 58 / 20%) 38%,rgb(0 20 40 / 82%) 100%);
  --shadow:0 1px 2px rgb(4 27 51 / 6%),0 14px 40px rgb(4 27 51 / 9%);
  --shadow-lg:0 4px 10px rgb(4 27 51 / 8%),0 40px 90px rgb(4 27 51 / 22%);
  --glow:0 0 0 1px rgb(255 255 255 / 55%) inset;
  --r:4px; --r-sm:3px; --r-lg:6px;
  --ease:cubic-bezier(.16,1,.3,1);
  --f-display:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif;
  --f-body:'Manrope','Segoe UI',system-ui,sans-serif;
  --nav-h:84px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#02101f; --bg-2:#04182d; --surface:#06213c; --surface-2:#0a2b4b; --glass:rgb(6 33 60 / 62%);
  --ink:#eef5fc; --ink-2:#adbed1; --ink-3:#8da2b8; --line:rgb(238 245 252 / 12%); --line-2:rgb(238 245 252 / 24%);
  --brand:#4fb0ee; --brand-strong:#9bd0f5; --brand-soft:#0a2f52; --on-brand:#02172b; --link:#6bbdf2;
  --cta-ink:#fc981e; --cta-soft:#3a2208;
  --ok:#5cc88a; --ok-soft:#10301f; --warn:#e7b24a; --warn-soft:#382c0d; --crit:#f08a82; --crit-soft:#3b1917;
  --band:#031f3a; --shadow:0 1px 2px rgb(0 0 0 / 40%),0 14px 40px rgb(0 0 0 / 40%); --shadow-lg:0 40px 100px rgb(0 0 0 / 65%);
  --glow:0 0 0 1px rgb(255 255 255 / 7%) inset; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#02101f; --bg-2:#04182d; --surface:#06213c; --surface-2:#0a2b4b; --glass:rgb(6 33 60 / 62%);
  --ink:#eef5fc; --ink-2:#adbed1; --ink-3:#8da2b8; --line:rgb(238 245 252 / 12%); --line-2:rgb(238 245 252 / 24%);
  --brand:#4fb0ee; --brand-strong:#9bd0f5; --brand-soft:#0a2f52; --on-brand:#02172b; --link:#6bbdf2;
  --cta-ink:#fc981e; --cta-soft:#3a2208;
  --ok:#5cc88a; --ok-soft:#10301f; --warn:#e7b24a; --warn-soft:#382c0d; --crit:#f08a82; --crit-soft:#3b1917;
  --band:#031f3a; --shadow:0 1px 2px rgb(0 0 0 / 40%),0 14px 40px rgb(0 0 0 / 40%); --shadow-lg:0 40px 100px rgb(0 0 0 / 65%);
  --glow:0 0 0 1px rgb(255 255 255 / 7%) inset; color-scheme:dark}
html[lang="zh"]{--f-display:'Noto Serif SC','Songti SC',serif;--f-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
html[lang="hi"]{--f-display:'Noto Serif Devanagari',serif;--f-body:'Noto Sans Devanagari','Manrope',sans-serif}
html[lang="ar"]{--f-display:'Noto Naskh Arabic',serif;--f-body:'Noto Sans Arabic','Manrope',sans-serif}

/* type: huge serif + tiny tracked caps */
body{font-family:var(--f-body);font-size:16px;font-weight:450;letter-spacing:.005em}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:500;letter-spacing:-.025em}
h1{font-size:clamp(3rem,9.5vw,9rem);line-height:.92}
h2{font-size:clamp(2.2rem,5.4vw,4.8rem);line-height:1}
h3{font-size:1.5rem;line-height:1.1}
html[lang="zh"] h1,html[lang="zh"] h2,html[lang="hi"] h1,html[lang="hi"] h2,html[lang="ar"] h1,html[lang="ar"] h2{letter-spacing:0;line-height:1.2;font-weight:600}
.disp i,h1 i,h2 i,h3 i,.it{font-style:italic;font-weight:400}
.eyebrow,.micro{font-size:.75rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);display:inline-flex;gap:.9rem;align-items:center}
.eyebrow::before{content:'';width:40px;height:1px;background:var(--ink-3)}
html[lang="zh"] .eyebrow,html[lang="hi"] .eyebrow,html[lang="ar"] .eyebrow,html[lang="zh"] .micro,html[lang="hi"] .micro,html[lang="ar"] .micro{letter-spacing:.06em;text-transform:none}
.lead{font-size:1.2rem;line-height:1.65;color:var(--ink-2);max-width:56ch;font-weight:450}
.rule{height:1px;background:var(--line);border:0;margin:0}
.sig{height:2px;background:var(--sig);border:0;margin:0}
.grad-text{background:var(--sig);-webkit-background-clip:text;background-clip:text;color:transparent}
.r-0{border-radius:0}
.btn{border-radius:0;text-transform:uppercase;letter-spacing:.16em;font-size:.76rem;font-weight:700;min-height:50px;padding:.8rem 1.8rem}
html[lang="zh"] .btn,html[lang="hi"] .btn,html[lang="ar"] .btn{letter-spacing:.04em;text-transform:none;font-size:.95rem}
.btn-cta{background:var(--cta);color:var(--on-cta)}
html[data-theme="dark"] .btn-cta{background:var(--cta)}
.btn-cta:hover{background:var(--cta-hover);box-shadow:0 12px 36px rgb(252 152 30 / 40%)}
.btn-line{background:transparent;border:1px solid var(--line-2);color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-glass{background:transparent;border:1px solid rgb(255 255 255 / 45%);color:#fff;backdrop-filter:none}
.btn-glass:hover{background:#fff;color:#02172b}
.btn-sm{min-height:42px;padding:.5rem 1.2rem;font-size:.75rem}
.btn-brand{border-radius:0}
.btn .ic{width:1.3em;height:1.3em}
.circ{display:inline-grid;place-items:center;border-radius:50%;background:var(--cta);color:var(--on-cta);width:84px;height:84px;text-transform:uppercase;letter-spacing:.14em;font-size:.75rem;font-weight:800;text-decoration:none;text-align:center;border:0;transition:transform .5s var(--ease)}
.icon-btn{border-radius:50%;background:transparent;border:1px solid var(--line-2)}

/* preloader */
.pre{position:fixed;inset:0;z-index:500;background:#02101f;color:#fff;display:grid;place-items:center;transition:transform .9s var(--ease) .15s;will-change:transform}
.pre.out{transform:translateY(-100%)}
.pre-in{display:grid;justify-items:center;gap:1.6rem;transition:opacity .4s}
.pre.out .pre-in{opacity:0}
.pre img{width:min(260px,60vw)}
.pre-bar{width:min(260px,60vw);height:1px;background:rgb(255 255 255 / 20%);position:relative;overflow:hidden}
.pre-bar i{position:absolute;inset:0;background:var(--sig);transform:scaleX(0);transform-origin:0 50%}
.pre-n{font:500 .72rem var(--f-body);letter-spacing:.3em;color:rgb(255 255 255 / 60%)}

/* cursor */
.cur{position:fixed;left:0;top:0;z-index:400;pointer-events:none;mix-blend-mode:normal;opacity:0;transition:opacity .3s}
.cur.on{opacity:1}
.cur-dot{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--cta)}
.cur-ring{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:1px solid var(--cta);display:grid;place-items:center;transition:width .4s var(--ease),height .4s var(--ease),margin .4s var(--ease),background .3s}
.cur-ring span{font-size:.75rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--on-cta);opacity:0;transition:opacity .2s}
.cur.big .cur-ring{width:92px;height:92px;margin:-46px 0 0 -46px;background:var(--cta)}
.cur.big .cur-ring span{opacity:1}
.cur.big .cur-dot{opacity:0}
@media (hover:none),(pointer:coarse){.cur{display:none}}

/* header */
#progress{background:var(--sig);height:2px}
.top{position:fixed;inset:0 0 auto 0;top:0;z-index:120}
.hdr{background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;color:#fff;transition:background .5s var(--ease),color .4s,transform .6s var(--ease),border-color .4s;border-bottom:1px solid transparent}
.hdr .wrap{max-width:none;padding-inline:clamp(20px,3.2vw,56px);min-height:var(--nav-h);display:flex;align-items:center;gap:1.4rem}
.hdr.solid{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);color:var(--ink);border-color:var(--line)}
.hdr.hide{transform:translateY(-100%)}
.brand{display:block;line-height:0}
.brand img{height:54px;width:auto}
.brand .on-light{display:none}
.hdr.solid .brand .on-light{display:block}.hdr.solid .brand .on-dark{display:none}
html[data-theme="dark"] .hdr.solid .brand .on-light{display:none}html[data-theme="dark"] .hdr.solid .brand .on-dark{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hdr.solid .brand .on-light{display:none}:root:not([data-theme="light"]) .hdr.solid .brand .on-dark{display:block}}
.hdr-r{margin-inline-start:auto;display:flex;align-items:center;gap:.4rem}
.hdr .hl{display:inline-flex;align-items:center;gap:.5rem;background:none;border:0;color:inherit;text-decoration:none;font-size:.75rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:.6rem .8rem;min-height:44px;position:relative}
html[lang="zh"] .hdr .hl,html[lang="hi"] .hdr .hl,html[lang="ar"] .hdr .hl{letter-spacing:.04em;text-transform:none;font-size:.9rem}
.hdr .hl::after{content:'';position:absolute;inset-inline:.8rem;bottom:.35rem;height:1px;background:currentColor;transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ease)}
.hdr .hl:hover::after{transform:scaleX(1)}
.hdr .ib{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;color:inherit;border-radius:50%;transition:background .3s}
.hdr .ib:hover{background:rgb(255 255 255 / 14%)}
.hdr.solid .ib:hover{background:var(--brand-soft)}
.hdr .apply-l{border:1px solid currentColor;padding:.65rem 1.4rem;margin-inline:.4rem}
.hdr .apply-l::after{display:none}
.hdr .apply-l:hover{background:var(--cta);border-color:var(--cta);color:var(--on-cta)}
.menu-btn{display:inline-flex;align-items:center;gap:.9rem;background:none;border:0;color:inherit;font-size:.75rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;min-height:44px;padding:0 .4rem}
.menu-btn .bars{display:grid;gap:6px;width:30px}
.menu-btn .bars i{display:block;height:1.5px;background:currentColor;transition:transform .5s var(--ease),width .4s var(--ease)}
.menu-btn .bars i:last-child{width:62%;margin-inline-start:auto}
.menu-btn:hover .bars i:last-child{width:100%}
body.menu-open .menu-btn .bars i:first-child{transform:translateY(3.7px) rotate(45deg)}
body.menu-open .menu-btn .bars i:last-child{width:100%;transform:translateY(-3.7px) rotate(-45deg)}
.hdr .pop{color:var(--ink)}
.pop{border-radius:6px}
.pop button,.pop a{border-radius:4px}

/* full-screen menu */
.menu{position:fixed;inset:0;z-index:110;background:var(--band);color:#fff;clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path .9s var(--ease),visibility 0s .9s;overflow-y:auto}
.menu.on{clip-path:inset(0 0 0 0);visibility:visible;transition:clip-path .9s var(--ease)}
.menu-grid{display:grid;grid-template-columns:1.1fr 1fr;min-height:100%;padding-top:calc(var(--nav-h) + 1rem)}
.menu-l{padding:2rem clamp(20px,5vw,90px) 3rem;display:flex;flex-direction:column;justify-content:center}
.m-item{border-top:1px solid rgb(255 255 255 / 14%)}
.m-item:last-of-type{border-bottom:1px solid rgb(255 255 255 / 14%)}
.m-row{display:flex;align-items:baseline;gap:1.4rem;width:100%;background:none;border:0;color:inherit;text-align:start;padding:.55rem 0;text-decoration:none}
.m-row .num{font-size:.75rem;letter-spacing:.2em;color:rgb(255 255 255 / 45%);font-weight:700;min-width:2rem}
.m-row .t{font-family:var(--f-display);font-size:clamp(2.2rem,5.4vw,4.6rem);line-height:1.05;letter-spacing:-.02em;transition:transform .6s var(--ease),color .3s}
.m-row:hover .t,.m-item.open .t{transform:translateX(18px);color:var(--cta)}
[dir="rtl"] .m-row:hover .t,[dir="rtl"] .m-item.open .t{transform:translateX(-18px)}
.m-row .pl{margin-inline-start:auto;width:28px;height:28px;position:relative;opacity:.6}
.m-row .pl::before,.m-row .pl::after{content:'';position:absolute;left:50%;top:50%;width:16px;height:1.5px;background:#fff;transform:translate(-50%,-50%);transition:transform .5s var(--ease)}
.m-row .pl::after{transform:translate(-50%,-50%) rotate(90deg)}
.m-item.open .pl::after{transform:translate(-50%,-50%) rotate(0)}
.m-sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.m-item.open .m-sub{grid-template-rows:1fr}
.m-sub>div{overflow:hidden}
.m-sub nav{display:grid;grid-template-columns:1fr 1fr;gap:.2rem 1.5rem;padding:.4rem 0 1.4rem 3.4rem}
[dir="rtl"] .m-sub nav{padding:.4rem 3.4rem 1.4rem 0}
.m-sub a{color:rgb(255 255 255 / 78%);text-decoration:none;padding:.4rem 0;font-size:1rem;display:flex;gap:.6rem;align-items:center;transition:color .2s,transform .4s var(--ease)}
.m-sub a:hover{color:#fff;transform:translateX(6px)}
.m-sub a small{color:rgb(255 255 255 / 45%);font-size:.75rem;margin-inline-start:.2rem}
.menu-r{position:relative;overflow:hidden;min-height:340px}
.menu-r img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity .9s var(--ease),transform 1.6s var(--ease)}
.menu-r img.on{opacity:1;transform:scale(1)}
.menu-r::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--band),transparent 40%),linear-gradient(0deg,rgb(0 30 58 / 80%),transparent 50%)}
[dir="rtl"] .menu-r::after{background:linear-gradient(270deg,var(--band),transparent 40%),linear-gradient(0deg,rgb(0 30 58 / 80%),transparent 50%)}
.menu-r .cap{position:absolute;inset-inline:2.2rem;bottom:2rem;z-index:1}
.menu-r .cap p{font-family:var(--f-display);font-style:italic;font-size:1.8rem;line-height:1.2;max-width:22ch}
.menu-foot{display:flex;gap:1.2rem 2.4rem;flex-wrap:wrap;margin-top:2rem;font-size:.9rem;color:rgb(255 255 255 / 70%)}
.menu-foot a{color:#fff;text-decoration:none;border-bottom:1px solid rgb(255 255 255 / 30%);padding-bottom:2px}
.menu-foot a:hover{border-color:var(--cta);color:var(--cta)}

/* hero */
.hero{min-height:100vh;min-height:min(100svh,820px);display:flex;flex-direction:column;justify-content:flex-end;position:relative;color:#fff;isolation:isolate;background:#02101f;overflow:hidden}
.hero::before{background:var(--hero-ov)}
.slide img{transform:scale(1.02)}
.slide.on img{transform:scale(1.09);transition-duration:16s}
.hero .blob{display:none}
.hero-vig{position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgb(0 12 24 / 55%))}
.hero-top{position:absolute;inset-inline:0;top:calc(var(--nav-h) + 1.4rem)}
.hero-top .wrap{max-width:none;padding-inline:clamp(20px,3.2vw,56px);display:flex;justify-content:space-between;gap:1rem}
.hero-top .micro{color:rgb(255 255 255 / 75%)}
.hero-top .micro::before{background:rgb(255 255 255 / 60%)}
.hero-main{padding-block:0 3rem;text-align:center;position:relative}
.hero-main .wrap{max-width:none;padding-inline:clamp(20px,3.2vw,56px)}
.hero h1{margin:0 auto;max-width:14ch;text-shadow:0 4px 60px rgb(0 0 0 / 35%);font-size:clamp(3.2rem,10.5vw,10rem)}
.hero h1 em{font-style:italic;font-weight:400;background:var(--sig);-webkit-background-clip:text;background-clip:text;color:transparent;padding-inline:.04em}
.ln{display:block;overflow:hidden;padding-bottom:.06em}
.ln>span{display:inline-block;transform:translateY(105%);animation:lnup 1.3s var(--ease) forwards;animation-delay:calc(var(--d,0) * 120ms + var(--base,0ms))}
@keyframes lnup{to{transform:none}}
.hero .lead{color:rgb(255 255 255 / 82%);margin:1.8rem auto 0;text-align:center;font-size:1.15rem;max-width:52ch}
.hero-bar{border-top:1px solid rgb(255 255 255 / 22%);position:relative}
.hero-bar .wrap{max-width:none;padding-inline:clamp(20px,3.2vw,56px);display:grid;grid-template-columns:auto 1fr auto;gap:2rem;align-items:center;min-height:104px}
.finder{margin:0;background:transparent;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;max-width:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(150px,230px)) auto;gap:0;color:#fff;align-items:stretch}
.finder label{padding:.8rem 1.6rem;border-inline-start:1px solid rgb(255 255 255 / 22%);border-radius:0}
.finder label:first-child{border:0;padding-inline-start:0}
.finder label:hover{background:transparent}
.finder span{color:rgb(255 255 255 / 60%);font-size:.75rem;letter-spacing:.2em}
.finder select{color:#fff;font-size:1.05rem;font-weight:600}
.finder .go{align-self:center;margin-inline-start:1rem;width:54px;height:54px;border-radius:50%;border:0;background:var(--cta);color:var(--on-cta);display:grid;place-items:center;transition:transform .5s var(--ease)}
.finder .go:hover{transform:scale(1.12) rotate(-12deg)}
.scroll-cue{display:flex;align-items:center;gap:1rem;justify-content:center;font-size:.75rem;letter-spacing:.28em;text-transform:uppercase;color:rgb(255 255 255 / 70%)}
.scroll-cue i{display:block;width:1px;height:46px;background:rgb(255 255 255 / 25%);position:relative;overflow:hidden}
.scroll-cue i::after{content:'';position:absolute;left:0;top:-100%;width:1px;height:100%;background:#fff;animation:sc 2.2s var(--ease) infinite}
@keyframes sc{60%,100%{top:100%}}
.slide-n{display:flex;align-items:center;gap:1rem;justify-content:flex-end;font-size:.75rem;letter-spacing:.2em;font-weight:700}
.slide-n .bar{width:80px;height:1px;background:rgb(255 255 255 / 25%);position:relative}
.slide-n .bar i{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:0 50%}
.slide-n .bar i.run{animation:fill 6s linear forwards}
.slide-ctl{display:none}

/* sections */
.sec{padding-block:clamp(5rem,11vw,10rem)}
.sec .wrap,.wide{max-width:1440px}
.sec-head{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:end;margin-bottom:clamp(2.4rem,5vw,4.5rem)}
.sec-head h2{max-width:16ch;margin-top:1.4rem}
.sec-head .lead{margin-top:1.2rem}
.sec.dark{background:var(--band);color:#fff}
.sec.dark .lead,.sec.dark .micro,.sec.dark .eyebrow{color:rgb(255 255 255 / 70%)}
.sec.dark .eyebrow::before{background:rgb(255 255 255 / 50%)}

/* giant marquee */
.marq{overflow:hidden;padding-block:clamp(1.6rem,4vw,3rem);border-block:1px solid var(--line);background:var(--bg)}
.mq{display:flex;gap:3.5rem;animation:mq 50s linear infinite;width:max-content}
.mq span{display:inline-flex;gap:3.5rem;align-items:center;font-family:var(--f-display);font-size:clamp(3rem,8vw,7rem);line-height:1;white-space:nowrap;letter-spacing:-.02em}
.mq span::before{display:none}
.mq .o{color:transparent;-webkit-text-stroke:1px var(--ink-3)}
.mq b{color:var(--cta-ink);font-weight:500;font-style:italic}
.mq i.dia{width:14px;height:14px;transform:rotate(45deg);background:var(--sig);flex:none}

/* statement */
.statement{font-family:var(--f-display);font-size:clamp(1.9rem,4.6vw,4.2rem);line-height:1.12;letter-spacing:-.02em;max-width:26ch;font-weight:500}
.statement .w{opacity:.18;transition:opacity .5s}
.statement .w.on{opacity:1}
.statement em{font-style:italic;color:var(--brand)}
.state-grid{display:grid;grid-template-columns:200px 1fr;gap:3rem}
.state-meta{display:grid;gap:2.4rem;align-content:start}
.state-meta .n{font-family:var(--f-display);font-size:clamp(2.6rem,4.5vw,4rem);line-height:1}
.state-meta small{display:block;color:var(--ink-3);font-size:.78rem;letter-spacing:.08em;margin-top:.3rem}

/* course list with floating preview */
.clist{border-top:1px solid var(--line-2)}
.crow{display:grid;grid-template-columns:70px 1.6fr 1fr 1fr 60px;gap:1.5rem;align-items:center;padding:clamp(1.3rem,2.4vw,2.2rem) 0;border-bottom:1px solid var(--line-2);color:var(--ink);text-decoration:none;position:relative;transition:padding .6s var(--ease)}
.crow:hover{padding-inline:1.6rem}
.crow::before{content:'';position:absolute;inset:0;background:var(--brand-soft);transform:scaleY(0);transform-origin:bottom;transition:transform .6s var(--ease);z-index:-1}
.crow:hover::before{transform:scaleY(1)}
.crow .ix{font-size:.75rem;letter-spacing:.2em;color:var(--ink-3);font-weight:700}
.crow .ti{font-family:var(--f-display);font-size:clamp(1.6rem,3.2vw,3rem);line-height:1.08;letter-spacing:-.02em}
.crow .ti small{display:block;font-family:var(--f-body);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:.5rem;font-weight:700}
.crow .m{font-size:.92rem;color:var(--ink-2)}
.crow .m b{display:block;font-size:1.2rem;font-family:var(--f-display);font-weight:500;color:var(--ink)}
.crow .ar{width:54px;height:54px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;transition:all .5s var(--ease)}
.crow:hover .ar{background:var(--cta);border-color:var(--cta);color:var(--on-cta);transform:rotate(-45deg)}
[dir="rtl"] .crow:hover .ar{transform:scaleX(-1) rotate(-45deg)}
.cprev{position:fixed;left:0;top:0;width:min(360px,30vw);aspect-ratio:4/5;pointer-events:none;z-index:90;overflow:hidden;opacity:0;transform:translate(-50%,-50%) scale(.85) rotate(-4deg);transition:opacity .35s,transform .45s var(--ease);box-shadow:var(--shadow-lg)}
.cprev.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
/* parked off-screen when idle: in right-to-left pages its left half otherwise widened the page */
.cprev:not(.on){left:50%!important;top:50%!important;translate:-50% -50%;visibility:hidden}
.cprev img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
@media (hover:none),(pointer:coarse){.cprev{display:none}}

/* course cards (catalogue + chat) restyled */
.cc{border-radius:0;border:0;background:transparent;overflow:visible}
.cc:hover{transform:none;box-shadow:none;border-color:transparent}
.cc .im{aspect-ratio:4/5;border-radius:0}
.cc .im::after{background:linear-gradient(180deg,transparent 55%,rgb(0 20 40 / 70%))}
.cc .bd{padding:1.2rem 0 0}
.cc h3{font-size:1.7rem}
.cc .ft{border-top:1px solid var(--line-2)}
.price b{font-family:var(--f-display);font-size:1.7rem;font-weight:500}
.lvl,.fld-tag{border-radius:0;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:2.4rem 1.6rem}
.arrow-c{border-radius:50%}

/* stats */
.stats4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgb(255 255 255 / 20%)}
.stats4>div{padding:2.4rem 1.6rem 0 0;border-inline-end:1px solid rgb(255 255 255 / 14%);padding-inline-start:1.6rem}
.stats4>div:first-child{padding-inline-start:0}.stats4>div:last-child{border:0}
.stats4 b{display:block;font-family:var(--f-display);font-size:clamp(3.2rem,7vw,6.4rem);font-weight:500;line-height:1}
.stats4 b sup{font-size:.4em;color:var(--cta);vertical-align:top;margin-inline-start:.1em}
.stats4 span{display:block;color:rgb(255 255 255 / 70%);font-size:.88rem;margin-top:.8rem;max-width:22ch}

/* horizontal gallery */
.gal{display:flex;gap:1.4rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-inline:clamp(20px,3.2vw,56px);scrollbar-width:none;cursor:grab}
.gal::-webkit-scrollbar{display:none}
.gal.drag{cursor:grabbing;scroll-snap-type:none}
.gi{flex:0 0 clamp(280px,38vw,560px);scroll-snap-align:start;position:relative}
.gi .im{aspect-ratio:4/5;overflow:hidden;background:var(--surface-2)}
.gi img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease);user-select:none;-webkit-user-drag:none}
.gi:hover img{transform:scale(1.06)}
.gi .cp{display:flex;justify-content:space-between;gap:1rem;padding-top:1rem}
.gi .cp b{font-family:var(--f-display);font-size:1.6rem;font-weight:500;line-height:1.1}
.gi .cp span{font-size:.75rem;letter-spacing:.2em;font-weight:700;color:var(--ink-3)}
.gal-ctl{display:flex;gap:.6rem}

/* journey vertical */
.jr{display:grid;grid-template-columns:1fr 1.4fr;gap:clamp(2rem,6vw,7rem)}
.jr-l{position:sticky;top:calc(var(--nav-h) + 2rem);align-self:start}
.jr-l h2{margin-top:1.4rem}
.jr-list{display:grid}
.jr-i{display:grid;grid-template-columns:90px 1fr;gap:1.4rem;padding:2rem 0;border-top:1px solid var(--line-2);transition:padding .6s var(--ease)}
.jr-i:last-child{border-bottom:1px solid var(--line-2)}
.jr-i:hover{padding-inline-start:1rem}
.jr-i .n{font-family:var(--f-display);font-size:3.4rem;line-height:1;color:var(--ink-3);transition:color .4s}
.jr-i:hover .n{color:var(--cta-ink)}
.jr-i h3{font-size:2rem;margin-bottom:.4rem}
.jr-i p{color:var(--ink-2)}

/* AI section */
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,6rem);align-items:center}
.ai-demo{border-radius:6px;background:var(--surface);border:1px solid rgb(255 255 255 / 14%);box-shadow:var(--shadow-lg);color:var(--ink)}
.langs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:2rem}
.langs span{border:1px solid rgb(255 255 255 / 30%);padding:.4rem 1rem;font-size:.92rem}

/* quotes */
.q-wrap{position:relative;text-align:center;max-width:1000px;margin-inline:auto}
.q-slide{display:none}.q-slide.on{display:block;animation:viewin .9s var(--ease) both}
.q-slide blockquote{margin:0;font-family:var(--f-display);font-size:clamp(1.7rem,3.8vw,3.2rem);line-height:1.18;letter-spacing:-.015em;font-style:italic;font-weight:400}
.q-slide .who{margin-top:2rem;display:grid;gap:.3rem;justify-items:center}
.q-slide .who b{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase}
.q-slide .who small{color:var(--ink-3)}
.q-dots{display:flex;gap:.6rem;justify-content:center;margin-top:2.4rem}
.q-dots button{width:44px;height:2px;border:0;background:var(--line-2);padding:0;position:relative;overflow:hidden}
.q-dots button.on{background:var(--ink-3)}

/* news editorial */
.news{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:2.4rem 1.6rem}
.nw{display:grid;gap:1rem;text-decoration:none;color:var(--ink);align-content:start}
.nw .ph{aspect-ratio:3/2;overflow:hidden;background:linear-gradient(135deg,var(--brand),var(--sky));position:relative}
.nw:first-child .ph{aspect-ratio:4/3}
.nw .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.nw:hover .ph img{transform:scale(1.06)}
.nw time{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--cta-ink)}
.nw h3{font-size:1.9rem;line-height:1.08}
.nw p{color:var(--ink-2);font-size:.95rem}

/* CTA */
.cta-full{position:relative;min-height:80vh;display:grid;place-items:center;color:#fff;text-align:center;isolation:isolate;overflow:hidden;padding:6rem 0}
.cta-full>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.cta-full::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgb(0 20 40 / 78%),rgb(0 51 92 / 70%))}
.cta-full h2{font-size:clamp(3rem,10vw,9rem);max-width:12ch;margin-inline:auto}
.cta-full p{margin:1.6rem auto 2.4rem;color:rgb(255 255 255 / 80%);max-width:46ch;font-size:1.15rem}
.cta-band{border-radius:0}

/* footer */
.foot{background:var(--band);color:#fff;padding-block:clamp(4rem,8vw,7rem) 2rem;position:relative;overflow:hidden}
.foot::before{display:none}
.foot-top{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;gap:2rem;position:relative;z-index:1}
.foot .lg img{width:min(300px,100%)}
.foot h4{font-family:var(--f-body);font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:rgb(255 255 255 / 55%);margin-bottom:1.2rem;font-weight:700}
.foot a{display:block;color:#fff;text-decoration:none;padding:.3rem 0;font-size:.98rem;cursor:pointer;opacity:.88;transition:transform .4s var(--ease),opacity .2s}
.foot a:hover{opacity:1;transform:translateX(5px);text-decoration:none;color:var(--cta)}
.foot .giant{font-family:var(--f-display);font-size:clamp(7rem,27vw,26rem);line-height:.78;letter-spacing:-.04em;font-weight:500;margin-top:clamp(2rem,6vw,5rem);user-select:none;display:flex;justify-content:center;white-space:nowrap;overflow:hidden;direction:ltr}
.foot .giant span{display:block;overflow:hidden;padding-block:.06em .02em}
.foot .giant b{display:block;font-weight:inherit;background:linear-gradient(180deg,rgb(255 255 255 / 20%),rgb(255 255 255 / 0%));-webkit-background-clip:text;background-clip:text;color:transparent;transform:translateY(105%);transition:transform 1.1s var(--ease) calc(.13s * var(--i))}
.foot .giant.open b{transform:none}
@media (prefers-reduced-motion:reduce){.foot .giant b{transform:none;transition:none}}
.foot .legal{border-top:1px solid rgb(255 255 255 / 16%);margin-top:1.6rem;padding-top:1.4rem;font-size:.82rem;color:rgb(255 255 255 / 60%);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;position:relative;z-index:1}
.foot .sigline{height:2px;background:var(--sig);margin-bottom:3rem}
.totop{position:fixed;inset-inline-start:max(20px,env(safe-area-inset-left,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:80;border-radius:50%;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease);background:var(--surface)}
.totop.on{opacity:1;pointer-events:auto}
.totop:hover{transform:translateY(-3px)}
.finder select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:#fff;font-weight:600;width:100%;cursor:pointer;padding:.2rem 1.2rem .2rem 0;text-overflow:ellipsis;outline-offset:4px;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
[dir="rtl"] .finder select{padding:.2rem 0 .2rem 1.2rem;background-position:9px 55%,4px 55%}
.finder label{cursor:pointer}

/* inner page header */
.phead{min-height:clamp(420px,62vh,640px);display:flex;align-items:flex-end;background:#02101f;color:#fff}
.phead::after{display:none}
.phead .bgimg{opacity:1}
.phead .bgimg img{transform:scale(1.08);animation:kb 22s ease-out forwards}
@keyframes kb{to{transform:scale(1)}}
.phead::before{background:linear-gradient(180deg,rgb(0 20 40 / 70%) 0%,rgb(0 20 40 / 25%) 40%,rgb(0 20 40 / 88%) 100%)}
.phead .wrap{max-width:1440px;padding-block:0 clamp(2.6rem,5vw,4.5rem);width:100%}
.phead h1{font-size:clamp(3rem,8.6vw,8rem);max-width:15ch;margin-top:1.6rem}
.phead p{font-size:1.2rem;max-width:56ch}
.crumbs{letter-spacing:.2em;text-transform:uppercase;font-size:.75rem;font-weight:700}
.crumbs a{color:rgb(255 255 255 / 75%)}
.lang-note{border-radius:0;border-inline-start:3px solid var(--cta)}

/* inner layout polish */
.layout{max-width:1440px;grid-template-columns:minmax(0,1fr) 360px;padding-block:clamp(3rem,7vw,6rem)}
.prose{font-size:1.1rem;line-height:1.8;max-width:70ch}
.prose h2{font-size:clamp(2rem,3.4vw,3rem);margin:3rem 0 1rem}
.prose h3{font-size:1.8rem;margin:2.4rem 0 .6rem}
.prose>p:first-of-type{font-family:var(--f-display);font-size:1.7rem;line-height:1.35;color:var(--ink);letter-spacing:-.01em}
.panel,.sidecard,.filters,.tcard,.path,.job,.cinfo,.acc,.kpi,.tbl-wrap,.tl>div,.upl-row,.welcome{border-radius:var(--r-lg)}
.sidecard{box-shadow:var(--shadow);border-radius:6px}
.sum{border-radius:6px;background:linear-gradient(160deg,var(--band),#004a85)}
.chipset span{border-radius:0}.chipset input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fld input,.fld select,.fld textarea{border-radius:0;background:transparent;border-width:0 0 1px;border-color:var(--line-2);padding-inline:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{box-shadow:none;border-color:var(--cta)}
.switch,.stepper-n,.search{border-radius:0}
.search{border-width:0 0 1px;background:transparent;padding-inline:0}
.tabs button{text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;font-weight:700}
.pill{border-radius:0;letter-spacing:.06em}
.tray{border-radius:0}
.drawer,.modal,.pal{border-radius:0}
.pal{border-radius:6px}
.kv div{border-radius:0}
.job:hover{border-color:var(--cta)}
.tl .n{background:var(--ink);color:var(--bg)}
.tl::before{width:1px;background:var(--line-2)}
.steps li.cur{background:transparent;border-inline-start:2px solid var(--cta);border-radius:0}
.cal{border-radius:0}
.map{border-radius:0}

/* chat luxury tuning */
.fab{border-radius:0;background:var(--cta);color:var(--on-cta);box-shadow:0 20px 50px rgb(252 152 30 / 40%);text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;padding:.5rem 1.4rem .5rem .55rem}
.fab img{border-radius:50%}
.chat{border-radius:6px}
.ch-head{background:linear-gradient(120deg,var(--band),#004a85)}
.bub{border-radius:4px}
.msg.a .bub{border-end-start-radius:0}.msg.u .bub{border-end-end-radius:0;background:var(--brand);color:var(--on-brand)}
.ch-in textarea{border-radius:0}
.ch-in .send{border-radius:50%}
.tile,.mini-c,.cost-c{border-radius:4px}

/* reveal */
.rv{animation:none}
.js .rv{opacity:.001;transform:translateY(34px);transition:opacity 1s var(--ease),transform 1.2s var(--ease);transition-delay:calc(var(--i,0) * 90ms)}
.js .rv.in{opacity:1;transform:none}
.parallax{will-change:transform}

/* portal tweaks */
.side{border-radius:0}
.side button{border-radius:0}
.side button[aria-current="true"]{background:transparent;border-inline-start:2px solid var(--cta);color:var(--ink)}
.kpi b,.ptitle h1{font-family:var(--f-display);font-weight:500}
.ptitle h1{font-size:clamp(2.4rem,4vw,3.6rem)}

/* responsive luxury */
@media (max-width:1120px){
  .hdr .hl.hide-m{display:none}
  .menu-grid{grid-template-columns:1fr}.menu-r{display:none}
