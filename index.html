put in to ensure that our students received excellent training, that is up to date and relevant to the cookery / hospitality industry in New Zealand.\n\nCornell cookery student, Fangwei (International Diploma in Food Preparation and Cookery Supervision (Advanced) (Level 5) won Gold for Live Salmon and was the overall class winner.\n\n“This competition has been great in improving my skills and learning new different cooking techniques from my tutors and this is why I believe I was successful winning a gold medal and class winner. The training has helped me develop as a chef and gain the confidence to experiment with my culinary knowledge. The training was a great challenge, and I am looking forward to getting the best result at the national salon as well” said Fangwei. Sajith Sam (International Diploma in Food Preparation and cookery supervision (advanced) (level 5) won the highest marks with silver medal and class winner in the category – Fruit Flan. “Chef Anthony D’Cunha has taken a lot of effort to mould and guide me to the peak level. I am very glad and thank him and the other tutors in Cornell who inspired me to achieve my dreams.”\n\nPBRS Hospitality student Sojeong Hwang said, “I practiced lots of times and this training gave me confidence. Joining the competition was a good experience, I would like to try other challenges and I am sure I will get a good result again”\n\n“Our staff and students are motivated by this result and inspired to compete in the next round of the competition.” said Cornell Education Group’s Cookery and Hospitality Programme Manager Michael Corbett.\n\n“Bring on the National Salons! Well done to all the students and the team at Cornell and PBRS who helped the students get where they are today”"},{"slug":"hospitality-championships","title":"NZ Hospitality Championships 2017","date":"2017-09-12","excerpt":"Experts confirm that PBRS is the BEST It is with great pride that The Cornell Education Group accepts the award of ‘New Zealand Training Establishment of the year’ & Training Chef of the...","md":"**Experts confirm that PBRS is the BEST**\n\nIt is with great pride that The Cornell Education Group accepts the award of ‘New Zealand Training Establishment of the year’ & Training Chef of the Year for our Professional Cookery and Hospitality schools. This is an outstanding result that has demonstrated The Cornell Education Group’s professionalism and excellence in training for the cookery and hospitality industry in New Zealand.\n\nThe NZ Chefs National Hospitality Championships 2017 event (Held from the 27th ~ 30th of July 2017 at the Logan Campbell Centre, ASB Showgrounds) was well attended by all of the leading training establishments across New Zealand who were anxiously waiting to see the outcomes of the highly coveted awards.\n\nThe Cornell competitors excelled in their trades and brought home 45 medals along with immense pride in their skills. With 12 gold, 25 silver and 8 Bronze medals won by the Cornell students, there is an air of confidence and appreciation, for the support that the school has provided in preparing the students for the competitions. Cornell prides itself on investing in the next generation and creating opportunities for those who may not have competed in such a prestigious competition before.\n\nAll staff members at Cornell congratulate the Tutors and competitors on a great effort and an extremely positive outcome. This result reflects the extra work that our tutors put in to ensure that our students achieve their potential and enjoy success. This result is a reflection on all the extra hours of work and passion that our Tutors have put in it to ensure that our students receive excellent training, that is up to date and relevant to the cookery and hospitality industry in New Zealand.\n\nJinna Kang, who gained a Gold medal in the trainee breakfast section commented, “The training was hard work but very rewarding at the same time. Thanks to the Institute for their awesome support and believing in my talents. The school provided everything needed for success, equipment, ingredients and knowledge.”\n\nThe huge number of extra hours put in by the hospitality Tutors are to be commended and further demonstrates their commitment to passing on skills to up-and-coming industry staff. The management at The Cornell Education Group are heartened by the dedication shown by the training staff as this bodes well for the future of the training institute.\n\nCornell cookery student, Sio Sio Wong (International Diploma in Food Preparation and Cookery Supervision (Advanced) Level 5) won the Training Chef of the Year. “This competition was very helpful and competing in three different classes really helps to improve my skills. During my training, it helped me to develop as a chef and gain the confidence to experiment with my culinary knowledge.” said Sio Sio.\n\nJin You, who gained a Gold medal in the Pasta and Mushroom category, expressed her praise, “I was so amazed that I was able to perform so highly at a National Level. Our tutors are real heroes, without their guidance it would not have been possible to gain the achievement that I did. Our tutors taught me so many skills about building a classic pasta dish and inspired me to perform at the highest possible level.”\n\n“This is an outstanding result that has demonstrated The Cornell Education Group’s professionalism and excellence in training staff for the hospitality industry of New Zealand. This Event was attended by all of the large training establishments who were present to see the outcomes of the highly coveted awards” said Cornell Education Group’s Cookery Programme Academic Leader, Michael Corbett. “Well done to all the students and the team at Cornell who helped the students to get where they are today!”"},{"slug":"cornell-is-the-best","title":"Experts confirm that CORNELL is the BEST","date":"2017-06-14","excerpt":"Experts confirm that CORNELL is the BEST 4 Class Winners, 8 Golds, 20 Silvers, 7 Bronzes After six 6 weeks of training the Cornell Education Group participated in the recent New Zealand...","md":"**Experts confirm that CORNELL is the BEST**\n\n**4 Class Winners, 8 Golds, 20 Silvers, 7 Bronzes**\n\nAfter six (6) weeks of training the Cornell Education Group participated in the recent New Zealand Chef Regional Salon Competition. The Cornell Education Group entered 40 students in 13 different categories this year with outstanding success.\n\nIt is with pride that we report our students’ excellent results:\n\n|  |  |  |  |  |\n| --- | --- | --- | --- | --- |\n| **Category** | **Class Winner** | **Gold** | **Silver** | **Bronze** |\n| Fruit Flan Static |  | 1 | 1 | 2 |\n| Individual Cold Dessert – Static |  | 1 | 1 |  |\n| Cold Entrée – Static |  | 1 | 1 | 2 |\n| Live knife Skills | 1 | 1 | 3 |  |\n| Live Dessert |  |  | 1 | 2 |\n| Live Pasta & Mushrooms | 1 | 1 | 1 |  |\n| Live Salmon |  | 1 | 1 |  |\n| Live Soup | 1 | 2 | 1 |  |\n| Live Venison | 1 |  | 4 |  |\n| Live Café Breakfast |  |  |  | 1 |\n| Barista |  |  | 2 |  |\n| Classic Cocktail |  |  | 3 |  |\n| Classic Table Setting |  |  | 1 |  |\n| **Total** | **4** | **8** | **20** | **7** |\n\nThis gratifying result is a reflection of all the extra hours of work and passion that our tutors put to ensure that our students received excellent training, that is up to date and relevant to the cookery / hospitality industry in New Zealand.\n\nCornell cookery student, Jessica OH (International Diploma in Food Preparation and Cookery Supervision (Advanced) Level 5 ) won Gold for Live Knife Skills,\n\n“This competition was very helpful and guided me to get a gold medal. During my training, it helped me develop as a chef and gain the confidence to experiment with my culinary knowledge. The training was a great challenge, and I am looking forward to getting the best result at the national salon as well” said Jessica\n\n“Our staff and students are motivated by this result and inspired to compete in the next round of the competition. “said Cornell Education Group’s Cookery Programme Academic Leader, Michael Corbett\n\n“Bring on the National Salons! Well done to all the students and the team at Cornell who helped the students to get where they are today”"},{"slug":"2017-graduation","title":"2017 Graduation","date":"2017-05-15","excerpt":"Congratulations on your completion of the Course The Cornell Education Group would like to formally recognise your achievement at our: 2017 Graduation Ceremony Friday 19th May 2017 at 09:00...","md":"Congratulations on your completion of the Course\n\nThe Cornell Education Group would like to formally recognise your achievement at our:\n\n**20****17** **Graduation Ceremony**\n\n***Friday*** ***19th*** ***May 20******17*** ***at*** ***09******:00 a.m.***\n\n***St Matthew*** ***in-the-City***\n\n***(******Corner of Hobson and Wellesley Streets*** ***Auckland City)***\n\nWe invite you to attend and bring along family or friend. As there is a limit to the total number of attendees,\n\nyou may bring one guest plus yourself (maximum 2 in total).\n\nIf you would like to participate the ceremony then,\n\n**Please R.S.V.P to us by the 13th of April 2017 at reception or via e-mail [sue.park@cornell.ac.nz](mailto:sue.park@cornell.ac.nz)**\n\nPlease note if we do not receive a reply by the above date, you will be UNABLE to participate in the ceremony.\n\nAs this event is a formal occasion graduates MUST wear the specified Regalia to be part of the ceremony:\n\nDiploma graduates Regalia Hire = $80.00 (Rental: $30, Bond\\*: $50.00)\n\n\\* The bond fee will be refunded when you return the undamaged regalia on the day\n\n**You must make payment at reception for your regalia before the 28th of April 2017.**\n\nThis will help greatly in our preparation for the ceremony and will allow us to send you further details of the ceremony."},{"slug":"winner","title":"Winner of the 2016","date":"2016-08-10","excerpt":"NZ Chefs National Salon 2016 Winner of the 2016 NZ Training Establishment of the Year 8 Gold, 13 Silver, 12 Bronze Medals It is with great pride that The Cornell Education Group accepts the...","md":"### NZ Chefs National Salon 2016\n\n### Winner of the 2016 NZ Training Establishment of the Year\n\n#### **(8 Gold, 13 Silver, 12 Bronze Medals)**\n\nIt is with great pride that The Cornell Education Group accepts the award of ‘New Zealand Training Establishment of the year’ for our Professional Cookery and Hospitality schools.\n\nThis is an outstanding results that has demonstrated The Cornell Education Group’s professionalism and excellence in training for the cookery / hospitality industry in New Zealand.\n\nThis NZ Chefs National Salon 2016 event ( 28 July – 31 July 2016 at the Logan Campbell Centre, ASB Showgrounds) was dominated by all of the larger training establishments who were present to see the outcomes of the highly coveted awards.\n\nAll the staff members at Cornell congratulates the trainers and competitors on a great effort and extremely positive outcome.\n\nThis result reflects the extra work that our tutors put into ensuring that our students receive training that is excellent, up to date and relevant to our industry,"},{"slug":"parker","title":"Cornell students punch above their weight at the Parker fight","date":"2015-11-11","excerpt":"Cornell students punch above their weight at the Parker fight Top fight by Joseph Parker and top support by the Cornell hospitality students at the recent boxing event held at the Trust...","md":"### Cornell students punch above their weight at the Parker fight\n\nTop fight by Joseph Parker and top support by the Cornell hospitality students at the recent boxing event held at the Trust Stadium on 15th of October.\n\nThis was billed as one of the biggest sporting events to be held in recent years within the boxing profession. The pressure was on to make sure that those who paid top dollar to attend the heavy weight battle were well looked after and that the food and service was at the highest quality.\n\nThe Cornell Education Group again worked in support of the Flametree Kitchen catering company to provide skilled junior staff for both the kitchen operation and the front of house customer service. Over 30 staff members were provided by iCareer, the careers support department at Cornell Institute based in Auckland CBD. The roles covered by the Cornell trainees included food preparation, plating of entrees, mains and desserts, along with beverage service for a seated audience of over 1200 people. The night proved to be a success for the organisers and service was a star performance.\n\nTroy Reid the General Manger of Flametree Kitchen commented on the Cornell students, **“Another great event delivered – again the student team did a top job, this one was hard work, my thanks to those who worked, great to have them as part of the service team as they helped to make the night a wonderful success from our perspective.”**"},{"slug":"flametree","title":"Cornell Education Group partners with Flametree Kitchen","date":"2015-11-11","excerpt":"Cornell Education Group partners with Flametree Kitchen Since the third quarter of 2015 The Cornell Institute has collaborated with the number one preferred catering company at Auckland...","md":"### Cornell Education Group partners with Flametree Kitchen\n\nSince the third quarter of 2015 The Cornell Institute has collaborated with the number one preferred catering company at Auckland University – Flametree Kitchen. The company looks after the functions and catering needs of the university faculties. This requires a variety of skilled food production and customer service staff. Recently the University has been conducting the spring graduation ceremonies and this has meant large numbers of staff on specific dates. Cornell has stepped up to provide over 20 personnel to support the Flametree operations. The student recruitment has been generated out of iCareer, the careers support department at Cornell, which is focussed on creating opportunities for the Institute’s student population.\n\nTroy Reid, the general manager of Flametree Kitchen, along with Carlos Atkinson the executive chef, visited Cornell in October to award a prize and certificates to the outstanding student staff during this very busy period of the year. Tiffany Lai the recipient of the main prize delightfully comments “I has been a great opportunity to work for a very supportive company such as Flametree and I learnt a lot from the experienced staff during the functions”.\n\nWe look forward to developing this job support program further with Flametree Kitchen – watch this space."},{"slug":"graduation-2015","title":"2015 Graduation","date":"2015-03-18","excerpt":"Congratulations on your completion of the Course The Professional Bar & Restaurant School would like to formally recognise your achievement at our: 2015 Graduation Ceremony Thursday 14 May...","md":"### Congratulations on your completion of the Course\n\nThe Professional Bar & Restaurant School would like to formally recognise your achievement at our:\n\n#### **20****15** **Graduation Ceremony**\n\n#### ***Thursday*** ***14*** ***May 20******15*** ***at*** ***09******:00 a.m.***\n\n#### ***St Matthew*** ***in-the-City***\n\n#### ***(******Corner of Hobson and Wellesley Streets*** ***Auckland City)***\n\nWe invite you to attend and bring along Whanau and friends. As there is a limit to the number of attendees,\n\nyou may bring up to 2 guests plus yourself (maximum 3 in total).\n\nIf you would like to participate the ceremony then,\n\n**Please R.S.V.P** **to us** **by 24****th April** **201****5** **at reception or** **via e-mail** ***[shanelle@pbrs.ac.nz](mailto:shanelle@pbrs.ac.nz)***\n\nPlease note if we do not receive a reply by the above date, you will be **UNABLE** to participate in the ceremony\n\nAs this event is a formal occasion graduates MUST wear the following respectively to be part of the ceremony:\n\n***Regalia*** **for Diploma graduates**\n\nRegalia hire = **$80.00 (Rental: $30, Bond\\*: $50.00)**\n\n*\\* The bond fee will be refunded when you return the regalia on the day*\n\nor ***Formal Dress* for National Certificate Level 3 & 4 graduates**\n\n**You must make payment at reception** **for your** **regalia before** **17th April** **201****5****.**\n\nThis will help greatly in our preparation for the ceremony and will allow us to send you further details of the ceremony."},{"slug":"sea-food-festival","title":"SEA FOOD FESTIVAL","date":"2015-01-28","excerpt":"PBRS trainee Chefs fireup the hot plate in support of the Auckland Seafood Festival The Seafood Festival which was held over the Auckland Anniversary weekend, from the 24th – 26th of...","md":"### PBRS trainee Chefs fire-up the hot plate in support of the Auckland Seafood Festival\n\nThe Seafood Festival which was held over the Auckland Anniversary weekend, from the 24th – 26th of January, was a huge success drawing in over 15,000 seafood loving visitors. It lived up to its goal of providing a variety of flavoursome fresh New Zealand seafood, fun and entertainment for all the family. The Cornell Education Group, which trains chefs and hospitality staff for the growing industry, injected over fourteen of its energetic culinary volunteers to help with the logistics of feeding such a massive number of foodies.\n\nCornell, through the help of iCareer, helped to staff the popular venue’s seafood stalls which includes the Scampi stall with its delicious high grade product for the discerning customers. They also worked on the mussel Fritter Barge, Salmon Plank BBQ stall with its special cedar smoked technique to wow the customer’s taste buds and lastly the Bluff Oyster stalls that are always a great delight each year.\n\n*Brian Batbatan one of the trainees chefs from Cornell comments “it has been such a wonderful experience to work with the organisers on the food stall as I got to cook with great people and to taste some very special dishes”.*\n\nThis has been another great opportunity for the professional Education Provider to engage with the industry in a fun and supportive way – see you all there 2016!\n\nNB : iCareer a department in Cornell helped to coordinate with the organises to source staff for the stalls – if you need hospitality staff for your business, feel free to contact us at [aaron@icareer.co.nz](mailto:aaron@icareer.co.nz)"},{"slug":"get-a-westfield-voucher","title":"Get a Westfield Voucher","date":"2014-10-29","excerpt":"REFER A FRIEND PROMOTION Referral means – if you refer your friends to PBRS for our upcoming Intakes in April you will receive a Westfield voucher to the value of $200. Terms and Conditions...","md":"## REFER A FRIEND PROMOTION\n\nReferral means – if you refer your friends to PBRS for our upcoming Intakes in April you\n\nwill receive a Westfield voucher to the value of $200. Terms and Conditions apply!\n\nFor more information please call 300-7277 to talk a\n\nPBRS staff member or email [info@pbrs.ac.nz](mailto:info@pbrs.ac.nz)\n\nPBRS\n\n161 Hobson street Auckland New Zealand."},{"slug":"2014-nz-culinary-fare-training-excellence-award","title":"2014 NZ Culinary Fare Training Excellence Award","date":"2014-09-09","excerpt":"The Cornell Education Group is the recipient of the prestigious “Training Excellence Award” for 2014 at the National Culinary Fare This is an outstanding result that has demonstrated The...","md":"The Cornell Education Group is the recipient of the prestigious “Training Excellence Award” for 2014 at the National Culinary Fare This is an outstanding result that has demonstrated The Cornell Education Group’s professionalism and excellence in training staff for the hospitality industry of New Zealand. This Event was dominated by all of the larger training establishments who were present to see the outcomes of the highly coveted awards. All the staff at Cornell congratulates the trainers and competitors on a great effort and extremely positive outcome.This has been a fantastic chance to develop camaraderie and build skill strengths for future industry engagement."},{"slug":"celebration-party","title":"Celebration Party","date":"2014-07-20","excerpt":"Culinary Fare Celebration Party Friday 18 JUNE 2014 Celebration Party","md":"## Culinary Fare Celebration Party\n\n***Friday 18 JUNE 2014 Celebration Party***"},{"slug":"pbrs-demonstrates-skills","title":"PBRS Demonstrates skills","date":"2014-07-16","excerpt":"Culinary Fare – Auckland Regionals – PBRS which is part of the Cornell Group, has sent trainees to experience the challenge of the regional competitions held in central Auckland. The Group...","md":"# Culinary Fare – Auckland Regionals –\n\nPBRS which is part of the Cornell Group, has sent trainees to experience the challenge of the regional competitions held in central Auckland.\n\nThe Group came away with over forty medals (Golds, Silvers and Bronze) – what a fantastic effort from the committed students!\n\nThe categories covered cookery, front of house – Barista, innovative cocktails, cocktails, table setting, innovative table setting.\n\nThis showed the passion and energy that students from PBRS are known for. The tutors gave it all to prepare the students and be there on the day to support the comps…Well done PBRS team!\n\nThe Nationals run by the Restaurant Association of New Zealand held in August, now beckons for the TCEG Group to step-up a level and build a great platform for the student to display their talent."},{"slug":"pbrs-opens-its-doors-to-the-south","title":"PBRS opens its doors to the South","date":"2014-05-19","excerpt":"PANMURE CAMPUS PBRS has a newly established campus located at 108 Queens Road Panmure – opened on the 19th of May 2014. This is an exciting move by the hospitality training institute to...","md":"# PANMURE CAMPUS\n\nPBRS has a newly established campus located at 108 Queens Road Panmure – opened on the 19th of May 2014. This is an exciting move by the hospitality training institute to give developing culinary students in the South East of Auckland an opportunity to sharpen their skill set in a quality facility. The site offers two fully functional training kitchens that are run by professional tutors using commercial grade equipment. It also contains a computer laboratory for modern style academic learning that enhances the achievement of its trainees. The courses offered are the NZQA Level 3 and 4 Certification in Cookery along with the Professional Cookery Diploma Level 5 Diploma. Contact PBRS student support staff for more information."},{"slug":"pbrs-panmure-campus-orientation","title":"PBRS Panmure Campus Orientation","date":"2014-05-19","excerpt":"PBRS Panmure Campus Orientation Monday 19 May 2014 1st Orientation in Panmure campus","md":"# PBRS Panmure Campus Orientation\n\n***Monday 19 May 2014 1st Orientation in Panmure campus***"},{"slug":"2014-graduation-ceremony","title":"2014 Graduation Ceremony","date":"2014-05-16","excerpt":"2014 Graduation Ceremony Friday 16 May 2014 at 09:00 a.m. Rendezvous Hotel Room. 2","md":"# 2014 Graduation Ceremony\n\n***Friday 16 May 2014 at 09:00 a.m.*** ***Rendezvous Hotel (Room. 2)***"}],"policies":[{"id":"immigration","title":"Immigration","md":"All international students must hold an appropriate visa or permit for their entire study period. Full details of immigration requirements, advice on rights to employment in New Zealand while studying, and reporting requirements are available from Immigration New Zealand, and can be viewed on their website at [www.immigration.govt.nz](https://www.immigration.govt.nz/new-zealand-visas)"},{"id":"eligibility-for-health-services","title":"Eligibility for Health Services","md":"Most international students are not entitled to publicly funded health services while in New Zealand. If you receive medical treatment during your visit, you may be liable for the full costs of that treatment. Full details on entitlements to publicly funded health services are available through the Ministry of Health, and can be viewed on their website at www.moh.govt.nz.\n\nAll international students are required to declare any medical or learning needs before enrolment. Please note that international students are not eligible for special needs funding.\n\nIf you need to take any medicine long term, please check if the medicine is available in New Zealand. If it is not, you may need to talk with your doctor and find another solution for your needs."},{"id":"accident-insurance","title":"Accident Insurance","md":"The New Zealand Accident Compensation Corporation (ACC) provides accident insurance for all New Zealand citizens, residents, and temporary visitors to New Zealand, but you may still be liable for all other medical and related costs. Further information can be viewed on the ACC website at [www.acc.co.nz](http://www.acc.co.nz)"},{"id":"medical-and-travel-insurance","title":"Medical and Travel Insurance","md":"While an international student enrolled with PBRS for educational instruction of 2 weeks’ duration or longer, the student must have appropriate insurance to cover—\n\n(a) the student’s travel—\n\n(i) to and from New Zealand; and\n\n(ii) within New Zealand; and\n\n(iii) if the travel is part of the course, outside New Zealand; and\n\n(b) medical care in New Zealand, including diagnosis, prescription, surgery, and hospitalisation; and\n\n(c) repatriation or expatriation of the student as a result of serious illness or injury, including cover of travel costs incurred by family members assisting repatriation or expatriation; and\n\n(d) death of the student, including cover of—\n\n(i) travel costs of family members to and from New Zealand; and\n\n(ii) costs of repatriation or expatriation of the body; and\n\n(iii) funeral expenses.\n\nPBRS provides medical and travel insurance through a New Zealand insurance company. PBRS has assessed the policies provided by the insurance company. Insurance is compulsory for all international students studying at PBRS and will automatically be charged for unless an alternative insurance compliant with the Code of Practice has already been arranged. Please make sure you have declared all of your medical needs prior to your enrolment. Please be aware that insurance arranged by PBRS will not cover your previous health issues.\n\nWith prior notification and forewarning, failing to present the up-to-date and effective insurance policy as an international student or failing to present it before the required date will be seen as deliberate violation of PBRS’s rules and regulations. PBRS will exercise its right to suspend or terminate the student’s study and report the case to all relevant departments (e.g. Immigration New Zealand). In this case, the individual student will be fully responsible for any consequences arise."},{"id":"fees","title":"Fees","md":"The Student fee payment schedule will be issued upon the receipt of an application form and all supporting documents. Fees are due for payment, before the start of your program of study. Once tuition has commenced, tuition fees will remain the same irrespective of changes to immigration status, for instance obtaining Permanent Residency, and any other changes. Prior to commencement, tuition fees are subject to change without notice. Where a student still owes money to PBRS for any outstanding items, the final qualification certificate(s) will not be issued until all accounts have been paid.\n\nApart from fees that the student paid prior to commencement, students may need to pay for any failed courses or administrative fees. Please see our Student Handbook for details."},{"id":"fee-protection","title":"Fee Protection","md":"The New Zealand Government requires that all Private Training Establishments (PTE) registered with NZQA protect student fees paid to them in advance. At PBRS, all students’ fees will be deposited in the government owned public trust account administered by NZ Public Trust. The fees will be released on a pro rata basis from this trust account in accordance with an agreed monthly schedule based on tuition delivered and until the completion of the program."},{"id":"withdrawal-and-refund-policy","title":"Withdrawal and Refund Policy","md":"| Course length | When you withdraw | Refund |\n| --- | --- | --- |\n| 1 to 34 days | Before the course starts, or within the first two working days | 50% of total fees paid |\n| 1 to 34 days | After two working days | No refund |\n| 35 days to 3 months | Before the course starts, or within the first five working days | 75% of total fees paid |\n| 35 days to 3 months | After five working days | No refund |\n| More than 3 months | Before the course starts, or within the first ten working days | Full refund of all fees paid, less 25% of total tuition and enrolment fees |\n| More than 3 months | After ten working days | No refund |\n\nPlease note:**\n\n- The first day of your programme is recorded on the student’s “Offer of Place” letter.\n- Student visa not granted before and/or within the first 10 working days of the course commencement\n  – The student must provide an official letter from INZ confirming the visa decline: The student will receive a full refund of all fees paid less a deduction of 10% up to a maximum of $500\n- Student visa not granted after the first 10 working days of the course commencement\n  – The student must provide an official letter from INZ confirming the visa decline: The student will receive a refund of the balance of unconsumed tuition fees paid\n- Student visa extension not granted\n  – The student must provide an official letter from INZ confirming the extension decline: The student will receive a refund of the balance of unconsumed tuition fees paid\n- If PBRS decides, for any reason, to discontinue a programme of study (including if PBRS ceases to be a signatory of the Code or a registered provider), all fees paid for services not delivered or the unused portion of fees will be refunded or transferred to another institute as agreed with the student. Other than the student being entitled to such refund, it will have no other further claim against PBRS.\n- No refund is available if a student is withdrawn from study by PBRS for disciplinary reasons including: inappropriate behaviour, poor attendance or inadequate academic progress, transfer to another school after the refund period.\n- No refund is available if a student’s enrolment is cancelled because the enrolment application is found to be inaccurate in any way.\n- No refund is available if a student has their visa/permit to study at PBRS cancelled.\n- If a student wishes to withdraw from a homestay arranged by PBRS, they must provide at least two (2) weeks’ notice in advance either before they arrive in New Zealand or before the date on which they wish to leave the homestay accommodation. Failure to provide this notice will result in 2 weeks accommodation fees being forfeited. The homestay placement fee is not refunded under any circumstances.\n- If a student wishes to cancel a booked airport pick up, they must provide at least one (1) week’s notice before the arrival date and a full refund of the airport pick up fee will be made. Otherwise, the entire fee will be retained.\n- Full refund of an insurance fee paid through PBRS will be made if the student requests withdrawal before the course starts or within one week of the course starts. No refund of an insurance fee will be given after one week of the programme start date.\n- In a case where a student has asked PBRS to buy insurance earlier than within one (1) week of when the course starts, the student is required to inform PBRS in advance, so that the student insurance can be arranged earlier. In this case, no refund of insurance fee will be given after two weeks of when the insurance is bought.\n- Living costs paid to PBRS will be fully refunded on the student’s request\n- **Late requests:** In exceptional circumstances, late notices of withdrawal and requests for refund may be submitted, and these will be considered on a case-by-case basis. Possible reasons for such requests include:\n  - Serious illness or disability of the student\n  - Death of a student or close family member (parent, sibling, spouse or child)\n  - Political, civil or natural event that prevents arrival of the student\n\nFull documentation must be supplied to support each application.\n\nWhere a late request is approved, the amount to be refunded may be reduced at the Institute’s sole discretion. In particular, deductions may be made to take account of items such as fees for services provided prior to withdrawal, and any payments to agents in relation to the student’s enrolment. Refund of other fees will be made in accordance with the relevant policies."},{"id":"withdrawal-and-refund-process","title":"Withdrawal and Refund Process","md":"1. Any applications for withdrawal must be made in writing on the appropriate withdrawal form, and must state reasons in full. Written confirmation from the payee student’s parents or legal guardian is required, if the student is under 18.\n2. All applications for a refund will be reviewed and decided upon by the PBRS Executive Management Team in accordance with the Withdrawal and Refund Policy\n3. Notification as to the decision in relation to the refund application will be supplied to the student within ten working days of receipt of the application.\n4. A refund will be made within five (5) working days of the day on which a decision to refund is made. Payment will be made to the student’s account or a third party account agreed by the student. Where a student is under 18 years of age, the parent(s) or the legal guardian will need to give his/her signed approval and a clear indication of the account into which the refund will be made.\n5. All fees are received and refunded in NZ dollars. PBRS is not responsible for any currency fluctuations between enrolment and payment of refund, and is not responsible for any bank charges incurred through the deposit of funds into your nominated account.\n6. PBRS will notify Immigration New Zealand (INZ) of your withdrawal within one (1) week. This may affect the student’s visa status."},{"id":"attendance","title":"Attendance","md":"Students studying at PBRS are required to maintain excellent attendance throughout the programme. Any student who fails to meet this attendance requirement may be subject to expulsion from the programme and PBRS will notify Immigration New Zealand.\n\nAt PBRS, you are expected to attend class for 20 hours per week. Classes will be arranged during the week. Class Time each day may be different. A detailed timetable will be given to you on the orientation day for the first term and will be given about 1 week before term starts for the rest. It is important to think about your class time before you take any job."},{"id":"recognition-of-prior-learning-rpl-and-cross-credit-cc","title":"Recognition of Prior Learning (RPL) and Cross Credit (CC)","md":"Where a student believes he/she may be eligible for this, contact needs to be made with the school for the forms to apply for this recognition. An additional processing fee of $500 will be required. This process must be completed before the Offer of Placement Letter is issued. No RPL/CC will be considered after the student has started his/her course."},{"id":"notification","title":"Notification","md":"In signing this enrolment form you undertake to comply with the regulation to notify PBRS of your current contact details in New Zealand and in your home country, accommodation type, residential address and immigration status at all times, and you accept that failure to do so may result in your enrolment with PBRS being terminated."},{"id":"orientation","title":"Orientation","md":"Before your course starts, there will be a class orientation that will include:\n\n- Warm welcome from all staff and students\n- An introduction to your fellow students, members of management, lecturers and all other staff\n- An introduction to your chosen program, facilities and the requirements for training\n- An explanation of the rules, regulations (including the Education (Pastoral Care of Tertiary and International Learner) Code of Practice 2021 and the Health & Safety requirements etc. You will have the opportunity to sign the learning contract to demonstrate your agreement to abide by these. A Student Handbook will be provided on the day.\n- A copy of your passport & student visa and a copy of your medical & travel insurance certificate are required to be provided to the school.\n\nMake sure to check our Facebook page ([www.facebook.com/pbrsinternational](https://www.facebook.com/pbrsinternational)) for announcements, and these schedules are subject to change."},{"id":"accommodation","title":"Accommodation","md":"As per the requirement of the Education (Pastoral Care of Tertiary and International Learner) Code of Practice 2021, for international students aged under 18, they must live with their parents, designated caregiver or PBRS arranged homestay. Please discuss with our Marketing Managers about your accommodation arrangement if you are under 18. You and your parents may be required to fill in some forms regarding this.\n\nPBRS also provides accommodation arrangements for international students aged over 18 on request but we must have a minimum of 4 weeks’ notice. The minimum period of homestay is 4 weeks. Fees will apply. Please check with us for details.\n\nFor international students aged over 18 who want to find your own accommodation, you may find general information on renting at <https://www.tenancy.govt.nz>, or find information on quality standards for renting at: <http://www.mbie.govt.nz/info-services/housing-property/tenancy/residential-tenancies-regulations-for-insulation-and-smoke-alarms>. You are also welcome to talk with our Pastoral Care Team and seek more advice."},{"id":"circumstances-in-which-pbrs-may-terminate-enrolment","title":"Circumstances in which PBRS may Terminate Enrolment","md":"- If a student is expelled according to the Disciplinary Process. Including situations as continued and/or unexplained absenteeism, inadequate progress, any breach of disciplinary regulations etc.\n- If a student is found having provided false or misleading information\n- If the Academy is unable to guarantee accommodation due to the student’s behaviour (under 18 students)\n- If a student has criminal behaviour inside or outside the Academy’s premises\n- If a student can not attend school to make up the missed programme time and needs to re-enrol if they wish to complete the programme for reasons such as illness or family obligations.\n\nAll decisions to terminate enrolment will be based on evidence, and the normal appeal procedure applies. If your enrolment is terminated:\n\n- No refund will be given\n- Immigration New Zealand and parents (if you are under 18) of yours will be notified about your problem and status."}]};

st_text: ["PBRS combines highly qualified tutors, outstanding training facilities and an up-to-date curriculum that meets the needs of industry, so graduates leave with world-class, internationally recognised qualifications.","PBRS 汇聚高素质的导师、一流的培训设施和紧贴行业需求的最新课程，让毕业生带着世界一流、国际认可的资历走向职场。","PBRS में उच्च योग्यता प्राप्त शिक्षक, उत्कृष्ट प्रशिक्षण सुविधाएँ और उद्योग की ज़रूरतों के अनुरूप अद्यतन पाठ्यक्रम एक साथ मिलते हैं, ताकि स्नातक विश्व-स्तरीय, अंतरराष्ट्रीय स्तर पर मान्य योग्यताओं के साथ निकलें।","PBRS combina docentes altamente cualificados, instalaciones sobresalientes y un currículo actualizado que responde a las necesidades del sector, para que los graduados obtengan títulos de nivel mundial reconocidos internacionalmente.","تجمع PBRS بين مدرّبين مؤهلين تأهيلاً عالياً ومرافق تدريب متميزة ومنهج حديث يلبّي احتياجات القطاع، ليتخرج الطلاب بمؤهلات عالمية معترف بها دولياً.","PBRS associe des formateurs hautement qualifiés, d'excellentes installations et un programme à jour, adapté aux besoins du secteur, pour que les diplômés obtiennent des qualifications de classe mondiale reconnues à l'international."],

ai_h: ["Answers from PBRS, any hour, <i>in your language</i>","来自 PBRS 的解答，随时在线，<i>说您的语言</i>","PBRS से जवाब, किसी भी समय, <i>आपकी भाषा में</i>","Respuestas de PBRS, a cualquier hora, <i>en tu idioma</i>","إجابات من PBRS في أي وقت <i>وبلغتك</i>","Les réponses de PBRS, à toute heure, <i>dans votre langue</i>"],
ai_p: ["The assistant answers from PBRS's own course, fee and policy pages and shows its sources. It recommends courses, estimates costs, never gives visa advice and passes you to a person when you need one.","助手只依据 PBRS 自己的课程、费用和政策页面作答，并标明来源。它会推荐课程、估算费用，从不提供签证建议，需要时会转接真人。","असिस्टेंट PBRS के अपने कोर्स, शुल्क और नीति पेजों से जवाब देता है और स्रोत दिखाता है। यह कोर्स सुझाता है, लागत का अनुमान लगाता है, वीज़ा सलाह कभी नहीं देता और ज़रूरत पड़ने पर आपको किसी व्यक्ति से जोड़ता है।","El asistente responde con las páginas de cursos, tarifas y políticas de PBRS y muestra sus fuentes. Recomienda cursos, estima costos, nunca da consejos de visa y te pone en contacto con una persona cuando lo necesitas.","يجيب المساعد من صفحات الدورات والرسوم والسياسات الخاصة بـ PBRS ويعرض مصادره. يوصي بالدورات ويقدّر التكاليف، ولا يقدّم نصائح بشأن التأشيرات، ويحوّلك إلى موظف عند الحاجة.","L'assistant répond à partir des pages de cours, de frais et de politiques de PBRS et cite ses sources. Il recommande des cours, estime les coûts, ne donne jamais de conseils de visa et vous met en relation avec une personne si besoin."],

demo_q1: ["I have 2 years of kitchen experience. Which course fits me?", "我有 2 年厨房工作经验，哪个课程适合我？", "मेरे पास 2 साल का रसोई का अनुभव है। कौन सा कोर्स मेरे लिए ठीक है?", "Tengo 2 años de experiencia en cocina. ¿Qué curso me conviene?", "لدي سنتان من الخبرة في المطبخ. أي دورة تناسبني؟", "J'ai 2 ans d'expérience en cuisine. Quel cours me convient ?"],
demo_a1: ["With that experience the Cookery Supervision diploma (Level 5) is a strong fit. Level 4 Cookery is the entry route. Want the cost and next intake?","有这样的经验，烹饪主管文凭（5 级）非常合适；4 级烹饪是入门路径。需要了解费用和下次开课时间吗？","इस अनुभव के साथ कुकरी सुपरविज़न डिप्लोमा (स्तर 5) बहुत उपयुक्त है। स्तर 4 कुकरी शुरुआती रास्ता है। क्या आप लागत और अगला प्रवेश सत्र जानना चाहेंगे?","Con esa experiencia, el diploma de Supervisión de Cocina (nivel 5) encaja muy bien. Cocina nivel 4 es la vía de entrada. ¿Quieres el costo y la próxima convocatoria?","بهذه الخبرة يناسبك دبلوم الإشراف على الطبخ (المستوى 5)، أما الطبخ المستوى 4 فهو مسار البداية. هل تريد التكلفة وموعد القبول القادم؟","Avec cette expérience, le diplôme de supervision en cuisine (niveau 5) est idéal. Le niveau 4 est la voie d'entrée. Souhaitez-vous le coût et la prochaine rentrée ?"],

cta_p: ["Apply online in minutes. Your answers save as you go, and an admissions adviser replies within two working days.", "几分钟即可在线申请。您的填写内容会自动保存，招生顾问将在两个工作日内回复。", "कुछ ही मिनटों में ऑनलाइन आवेदन करें। आपके उत्तर साथ-साथ सहेजे जाते हैं और प्रवेश सलाहकार दो कार्य-दिवसों में जवाब देता है।", "Solicita en línea en minutos. Tus respuestas se guardan y un asesor de admisiones responde en dos días hábiles.", "قدّم عبر الإنترنت في دقائق. تُحفظ إجاباتك تلقائياً ويرد مستشار القبول خلال يومي عمل.", "Postulez en ligne en quelques minutes. Vos réponses sont enregistrées et un conseiller d'admission répond sous deux jours ouvrés."],

b_refund: ["Refunds depend on course length and when you withdraw. For a course longer than 3 months, withdrawing before it starts or within 10 working days refunds all fees paid, less 25% of tuition and enrolment fees. After that there is no refund. Shorter courses and visa declines have their own rules.","退款取决于课程时长和退学时间。课程超过 3 个月时，开课前或前 10 个工作日内退学，可退还已付全部费用，但扣除学费和入学费的 25%；此后不予退款。较短课程和签证被拒另有规定。","रिफंड कोर्स की अवधि और आपके कोर्स छोड़ने के समय पर निर्भर है। 3 महीने से लंबे कोर्स में शुरू होने से पहले या पहले 10 कार्य-दिवसों में छोड़ने पर चुकाया गया पूरा शुल्क लौटाया जाता है, ट्यूशन और नामांकन शुल्क का 25% घटाकर। उसके बाद रिफंड नहीं मिलता। छोटे कोर्स और वीज़ा अस्वीकृति के लिए अलग नियम हैं।","El reembolso depende de la duración del curso y de cuándo te retiras. En cursos de más de 3 meses, retirarse antes del inicio o dentro de los primeros 10 días hábiles devuelve todo lo pagado, menos el 25 % del costo del curso y de las tasas de inscripción. Después no hay reembolso. Los cursos más cortos y las denegaciones de visa tienen reglas propias.","يعتمد الاسترداد على مدة الدورة وموعد الانسحاب. في الدورات التي تتجاوز 3 أشهر، يُعاد كامل المبلغ المدفوع عند الانسحاب قبل البدء أو خلال 10 أيام عمل، مع خصم 25% من الرسوم الدراسية ورسوم التسجيل. بعد ذلك لا يوجد استرداد. وللدورات الأقصر ورفض التأشيرة قواعد خاصة.","Le remboursement dépend de la durée du cours et du moment du retrait. Pour un cours de plus de 3 mois, un retrait avant le début ou dans les 10 jours ouvrés rembourse tous les frais versés, moins 25 % des frais de scolarité et d'inscription. Ensuite, aucun remboursement. Les cours plus courts et les refus de visa ont leurs propres règles."],
b_human: ["Happy to connect you with admissions. Share your details and consent below.","很乐意为您转接招生办。请在下方填写信息并确认同意。","मुझे आपको प्रवेश टीम से जोड़कर खुशी होगी। नीचे अपना विवरण और सहमति दें।","Con gusto te pongo en contacto con admisiones. Deja tus datos y tu consentimiento abajo.","يسعدني توصيلك بفريق القبول. أدخل بياناتك وموافقتك أدناه.","Avec plaisir, je vous mets en relation avec le service des admissions. Indiquez vos coordonnées et votre accord ci-dessous."],
ho_send: ["Send to admissions","发送给招生办","प्रवेश टीम को भेजें","Enviar a admisiones","أرسل إلى فريق القبول","Envoyer au service des admissions"], ho_err: ["Add your name, a valid email and tick consent","请填写姓名、有效邮箱并勾选同意","नाम, वैध ईमेल दें और सहमति पर टिक करें","Añade tu nombre, un correo válido y marca el consentimiento","أضف اسمك وبريداً صالحاً وحدّد خانة الموافقة","Ajoutez votre nom, un e-mail valide et cochez le consentement"],
b_ho_done: ["Thank you {name}. Your enquiry {ref} has been passed to admissions, who usually reply within two working days.","谢谢 {name}。您的咨询 {ref} 已转交招生办，通常两个工作日内回复。","धन्यवाद {name}। आपकी पूछताछ {ref} प्रवेश टीम को भेज दी गई है, जो आमतौर पर दो कार्य-दिवसों में जवाब देती है।","Gracias {name}. Tu consulta {ref} pasó a admisiones, que suele responder en dos días hábiles.","شكراً {name}. أُحيل استفسارك {ref} إلى فريق القبول، وعادةً يرد خلال يومي عمل.","Merci {name}. Votre demande {ref} a été transmise au service des admissions, qui répond en général sous deux jours ouvrés."],
b_apply: ["You can apply online in six short steps and your answers save as you go. Shall I open the application?", "您可以通过六个简短步骤在线申请，内容自动保存。需要我打开申请页面吗？", "आप छह छोटे चरणों में ऑनलाइन आवेदन कर सकते हैं और उत्तर साथ-साथ सहेजे जाते हैं। क्या मैं आवेदन खोल दूँ?", "Puedes solicitar en línea en seis pasos breves y tus respuestas se guardan. ¿Abro la solicitud?", "يمكنك التقديم عبر الإنترنت في ست خطوات قصيرة وتُحفظ إجاباتك. هل أفتح الطلب؟", "Vous pouvez postuler en ligne en six étapes et vos réponses sont enregistrées. Dois-je ouvrir le formulaire ?"],
b_contact: ["PBRS is at **Level 1, 150 Hobson Street, Auckland CBD**. Phone +64 (09) 367 1010, email info@pbrs.ac.nz.","PBRS 位于 **奥克兰市中心霍布森街 150 号 1 楼**。电话 +64 (09) 367 1010，邮箱 info@pbrs.ac.nz。","PBRS का पता **लेवल 1, 150 हॉब्सन स्ट्रीट, ऑकलैंड CBD**। फ़ोन +64 (09) 367 1010, ईमेल info@pbrs.ac.nz।","PBRS está en **Level 1, 150 Hobson Street, Auckland CBD**. Teléfono +64 (09) 367 1010, correo info@pbrs.ac.nz.","تقع PBRS في **Level 1, 150 Hobson Street, Auckland CBD**. الهاتف +64 (09) 367 1010، البريد info@pbrs.ac.nz.","PBRS se trouve au **Level 1, 150 Hobson Street, Auckland CBD**. Tél. +64 (09) 367 1010, e-mail info@pbrs.ac.nz."],
b_jobs: ["PBRS has an employment support service with a placement consultant, a job board and CV upload for students and graduates.","PBRS 设有就业支持服务，提供就业顾问、招聘信息，学生和毕业生可上传简历。","PBRS की रोज़गार सहायता सेवा में प्लेसमेंट सलाहकार, जॉब बोर्ड और छात्रों व स्नातकों के लिए सीवी अपलोड है।","PBRS ofrece apoyo laboral con un consultor de empleo, bolsa de trabajo y subida de CV para estudiantes y graduados.","تقدم PBRS خدمة دعم التوظيف مع مستشار توظيف ولوحة وظائف ورفع السيرة الذاتية للطلاب والخريجين.","PBRS propose un service d'aide à l'emploi avec conseiller en placement, offres d'emploi et dépôt de CV."],
b_policy: ["Policies cover fees, refunds, attendance, insurance, accommodation, orientation and more. Open the policy page to read each one.","政策涵盖费用、退款、出勤、保险、住宿、入学指导等，请打开政策页面逐项阅读。","नीतियों में शुल्क, रिफंड, उपस्थिति, बीमा, आवास, ओरिएंटेशन आदि शामिल हैं। हर एक पढ़ने के लिए नीति पेज खोलें।","Las políticas cubren tarifas, reembolsos, asistencia, seguro, alojamiento, orientación y más. Abre la página de políticas para leer cada una.","تشمل السياسات الرسوم والاسترداد والحضور والتأمين والسكن والتهيئة وغيرها. افتح صفحة السياسات لقراءة كل منها.","Les politiques couvrent frais, remboursements, assiduité, assurance, logement, orientation et plus. Ouvrez la page des politiques."],
b_thanks: ["You're welcome! Anything else I can help with?", "不客气！还有其他需要帮忙的吗？", "आपका स्वागत है! और कुछ मदद चाहिए?", "¡De nada! ¿Algo más en lo que pueda ayudarte?", "على الرحب والسعة! هل من شيء آخر؟", "Avec plaisir ! Puis-je vous aider autrement ?"],
b_hi: ["Kia ora! How can I help you today?", "你好！今天我能帮您什么？", "नमस्ते! आज मैं आपकी कैसे मदद करूँ?", "¡Kia ora! ¿En qué puedo ayudarte hoy?", "كيا أورا! كيف أساعدك اليوم؟", "Kia ora ! Comment puis-je vous aider ?"],
b_course: ["Here is **{c}**. I can share the cost, entry requirements or start your application.","这是 **{c}**。我可以介绍费用、入学要求，或帮您开始申请。","यह है **{c}**। मैं लागत, प्रवेश शर्तें बता सकता हूँ या आवेदन शुरू कर सकता हूँ।","Este es **{c}**. Puedo darte el costo, los requisitos o iniciar tu solicitud.","هذه دورة **{c}**. يمكنني ذكر التكلفة وشروط القبول أو بدء طلبك.","Voici **{c}**. Je peux vous indiquer le coût et les conditions d'admission, ou commencer votre dossier."],
b_unknown: ["I don't have that in PBRS's information yet, so I won't guess. I've noted your question for the team. Would you like me to connect you with admissions?","PBRS 的资料中暂无此信息，所以我不会猜测。我已把您的问题记录给团队。需要我为您转接招生办吗？","यह जानकारी अभी PBRS की सामग्री में नहीं है, इसलिए मैं अंदाज़ा नहीं लगाऊँगा। मैंने आपका सवाल टीम के लिए दर्ज कर लिया है। क्या मैं आपको प्रवेश टीम से जोड़ दूँ?","Aún no tengo eso en la información de PBRS, así que no voy a adivinar. He anotado tu pregunta para el equipo. ¿Quieres que te ponga en contacto con admisiones?","هذه المعلومة غير متوفرة بعد في محتوى PBRS، لذلك لن أخمّن. سجّلت سؤالك للفريق. هل تريد أن أوصلك بفريق القبول؟","Je n'ai pas encore cette information dans le contenu de PBRS, donc je ne vais pas deviner. J'ai noté votre question pour l'équipe. Souhaitez-vous être mis en relation avec le service des admissions ?"],
b_visa: ["I can't give visa, legal or medical advice. For immigration questions please contact Immigration New Zealand or a licensed adviser. I'm happy to help with anything about your study at PBRS.","我无法提供签证、法律或医疗建议。移民问题请联系新西兰移民局或持牌顾问。关于在 PBRS 学习的问题，我很乐意帮忙。","मैं वीज़ा, कानूनी या चिकित्सा सलाह नहीं दे सकता। आव्रजन संबंधी सवालों के लिए इमिग्रेशन न्यूज़ीलैंड या लाइसेंस-प्राप्त सलाहकार से संपर्क करें। PBRS में पढ़ाई से जुड़ी किसी भी बात में मैं मदद करूँगा।","No puedo dar consejos de visa, legales ni médicos. Para temas de inmigración, contacta con Immigration New Zealand o con un asesor autorizado. Con gusto te ayudo con tus estudios en PBRS.","لا أستطيع تقديم نصائح بشأن التأشيرات أو الشؤون القانونية أو الطبية. لأسئلة الهجرة تواصل مع دائرة الهجرة النيوزيلندية أو مستشار مرخّص. يسعدني مساعدتك في أي أمر يخص دراستك في PBRS.","Je ne peux pas donner de conseils de visa, juridiques ou médicaux. Pour l'immigration, contactez Immigration New Zealand ou un conseiller agréé. Je vous aide volontiers pour vos études à PBRS."],

INIT.calculator = v => {
  const s = state.calc, R = { home: 350, pick: 120, ins: 55 };
  const draw = () => { const c = course(s.course), L = []; let tot = 0;
    if (c.tuition == null) L.push([t('tuition'), t('fee_tbc_s')]); else { L.push([t('tuition'), money(c.tuition)], [t('materials'), money(c.material)]); tot += c.tuition + c.material }
    if (s.home) { L.push([`${t('homestay')} · ${s.home} ${t('wk')}`, money(s.home * R.home)]); tot += s.home * R.home } if (s.pick) { L.push([t('pickup'), money(R.pick)]); tot += R.pick } if (s.ins) { L.push([`${t('insurance')} · ${s.ins} ${t('mo')}`, money(s.ins * R.ins)]); tot += s.ins * R.ins }
    $('#c-total').textContent = c.tuition == null && !tot ? t('ask_adm') : money(tot); $('#c-sub').textContent = SHORT[c.id] + ' · NZD'; $('#c-lines').innerHTML = L.map(l => `<li><span>${esc(l[0])}</span><span class="num">${esc(l[1])}</span></li>`).join(''); };
  $('#c-course').onchange = e => { s.course = e.target.value; draw() }; $$('[name=ci]', v).forEach(r => r.onchange = () => s.intake = +r.value); $('#c-pick').onchange = e => { s.pick = e.target.checked; draw() };
  $$('.stepper-n', v).forEach(w => { const k = w.dataset.step, o = $('output', w), [m, p] = $$('button', w); m.onclick = () => { s[k] = Math.max(0, s[k] - 1); o.textContent = s[k]; draw() }; p.onclick = () => { s[k] = Math.min(104, s[k] + 1); o.textContent = s[k]; draw() } }); draw();
};

/* Contact form posts to the PBRS Express API, which stores the enquiry and sends the emails through nodemailer. */
const API_BASE = window.PBRS_API || (location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? 'http://localhost:5300' : '');
INIT.contact = () => {
  const f = $('#cform');
  f.onsubmit = async e => {
    e.preventDefault();
    const n = $('#k1'), m = $('#k2'), ok = $('#k5'), btn = $('button[type=submit]', f);
    const b1 = !n.value.trim(), b2 = !/^\S+@\S+\.\S+$/.test(m.value);
    n.closest('.fld').classList.toggle('bad', b1); m.closest('.fld').classList.toggle('bad', b2);
    if (b1 || b2) return;
    if (!ok.checked) { toast(t('tick_confirm')); return }
    btn.disabled = true;
    try {
      const r = await fetch(API_BASE + '/api/enquiries', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: n.value.trim(), email: m.value.trim(), country: 'Not stated', courses: $('#k3').value ? [$('#k3').value] : [], message: $('#k4').value.trim(), consent: true }) });
      if (!r.ok) throw new Error(r.status);
      toast(t('toast_sent')); f.reset();
    } catch (err) { toast(t('toast_fail')) }
    btn.disabled = false;
  };
};

window.KB={"version":1,"built":"2026-10-18","count":86,"docs":[{"id":"course-c4","type":"course","title":"New Zealand Certificate in Cookery (Level 4)","route":"course-c4","updated":"2024-01-16","source":"/courses/cookery-level4/","sections":[{"h":"Summary","t":"New Zealand Certificate in Cookery (Level 4). Build the skills to work as a chef in intermediate positions producing complex dishes in a commercial kitchen. Level 4, Cookery. Duration: 1 year (36 weeks, 120 credits, four 9-week terms)."},{"h":"Fees","t":"Tuition fee: NZ$19,500. Materials: NZ$2,000. Total NZ$21,500."},{"h":"Entry requirements","t":"- Age 17 or older - Recognition of Prior Learning may be considered with proof of industry experience - IELTS (General or Academic) 5.5 overall with no band below 5, or an equivalent NZQA-approved English test"},{"h":"Intakes","t":"Intake dates: 2024-01-30 (Auckland), 2024-04-15 (Auckland), 2024-07-01 (Auckland), 2024-09-16 (Auckland), 2024-11-25 (Auckland). Admissions confirm the final dates."},{"h":"Programme Introduction","t":"The purpose of this qualification is:"},{"h":"Programme Introduction","t":"- To provide the hospitality sector with competent employees who are able to work as chefs in intermediate positions producing complex dishes in a commercial kitchen. - To provide individuals who are employed or will be employed as chefs in intermediate positions a qualification that will enhance their employment opportunities in a commercial kitchen across the hospitality sector. - To implement established standards of professional practice for complex cookery that can provide customers with confidence in a range of hospitality environments."},{"h":"Course Highlights","t":"The New Zealand Certificate in Cookery (Level 4) is a 36-week, 120 credit programme which will be delivered over four 9-week terms with a two-week break between terms."},{"h":"Course Highlights","t":"The programme provides fundamental knowledge and skills in cookery as well as to develop practical skills and applied knowledge in specific areas such as:"},{"h":"Course Highlights","t":"- health and safety in the workplace - food safety and security practices - application of standard operating policies and procedures - healthy eating, foods and special diets - internal and external customer interactions and communications - costing and menu planning - applied methods of cookery – preparing, cooking and finishing a wide range of complex dishes."},{"h":"Course Highlights","t":"In addition, students will also gain 'realistic work experience' in preparing, cooling and presenting a range of dishes in modern, fully equipped commercial kitchens."},{"h":"Course Structure","t":"Module 1: PC401 Introduction to Cookery"},{"h":"Course Structure","t":"This module covers health and safety and food safety, an introduction to kitchen procedures with a focus on knife usage and safety skills, and preparation of basic stocks, soups and sauces, leading to preparation of cold foods such as salads and dressings, sandwiches, cold entrée items and canapés. Food safety is an essential part of all practical lessons and assessments. Practical tuition is based on methods of cookery and covers a comprehensive food range which enables students to progress from basic to complex food preparation, cooking and presentations."},{"h":"Course Structure","t":"Module 2: PC402 Cookery Fundamentals"},{"h":"Course Structure","t":"This module further develops cooking competence by learning how to prepare, cook and present a range of simple dishes and introduces pasta, rice and farinaceous dishes, vegetables, fruits and pulses. Basic nutrition is introduced. The student continues to develop skills and knowledge through teaching of methods of cookery using a broad variety of commodities and students are exposed to realistic work experience in the restaurant kitchen where they practice communication skills and teamwork in a realistic work environment with all associated time constraints and pressures."},{"h":"Course Structure","t":"Module 3: PC403 Applied Complex Cookery Skills"},{"h":"Course Structure","t":"This module further enhances cooking competence through teaching fish and shellfish, meat, poultry and offal dishes. All dishes are 'complex' with vegetables, sauces and starch commodities. Students complete work plans and present all dishes under time pressure with the expectation that the dishes served are standard and quality for a paying customer."},{"h":"Course Structure","t":"Module 4: PC404 Patisserie and Healthy Diets"},{"h":"Course Structure","t":"This module focuses on baking and finishing of bakery products, and preparation, cooking and finishing of hot and cold desserts. Healthy foods and special diets are studied in this module. Students complete an end-point assessment where they are required to plan, cost, prepare and cook a 3-course meal which is served in the 'training' restaurant to paying customers with all associated time constraints and pressures. At the end of the module students sit for a summative theory exam covering the theory of all units."},{"h":"Graduate outcomes","t":"On successful completion of this programme and having achieved all the graduate profile outcomes, graduates will be able to:"},{"h":"Graduate outcomes","t":"- Monitor and maintain health and safety, food safety and security practices to ensure own safety and minimize potential hazards for customers. - Monitor and maintain effective communicate and interactions colleagues, other staff, managers and customers in a hospitality service environment. - Monitor and maintain the application of standard operating policies and procedures to work roles in a commercial kitchen. - Apply cookery skills to prepare, cook and present a range of cold larder dishes utilising complex preparation and presentation techniques. - Apply cookery skills to prepare, cook and present a range of hot kitchen dishes utilising complex preparation and presentation techniques. - Apply cookery skills to prepare, cook and present a range of patisserie and desserts utilising complex preparation and presentation techniques."}],"words":831},{"id":"course-c5","type":"course","title":"International Diploma in Food Preparation and Cookery Supervision (Advanced) (Level 5)","route":"course-c5","updated":"2024-01-16","source":"/courses/new-zealand-certificate-in-cookery-level-5/","sections":[{"h":"Summary","t":"International Diploma in Food Preparation and Cookery Supervision (Advanced) (Level 5). Advance into supervising food production, menu planning and costing, and event catering. Level 5, Cookery. Duration: 2 years."},{"h":"Fees","t":"Tuition fee: NZ$31,500. Materials: NZ$3,500. Total NZ$35,000."},{"h":"Entry requirements","t":"- Age 17 or older - Recognition of Prior Learning may be considered with proof of industry experience - IELTS (Academic) 5.5 overall with no band below 5, or an equivalent NZQA-approved English test"},{"h":"Intakes","t":"Intake dates: 2024-01-30 (Auckland), 2024-04-15 (Auckland), 2024-07-01 (Auckland), 2024-09-18 (Auckland), 2024-11-25 (Auckland). Admissions confirm the final dates."},{"h":"Programme Introduction","t":"The purpose of this qualification is:"},{"h":"Programme Introduction","t":"- To provide the hospitality sector with competent employees who are able to work as chefs in intermediate positions producing complex dishes in a commercial kitchen. - To provide individuals who are employed or will be employed as chefs in intermediate positions a qualification that will enhance their employment opportunities in a commercial kitchen across the hospitality sector. - To implement established standards of professional practice for complex cookery that can provide customers with confidence in a range of hospitality environments."},{"h":"Course Highlights","t":"- Supervise staff training - Food safety supervision for catering - Resource management in food preparation - Menu planning and costing - Global influences of eating & drinking - Supervise food production - Realistic work experience - Advanced food & beverage event - Advance applied food project"},{"h":"Course Structure","t":"- Module 1: PC 501 International cuisine studies - Module 2: PC 502 Advanced cold larder food production - Module 3: PC 503 Advanced hot kitchen food production - Module 4: PC 504 Kitchen operations - Module 5: PC 505 Advanced menu planning and restaurant service - Module 6: PC 506 Applied food service & event catering - Module 7: PC 507 Realistic work experience - Module 8: PC 508 Advanced applied food project"},{"h":"Graduate outcomes","t":"On successful completion of this programme and having achieved all the graduate profile outcomes, graduates will be able to:"},{"h":"Graduate outcomes","t":"- Monitor and maintain health and safety, food safety and security practices to ensure own safety and minimize potential hazards for customers. - Monitor and maintain effective communicate and interactions colleagues, other staff, managers and customers in a hospitality service environment. - Monitor and maintain the application of standard operating policies and procedures to work roles in a commercial kitchen. - Apply cookery skills to prepare, cook and present a range of cold larder dishes utilising complex preparation and presentation techniques. - Apply cookery skills to prepare, cook and present a range of hot kitchen dishes utilising complex preparation and presentation techniques. - Apply cookery skills to prepare, cook and present a range of patisserie and desserts utilising complex preparation and presentation techniques."}],"words":454},{"id":"course-fb4","type":"course","title":"New Zealand Certificate in Food and Beverage Service (Restaurant Services) (Level 4)","route":"course-fb4","updated":"2024-01-16","source":"/courses/food_beverage_service_l4/","sections":[{"h":"Summary","t":"New Zealand Certificate in Food and Beverage Service (Restaurant Services) (Level 4). Prepare for restaurant service roles with advanced food and beverage service skills. Level 4, Hospitality. Duration: 20 weeks, including a 2-week term break."},{"h":"Fees","t":"The fee for this programme is confirmed by admissions."},{"h":"Entry requirements","t":"- Age 18 or older (alcohol regulations) - Recognition of Prior Learning may be considered with proof of industry experience - IELTS (General or Academic) 5.5 overall with no band below 5, or an equivalent NZQA-approved English test"},{"h":"Intakes","t":"Intake dates: 2024-01-30 (Auckland), 2024-04-15 (Auckland), 2024-07-01 (Auckland), 2024-09-16 (Auckland), 2024-11-25 (Auckland). Admissions confirm the final dates."},{"h":"Programme Introduction","t":"The aim of this programme is to:"},{"h":"Programme Introduction","t":"- To prepare graduates with advanced knowledge, skills and understanding of food and beverage service and provide competent employees who are able to work as food servers in the restaurant services secto - To provide for those individuals who are employed as food servers a qualification that will enhance their employment opportunities across a range of restaurant service establishments. - To implement established standards of professional practice for advanced food and beverage service that can provide customers with confidence in a range of restaurant service environments"},{"h":"Programme Introduction","t":"Content"},{"h":"Programme Introduction","t":"Students will study the following modules over the 18-week duration of the programme:"},{"h":"Programme Introduction","t":"Module 202: Safety at Work"},{"h":"Programme Introduction","t":"- Module 203: Food Safety - Module 204: Customer Service - Module 207: Menu Knowledge and Design - Module 208: Hot Beverage Product Knowledge - Module 209: Beverage Product Knowledge - Module 210: Food and Beverage Service - Module 211: Handling Payments"},{"h":"Programme Introduction","t":"Outcome"},{"h":"Programme Introduction","t":"On successful completion of the programme, graduates will have met all the graduate profile outcomes of the qualification."},{"h":"Programme Introduction","t":"- Monitor and maintain health and safety, food safety and security practices to ensure own safety and minimise potential hazards when serving customers. - Monitor and maintain interactions between colleagues, managers and customers to provide efficient customer service. - Monitor and maintain the application of standard operating policies and procedures to work roles in a hospitality establishment."},{"h":"Programme Introduction","t":"Restaurant Services strand:"},{"h":"Programme Introduction","t":"- Monitor and maintain food and beverage service operations. - Monitor and maintain legislative compliance requirements for a hospitality establishment."}],"words":379},{"id":"course-h5","type":"course","title":"New Zealand Diploma in Hospitality Management (Level 5)","route":"course-h5","updated":"2024-01-16","source":"/courses/nz-diploma-in-hospitality-2/","sections":[{"h":"Summary","t":"New Zealand Diploma in Hospitality Management (Level 5). A one-year route into supervisory and business management, through to starting your own business. Level 5, Hospitality. Duration: 1 year."},{"h":"Fees","t":"Tuition fee: NZ$16,000. Materials: NZ$1,500. Total NZ$17,500."},{"h":"Entry requirements","t":"- Age 18 or older (alcohol regulations) - Hold ONE of: Year 12 School Certificate or equivalent; NCEA Level 3; a Level 4 hospitality qualification or equivalent; at least two years of relevant work experience; or be 20 or older with the aptitude to succeed - International learners: IELTS (Academic) 5.5 with no band below 5, or another recognised proficiency outcome"},{"h":"Intakes","t":"Intake dates: 2024-01-30 (Auckland), 2024-04-15 (Auckland), 2024-07-01 (Auckland), 2024-09-16 (Auckland), 2024-11-25 (Auckland). Admissions confirm the final dates."},{"h":"Programme Introduction","t":"New Zealand Diploma in Hospitality Management provides students with a pathway to enter the hospitality industry after only one year of study. You will learn supervisory management and business management right through to starting up your own business. You will also learn how to make sure the company you own or work for is profitable, the staff is competent and facilities are managed efficiently."},{"h":"Course Highlights","t":"Learning from seasoned hospitality professional tutors and guest speakers this is a fast track intensive course to help accelerate you into management positions in the hospitality industry. This course is suitable for all applicants who are ready to increase their employability and learn transferable skills that can be utilised in management within any industry."},{"h":"Course Structure","t":"• Staff training and development • Licensed premises management • Human resources management • Hospitality management control systems • Business management • Hospitality facility control and management"},{"h":"Course Structure","t":"PBRS' Diploma in Hospitality is an intensive course where students will learn to manage large enterprises from operational management, supervisory management, business training and assessments right through to starting up your own business."}],"words":304},{"id":"course-h6","type":"course","title":"New Zealand Diploma in Hospitality Management (Level 6)","route":"course-h6","updated":"2024-01-16","source":"/courses/diploma-in-hotel-management-level-6-2/","sections":[{"h":"Summary","t":"New Zealand Diploma in Hospitality Management (Level 6). Develop the strategic, people and financial management skills for senior hospitality roles. Level 6, Hospitality. Duration: 48 weeks including term breaks (120 credits, four 9-week terms)."},{"h":"Fees","t":"Tuition fee: NZ$14,000. Materials: NZ$1,500. Total NZ$15,500."},{"h":"Entry requirements","t":"- Age 18 or older - New Zealand Diploma in Hospitality Management Level 5, or equivalent with at least two years of hospitality work experience - International learners: IELTS (Academic) 6.0 overall with no band below 5.5, or another recognised proficiency outcome - Enrolment form and, where needed, an interview in person or by video"},{"h":"Intakes","t":"Intake dates: 2024-01-30 (Auckland), 2024-04-15 (Auckland), 2024-07-01 (Auckland), 2024-09-16 (Auckland), 2024-11-25 (Auckland). Admissions confirm the final dates."},{"h":"Programme overview","t":"Students will be able to manage and develop staff to optimise positive customer experiences and enhance positive staff relationships through communication, consultation, negotiation and reporting strategies. The programme further enables students to strategies for the future in relation to financial management, product development, marketing and continuous improvement processes."},{"h":"Programme overview","t":"Employment pathway"},{"h":"Programme overview","t":"This programme is targeted for those who would like to enhance their career in management roles with minimal supervision across a range of setting in the hospitality sector. The graduates will be able to gain opportunities within the hospitality industry in trainee manager or assistant manager roles such as: Food and Beverage Manager, Event Manager, Banquet Manager, Bar Manager, Café Manager, Restaurant Manager, Duty Manager and Operations Manager and to demonstrate professional practice and provide customers with confidence in their roles."},{"h":"Programme overview","t":""}],"words":257},{"id":"policy-immigration","type":"policy","title":"Enrolment policy: Immigration","route":"policies","anchor":"immigration","updated":"2022-08-26","sections":[{"h":"Immigration","t":"All international students must hold an appropriate visa or permit for their entire study period. Full details of immigration requirements, advice on rights to employment in New Zealand while studying, and reporting requirements are available from Immigration New Zealand, and can be viewed on their website at [www.immigration.govt.nz](https://www.immigration.govt.nz/new-zealand-visas)"}],"words":49},{"id":"policy-eligibility-for-health-services","type":"policy","title":"Enrolment policy: Eligibility for Health Services","route":"policies","anchor":"eligibility-for-health-services","updated":"2022-08-26","sections":[{"h":"Eligibility for Health Services","t":"Most international students are not entitled to publicly funded health services while in New Zealand. If you receive medical treatment during your visit, you may be liable for the full costs of that treatment. Full details on entitlements to publicly funded health services are available through the Ministry of Health, and can be viewed on their website at www.moh.govt.nz."},{"h":"Eligibility for Health Services","t":"All international students are required to declare any medical or learning needs before enrolment. Please note that international students are not eligible for special needs funding."},{"h":"Eligibility for Health Services","t":"If you need to take any medicine long term, please check if the medicine is available in New Zealand. If it is not, you may need to talk with your doctor and find another solution for your needs."}],"words":135},{"id":"policy-accident-insurance","type":"policy","title":"Enrolment policy: Accident Insurance","route":"policies","anchor":"accident-insurance","updated":"2022-08-26","sections":[{"h":"Accident Insurance","t":"The New Zealand Accident Compensation Corporation (ACC) provides accident insurance for all New Zealand citizens, residents, and temporary visitors to New Zealand, but you may still be liable for all other medical and related costs. Further information can be viewed on the ACC website at [www.acc.co.nz](http://www.acc.co.nz)"}],"words":48},{"id":"policy-medical-and-travel-insurance","type":"policy","title":"Enrolment policy: Medical and Travel Insurance","route":"policies","anchor":"medical-and-travel-insurance","updated":"2022-08-26","sections":[{"h":"Medical and Travel Insurance","t":"While an international student enrolled with PBRS for educational instruction of 2 weeks' duration or longer, the student must have appropriate insurance to cover—"},{"h":"Medical and Travel Insurance","t":"(a) the student's travel—"},{"h":"Medical and Travel Insurance","t":"(i) to and from New Zealand; and"},{"h":"Medical and Travel Insurance","t":"(ii) within New Zealand; and"},{"h":"Medical and Travel Insurance","t":"(iii) if the travel is part of the course, outside New Zealand; and"},{"h":"Medical and Travel Insurance","t":"(b) medical care in New Zealand, including diagnosis, prescription, surgery, and hospitalisation; and"},{"h":"Medical and Travel Insurance","t":"(c) repatriation or expatriation of the student as a result of serious illness or injury, including cover of travel costs incurred by family members assisting repatriation or expatriation; and"},{"h":"Medical and Travel Insurance","t":"(d) death of the student, including cover of—"},{"h":"Medical and Travel Insurance","t":"(i) travel costs of family members to and from New Zealand; and"},{"h":"Medical and Travel Insurance","t":"(ii) costs of repatriation or expatriation of the body; and"},{"h":"Medical and Travel Insurance","t":"(iii) funeral expenses."},{"h":"Medical and Travel Insurance","t":"PBRS provides medical and travel insurance through a New Zealand insurance company. PBRS has assessed the policies provided by the insurance company. Insurance is compulsory for all international students studying at PBRS and will automatically be charged for unless an alternative insurance compliant with the Code of Practice has already been arranged. Please make sure you have declared all of your medical needs prior to your enrolment. Please be aware that insurance arranged by PBRS will not cover your previous health issues."},{"h":"Medical and Travel Insurance","t":"With prior notification and forewarning, failing to present the up-to-date and effective insurance policy as an international student or failing to present it before the required date will be seen as deliberate violation of PBRS's rules and regulations. PBRS will exercise its right to suspend or terminate the student's study and report the case to all relevant departments (e.g. Immigration New Zealand). In this case, the individual student will be fully responsible for any consequences arise."}],"words":338},{"id":"policy-fees","type":"policy","title":"Enrolment policy: Fees","route":"policies","anchor":"fees","updated":"2022-08-26","sections":[{"h":"Fees","t":"The Student fee payment schedule will be issued upon the receipt of an application form and all supporting documents. Fees are due for payment, before the start of your program of study. Once tuition has commenced, tuition fees will remain the same irrespective of changes to immigration status, for instance obtaining Permanent Residency, and any other changes. Prior to commencement, tuition fees are subject to change without notice. Where a student still owes money to PBRS for any outstanding items, the final qualification certificate(s) will not be issued until all accounts have been paid."},{"h":"Fees","t":"Apart from fees that the student paid prior to commencement, students may need to pay for any failed courses or administrative fees. Please see our Student Handbook for details."}],"words":125},{"id":"policy-fee-protection","type":"policy","title":"Enrolment policy: Fee Protection","route":"policies","anchor":"fee-protection","updated":"2022-08-26","sections":[{"h":"Fee Protection","t":"The New Zealand Government requires that all Private Training Establishments (PTE) registered with NZQA protect student fees paid to them in advance. At PBRS, all students' fees will be deposited in the government owned public trust account administered by NZ Public Trust. The fees will be released on a pro rata basis from this trust account in accordance with an agreed monthly schedule based on tuition delivered and until the completion of the program."}],"words":76},{"id":"policy-withdrawal-and-refund-policy","type":"policy","t
